<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc" data-material-kind="explanatory-reconstruction">
<title id="title">한 자료 요약과 여러 자료의 개념 문서 비교</title>
<desc id="desc">실제 실행 화면이 아닌 설명용 재구성 예시. 한 자료 요약은 context-note.md의 목적과 맥락 예문과 원자료 입구를 보존한다. 개념 문서는 목적과 맥락·검색과 비교·지식의 활용의 근거 세 개와 RAG와 위키 비교·현재 계획의 기존 연결 두 개를 보존한다. 두 열 사이의 새 인과나 자동 합성 방향을 추가하지 않는다.</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" letter-spacing="-.4">
<text x="25" y="50" font-size="50" fill="#F6F6F4" font-weight="600" text-anchor="start" data-copy-role="essential">자료 요약</text>
<text x="785" y="50" font-size="50" fill="#F6F6F4" font-weight="600" text-anchor="start" data-copy-role="essential">개념 문서</text>
<text x="25" y="105" font-size="44" fill="#C5C5C0" font-weight="400" text-anchor="start" data-copy-role="essential">한 자료의 요지</text>
<text x="785" y="105" font-size="44" fill="#C5C5C0" font-weight="400" text-anchor="start" data-copy-role="essential">여러 자료의 공통 주제</text>
<path d="M25 135H690" fill="none" stroke="#999995" stroke-width="3"/>
<path d="M785 135H1475" fill="none" stroke="#999995" stroke-width="3"/>
<text x="25" y="195" font-size="46" fill="#F6F6F4" font-weight="550" text-anchor="start" data-copy-role="essential">목적과 맥락</text>
<text x="785" y="195" font-size="46" fill="#F6F6F4" font-weight="550" text-anchor="start" data-copy-role="essential">LLM Wiki</text>
<text x="25" y="260" font-size="44" fill="#F6F6F4" font-weight="400" text-anchor="start" data-copy-role="essential">자료를 넣는 목적을 정한다.</text>
<text x="25" y="315" font-size="44" fill="#F6F6F4" font-weight="400" text-anchor="start" data-copy-role="essential">내 이유와 다음 쓰임을 적는다.</text>
<text x="785" y="260" font-size="44" fill="#F6F6F4" font-weight="400" text-anchor="start" data-copy-role="essential">자료 사이의 관계와 현재 이해를</text>
<text x="785" y="315" font-size="44" fill="#F6F6F4" font-weight="400" text-anchor="start" data-copy-role="essential">연결된 문서로 작성하고 갱신한다.</text>
<text x="25" y="370" font-size="44" fill="#C5C5C0" font-weight="400" text-anchor="start" data-copy-role="essential">한 메모를 다시 읽는 입구</text>
<text x="25" y="440" font-size="44" fill="#C5C5C0" font-weight="400" text-anchor="start" data-copy-role="essential">근거 · context-note.md</text>
<text x="785" y="370" font-size="44" fill="#C5C5C0" font-weight="400" text-anchor="start" data-copy-role="essential">근거 · 목적과 맥락 / 검색과 비교</text>
<text x="785" y="425" font-size="44" fill="#C5C5C0" font-weight="400" text-anchor="start" data-copy-role="essential">지식의 활용</text>
<text x="785" y="500" font-size="44" fill="#69CF82" font-weight="400" text-anchor="start" data-copy-role="essential">연결 · RAG와 위키 비교</text>
<text x="785" y="555" font-size="44" fill="#69CF82" font-weight="400" text-anchor="start" data-copy-role="essential">현재 계획</text>
</g>
</svg>
