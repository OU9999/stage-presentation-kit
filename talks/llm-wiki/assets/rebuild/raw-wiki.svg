<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title desc">
<title id="title">보존하는 원자료와 갱신하는 위키</title>
<desc id="desc">설명용 스터디 폴더. raw에는 RAG와 LoRA 읽기 메모를 보존한다. wiki에는 개념, 비교, 질문과 답을 작성하고 갱신한다. rules.md는 이 전체 작업의 규칙이다.</desc>
<rect width="1500" height="540" fill="#080808"/>
<g font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.35"><rect x="0" y="20" width="470" height="430" fill="#f2f0e8"/><text x="38" y="88" font-size="48" fill="#232321" font-weight="600" text-anchor="start">raw/</text><text x="38" y="139" font-size="30" fill="#6b6b65" font-weight="400" text-anchor="start">원자료를 보존</text><path d="M38 168L432 168" fill="none" stroke="#cac8c0" stroke-width="1.5"/><text x="38" y="238" font-size="36" fill="#232321" font-weight="400" text-anchor="start">rag-note.md</text><text x="38" y="300" font-size="36" fill="#232321" font-weight="400" text-anchor="start">lora-note.md</text><text x="38" y="414" font-size="28" fill="#6b6b65" font-weight="400" text-anchor="start">원문 링크 · 읽기 메모</text><path d="M493 265L553 265" fill="none" stroke="#a5a5a0" stroke-width="2"/><path d="M540 257L553 265L540 273" fill="none" stroke="#a5a5a0" stroke-width="2"/><rect x="580" y="20" width="920" height="430" fill="#f2f0e8"/><text x="622" y="88" font-size="48" fill="#232321" font-weight="600" text-anchor="start">wiki/</text><text x="622" y="139" font-size="30" fill="#6b6b65" font-weight="400" text-anchor="start">개념과 비교를 작성·갱신</text><path d="M622 168L1458 168" fill="none" stroke="#cac8c0" stroke-width="1.5"/><text x="622" y="235" font-size="34" fill="#275f89" font-weight="400" text-anchor="start">concepts/</text><text x="875" y="235" font-size="34" fill="#232321" font-weight="400" text-anchor="start">검색해 읽기 · 모델 적응</text><text x="622" y="305" font-size="34" fill="#275f89" font-weight="400" text-anchor="start">comparisons/</text><text x="875" y="305" font-size="34" fill="#232321" font-weight="400" text-anchor="start">입력 문맥과 파라미터</text><text x="622" y="375" font-size="34" fill="#275f89" font-weight="400" text-anchor="start">questions/</text><text x="875" y="375" font-size="34" fill="#232321" font-weight="400" text-anchor="start">다시 쓸 질문과 답</text><text x="0" y="510" font-size="28" fill="#a5a5a0" font-weight="400" text-anchor="start">rules.md  읽기·쓰기·근거·점검의 규칙</text></g>
