<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title desc">
<title id="title">새 자료로 검색 판단의 비교 축이 추가된 같은 위키</title>
<desc id="desc">설명용 구성 예. 기존 RAG와 미세조정의 차이를 유지한다. 새 agentic RAG 메모를 읽어 에이전트가 검색할 곳과 방법과 반복을 결정할 수 있다는 비교 축을 기존 문서에 보완하고 새 근거를 연결한다.</desc>
<rect width="1500" height="540" fill="#080808"/>
