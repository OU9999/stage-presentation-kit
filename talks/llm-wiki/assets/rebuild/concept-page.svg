<title id="title">위키의 검색해 읽기 개념 페이지</title>
<desc id="desc">설명용 구성 예. 관련 자료를 찾아 현재 답변의 입력에 사용하는 개념을 설명한다. 모델의 파라미터를 바꾸는 학습과 구별하고, 모델 적응과 문맥 대 가중치 비교 및 원문 근거에 연결한다.</desc>
