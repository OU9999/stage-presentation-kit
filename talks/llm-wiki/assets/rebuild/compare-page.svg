<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title desc">
<title id="title">입력 문맥과 파라미터를 비교한 위키 문서</title>
<desc id="desc">설명용 구성 예. 같은 비교 페이지에서 RAG는 관련 자료를 현재 입력에 사용하고 미세조정은 학습으로 파라미터나 어댑터를 조정한다는 차이를 읽는다. 관련 개념과 원자료를 연결한다.</desc>
<rect width="1500" height="540" fill="#080808"/>
<g font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.35"><rect x="0" y="8" width="1500" height="524" fill="#f2f0e8"/><text x="42" y="59" font-size="26" fill="#6b6b65" font-weight="400" text-anchor="start">wiki/comparisons/context-vs-weights.md</text><path d="M42 82L1458 82" fill="none" stroke="#cac8c0" stroke-width="1.5"/><text x="42" y="148" font-size="44" fill="#232321" font-weight="600" text-anchor="start">입력 문맥과 모델의 파라미터</text><text x="42" y="222" font-size="34" fill="#275f89" font-weight="600" text-anchor="start">RAG</text><text x="796" y="222" font-size="34" fill="#275f89" font-weight="600" text-anchor="start">미세조정</text><path d="M750 193L750 387" fill="none" stroke="#cac8c0" stroke-width="1.5"/><text x="42" y="281" font-size="38" fill="#232321" font-weight="400" text-anchor="start">찾은 자료를 읽어</text><text x="42" y="335" font-size="38" fill="#232321" font-weight="400" text-anchor="start">답의 입력에 사용한다.</text><text x="796" y="281" font-size="38" fill="#232321" font-weight="400" text-anchor="start">예제로 학습해</text><text x="796" y="335" font-size="38" fill="#232321" font-weight="400" text-anchor="start">모델의 동작을 조정한다.</text><text x="42" y="391" font-size="30" fill="#6b6b65" font-weight="400" text-anchor="start">바뀌는 대상: 현재 입력 문맥</text><text x="796" y="391" font-size="30" fill="#6b6b65" font-weight="400" text-anchor="start">바뀌는 대상: 파라미터·어댑터</text><path d="M42 431L1458 431" fill="none" stroke="#cac8c0" stroke-width="1.5"/><text x="42" y="485" font-size="30" fill="#275f89" font-weight="400" text-anchor="start">연결  [[검색해 읽기]]  [[모델 적응]]</text><text x="1458" y="485" font-size="26" fill="#6b6b65" font-weight="400" text-anchor="end">근거: rag-note · lora-note</text></g>
</svg>
