<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title desc">
<title id="title">자료를 개념과 기존 비교에 연결하는 인제스트</title>
<desc id="desc">설명용 구성 예. RAG 읽기 메모를 읽어 검색해 읽기 개념을 작성하고, 기존 문맥과 가중치 비교 페이지에 연결하며 원자료 근거를 남긴다.</desc>
<rect width="1500" height="540" fill="#080808"/>
<g font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.35"><rect x="0" y="30" width="500" height="480" fill="#f2f0e8"/><text x="36" y="86" font-size="28" fill="#6b6b65" font-weight="400" text-anchor="start">raw/rag-note.md</text><path d="M36 110L464 110" fill="none" stroke="#cac8c0" stroke-width="1.5"/><text x="36" y="180" font-size="42" fill="#232321" font-weight="600" text-anchor="start">RAG 읽기 메모</text><text x="36" y="256" font-size="36" fill="#232321" font-weight="400" text-anchor="start">필요한 자료를 찾아</text><text x="36" y="311" font-size="36" fill="#232321" font-weight="400" text-anchor="start">답의 입력에 사용한다.</text><text x="36" y="449" font-size="28" fill="#6b6b65" font-weight="400" text-anchor="start">원문을 확인한 메모</text><path d="M525 271L626 271" fill="none" stroke="#a5a5a0" stroke-width="2"/><path d="M613 263L626 271L613 279" fill="none" stroke="#a5a5a0" stroke-width="2"/><rect x="652" y="30" width="848" height="480" fill="#f2f0e8"/><text x="692" y="86" font-size="28" fill="#6b6b65" font-weight="400" text-anchor="start">wiki/concepts/retrieval.md</text><path d="M692 110L1460 110" fill="none" stroke="#cac8c0" stroke-width="1.5"/><text x="692" y="180" font-size="44" fill="#232321" font-weight="600" text-anchor="start">검색해 읽기</text><text x="692" y="256" font-size="36" fill="#232321" font-weight="400" text-anchor="start">관련 자료를 찾아</text><text x="692" y="311" font-size="36" fill="#232321" font-weight="400" text-anchor="start">현재 답변의 문맥에 넣는다.</text><path d="M692 356L1460 356" fill="none" stroke="#cac8c0" stroke-width="1.5"/><text x="692" y="407" font-size="32" fill="#275f89" font-weight="400" text-anchor="start">기존 비교에 연결  [[문맥과 가중치]]</text><text x="692" y="458" font-size="28" fill="#6b6b65" font-weight="400" text-anchor="start">근거  rag-note.md → 원문 링크</text></g>
