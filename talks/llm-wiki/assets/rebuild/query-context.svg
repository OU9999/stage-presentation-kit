<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title desc">
<title id="title">관련 위키를 찾아 현재 답변의 문맥에 읽는 질문 과정</title>
<desc id="desc">설명용 구성 예. 우리 스터디의 최신 정정을 어디 반영할지 질문한다. 작업 규칙, 기존 문맥과 가중치 비교, 관련 원자료를 실제 답변 문맥으로 읽어 정정을 위키에 남기고 다음 답변에서 다시 읽으라고 답한다.</desc>
<rect width="1500" height="540" fill="#080808"/>
<g font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.35"><text x="0" y="83" font-size="30" fill="#a5a5a0" font-weight="400" text-anchor="start">다음 질문</text><text x="0" y="163" font-size="43" fill="#f6f6f4" font-weight="500" text-anchor="start">우리 스터디의</text><text x="0" y="227" font-size="43" fill="#f6f6f4" font-weight="500" text-anchor="start">최신 정정은 어디에</text><text x="0" y="291" font-size="43" fill="#f6f6f4" font-weight="500" text-anchor="start">반영할까요?</text><path d="M437 337L530 337" fill="none" stroke="#a5a5a0" stroke-width="2"/><path d="M517 329L530 337L517 345" fill="none" stroke="#a5a5a0" stroke-width="2"/><rect x="570" y="20" width="930" height="500" fill="#f2f0e8"/><text x="612" y="81" font-size="38" fill="#232321" font-weight="600" text-anchor="start">이번 답변에서 읽은 문맥</text><path d="M612 111L1458 111" fill="none" stroke="#cac8c0" stroke-width="1.5"/><text x="612" y="169" font-size="32" fill="#6b6b65" font-weight="400" text-anchor="start">작업 규칙</text><text x="612" y="218" font-size="32" fill="#6b6b65" font-weight="400" text-anchor="start">문맥과 가중치 비교 · 관련 원자료</text><path d="M612 259L1458 259" fill="none" stroke="#cac8c0" stroke-width="1.5"/><text x="612" y="330" font-size="38" fill="#232321" font-weight="400" text-anchor="start">정정을 위키에 남기고,</text><text x="612" y="387" font-size="38" fill="#232321" font-weight="400" text-anchor="start">다음 답변에서 다시 읽습니다.</text><text x="612" y="470" font-size="28" fill="#275f89" font-weight="400" text-anchor="start">관련 페이지를 찾아 실제 입력에 읽어 넣기</text></g>
</svg>
