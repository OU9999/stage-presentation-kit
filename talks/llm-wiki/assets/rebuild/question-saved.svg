<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title desc">
<title id="title">답과 근거가 남은 질문 페이지</title>
<desc id="desc">설명용 구성 예. 스터디의 최신 정정을 위키에 남기고 다음 답변에서 관련 페이지를 찾아 읽는다는 답을 질문 파일에 저장한다. 위키 수정은 모델 학습이 아니며, 비교 페이지와 관련 원자료를 근거로 연결한다.</desc>
<rect width="1500" height="540" fill="#080808"/>
<g font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.35"><text x="16" y="54" font-size="30" fill="#a5a5a0" font-weight="400" text-anchor="start">my-study/</text><text x="16" y="119" font-size="34" fill="#f6f6f4" font-weight="400" text-anchor="start">raw/</text><text x="38" y="167" font-size="26" fill="#a5a5a0" font-weight="400" text-anchor="start">rag-note.md</text><text x="38" y="209" font-size="26" fill="#a5a5a0" font-weight="400" text-anchor="start">lora-note.md</text><text x="16" y="274" font-size="34" fill="#f6f6f4" font-weight="400" text-anchor="start">wiki/</text><text x="38" y="324" font-size="28" fill="#a5a5a0" font-weight="400" text-anchor="start">concepts/</text><text x="38" y="370" font-size="28" fill="#a5a5a0" font-weight="400" text-anchor="start">comparisons/</text><text x="38" y="416" font-size="28" fill="#f6f6f4" font-weight="400" text-anchor="start">questions/</text><path d="M16 393L16 421" fill="none" stroke="#69cf82" stroke-width="3"/><text x="16" y="502" font-size="28" fill="#a5a5a0" font-weight="400" text-anchor="start">rules.md</text><rect x="355" y="8" width="1145" height="524" fill="#f2f0e8"/><text x="397" y="59" font-size="26" fill="#6b6b65" font-weight="400" text-anchor="start">wiki/questions/study-corrections.md</text><path d="M397 82L1458 82" fill="none" stroke="#cac8c0" stroke-width="1.5"/><text x="397" y="148" font-size="44" fill="#232321" font-weight="600" text-anchor="start">스터디의 최신 정정 반영</text><text x="397" y="227" font-size="34" fill="#232321" font-weight="400" text-anchor="start">정정은 검토한 위키 문서에 남긴다.</text><text x="397" y="282" font-size="34" fill="#232321" font-weight="400" text-anchor="start">다음 답변에서 관련 페이지를 찾아 읽는다.</text><text x="397" y="373" font-size="34" fill="#275f89" font-weight="400" text-anchor="start">위키 수정이 모델 학습은 아니다.</text><path d="M397 412L1458 412" fill="none" stroke="#cac8c0" stroke-width="1.5"/><text x="397" y="459" font-size="30" fill="#6b6b65" font-weight="400" text-anchor="start">근거  [[문맥과 가중치]]  +  관련 원자료</text><text x="397" y="507" font-size="28" fill="#6b6b65" font-weight="400" text-anchor="start">다음 확인  바뀐 설명이 다음 답변에도 쓰이는가</text></g>
</svg>
