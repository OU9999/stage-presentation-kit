<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title desc">
<title id="title">문서의 근거와 내용과 연결을 점검하는 린트</title>
<desc id="desc">설명용 구성 예. 개념 페이지를 다시 읽으며 근거가 맞는지, 설명이 오래되었는지, 연결이 열리는지 확인한다. 파일과 링크 검사만으로 의미 정확도가 보장되지는 않는다.</desc>
<rect width="1500" height="540" fill="#080808"/>
<g font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.35"><rect x="0" y="8" width="1000" height="524" fill="#f2f0e8"/><text x="42" y="59" font-size="26" fill="#6b6b65" font-weight="400" text-anchor="start">wiki/concepts/retrieval.md</text><path d="M42 82L958 82" fill="none" stroke="#cac8c0" stroke-width="1.5"/><text x="42" y="148" font-size="44" fill="#232321" font-weight="600" text-anchor="start">검색해 읽기</text><text x="42" y="229" font-size="38" fill="#232321" font-weight="400" text-anchor="start">관련 자료를 찾아</text><text x="42" y="287" font-size="38" fill="#232321" font-weight="400" text-anchor="start">현재 답변의 입력에 사용한다.</text><path d="M42 345L958 345" fill="none" stroke="#cac8c0" stroke-width="1.5"/><text x="42" y="398" font-size="32" fill="#275f89" font-weight="400" text-anchor="start">연결  [[문맥과 가중치]]</text><text x="42" y="459" font-size="30" fill="#6b6b65" font-weight="400" text-anchor="start">근거  rag-note.md → 원문 링크</text><text x="1075" y="85" font-size="32" fill="#a5a5a0" font-weight="400" text-anchor="start">읽고 확인하기</text><text x="1075" y="180" font-size="38" fill="#f6f6f4" font-weight="400" text-anchor="start">근거가 맞는가</text><text x="1075" y="268" font-size="38" fill="#f6f6f4" font-weight="400" text-anchor="start">설명이 낡았는가</text><text x="1075" y="356" font-size="38" fill="#f6f6f4" font-weight="400" text-anchor="start">연결이 열리는가</text><path d="M1075 407L1480 407" fill="none" stroke="#555550" stroke-width="1.5"/><text x="1075" y="463" font-size="30" fill="#a5a5a0" font-weight="400" text-anchor="start">파일 점검만으로</text><text x="1075" y="509" font-size="30" fill="#a5a5a0" font-weight="400" text-anchor="start">의미가 맞지는 않는다.</text></g>
</svg>
