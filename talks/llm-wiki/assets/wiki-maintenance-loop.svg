<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">원자료를 읽어 위키를 유지하고 질문의 답도 다시 저장하는 순환</title><desc id="desc">파일 도구가 있는 LLM 에이전트가 원자료를 현재 문맥에 읽고 개체·개념·비교·잠정 종합을 작성한다. 새 질문은 위키를 찾아 읽고 유용한 답을 다시 페이지로 저장한다. 작업 규칙은 옆에서 전체 작업에 적용한다.</desc><rect width="1400" height="620" fill="#090909"/><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="40" y="100" width="250" height="240" rx="18" fill="#131719" stroke="#24a8ff" stroke-width="2"/><text x="65" y="150" font-size="44" font-weight="700" fill="#f5f5f2" text-anchor="start">원자료</text><text x="65" y="207" font-size="30" font-weight="500" fill="#24a8ff" text-anchor="start">읽은 판을 보존</text><text x="65" y="267" font-size="30" font-weight="500" fill="#b7bab8" text-anchor="start">메모 · 문서</text><path d="M306 220L455 220" fill="none" stroke="#24a8ff" stroke-width="3"/><path d="M441 211L455 220L441 229" fill="none" stroke="#24a8ff" stroke-width="3"/><text x="380" y="183" font-size="30" font-weight="500" fill="#b7bab8" text-anchor="middle">읽음</text><rect x="470" y="100" width="290" height="240" rx="18" fill="#131719" stroke="#a080ff" stroke-width="2"/><text x="495" y="150" font-size="40" font-weight="700" fill="#f5f5f2" text-anchor="start">LLM 에이전트</text><text x="495" y="208" font-size="30" font-weight="500" fill="#a080ff" text-anchor="start">현재 문맥에 읽고</text><text x="495" y="261" font-size="30" font-weight="500" fill="#b7bab8" text-anchor="start">도구로 파일을 씀</text><path d="M778 220L925 220" fill="none" stroke="#69cf82" stroke-width="3"/><path d="M911 211L925 220L911 229" fill="none" stroke="#69cf82" stroke-width="3"/><text x="850" y="183" font-size="30" font-weight="500" fill="#69cf82" text-anchor="middle">작성·갱신</text><rect x="940" y="100" width="420" height="240" rx="18" fill="#131719" stroke="#69cf82" stroke-width="2"/><text x="968" y="150" font-size="44" font-weight="700" fill="#f5f5f2" text-anchor="start">지속하는 위키</text><text x="968" y="210" font-size="32" font-weight="500" fill="#69cf82" text-anchor="start">개체 · 개념 · 비교</text><text x="968" y="270" font-size="32" font-weight="500" fill="#b7bab8" text-anchor="start">잠정 종합 · 질문 답</text><path d="M1150 340V450H905" fill="none" stroke="#69cf82" stroke-width="3"/><path d="M919 441L905 450L919 459" fill="none" stroke="#69cf82" stroke-width="3"/><text x="1190" y="420" font-size="28" font-weight="500" fill="#69cf82" text-anchor="start">찾아 읽음</text><rect x="470" y="405" width="420" height="140" rx="18" fill="#131719" stroke="#ffac5c" stroke-width="2"/><text x="495" y="453" font-size="36" font-weight="700" fill="#f5f5f2" text-anchor="start">새 질문 → 답</text><text x="495" y="507" font-size="29" font-weight="500" fill="#ffac5c" text-anchor="start">유용한 답을 위키에 저장</text><path d="M890 510L1300 510" fill="none" stroke="#ffac5c" stroke-width="3"/><path d="M1300 510L1300 355" fill="none" stroke="#ffac5c" stroke-width="3"/><path d="M1291 369L1300 355L1309 369" fill="none" stroke="#ffac5c" stroke-width="3"/><text x="1025" y="552" font-size="28" font-weight="500" fill="#ffac5c" text-anchor="start">답 저장의 귀환</text><text x="40" y="422" font-size="34" font-weight="700" fill="#a080ff" text-anchor="start">작업 규칙</text><text x="40" y="470" font-size="28" font-weight="500" fill="#b7bab8" text-anchor="start">읽기·쓰기·질문·점검</text><text x="40" y="518" font-size="28" font-weight="500" fill="#b7bab8" text-anchor="start">전체에 적용</text></g></svg>
