<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">같은 형식의 고객 요청을 목적과 전달 방식으로 비교하고 회의 뒤 응대 지식을 갱신한다</title><desc id="desc">두 가상 상담을 동등하게 표시한다. A는 월말 정산용 수동 다운로드, B는 매일 대시보드용 자동 수집을 요청한다. 새 회의는 수동 CSV 범위 검토와 예약 전송 보류를 정한다. LLM은 개념·요구 비교·FAQ를 갱신하며 고객 B 응대에 출시일 미확정을 남긴다.</desc><rect width="1400" height="620" fill="#090909"/><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="40" y="65" font-size="28" font-weight="500" fill="#b7bab8" text-anchor="start">가상 고객 상담 · 회의로 갱신하는 적용 예</text><rect x="40" y="105" width="630" height="180" rx="18" fill="#131719" stroke="#24a8ff" stroke-width="2"/><text x="68" y="154" font-size="38" font-weight="700" fill="#f5f5f2" text-anchor="start">상담 A</text><text x="68" y="211" font-size="30" font-weight="500" fill="#24a8ff" text-anchor="start">월말 정산</text><text x="68" y="255" font-size="30" font-weight="500" fill="#f5f5f2" text-anchor="start">CSV 수동 다운로드</text><rect x="730" y="105" width="630" height="180" rx="18" fill="#131719" stroke="#24a8ff" stroke-width="2"/><text x="758" y="154" font-size="38" font-weight="700" fill="#f5f5f2" text-anchor="start">상담 B</text><text x="758" y="211" font-size="30" font-weight="500" fill="#24a8ff" text-anchor="start">매일 대시보드 갱신</text><text x="758" y="255" font-size="30" font-weight="500" fill="#f5f5f2" text-anchor="start">CSV 자동 수집</text><text x="40" y="350" font-size="34" font-weight="700" fill="#a080ff" text-anchor="start">새 회의</text><text x="235" y="350" font-size="34" font-weight="700" fill="#f5f5f2" text-anchor="start">수동 CSV 범위 검토 · 예약 전송 보류</text><path d="M700 375L940 375" fill="none" stroke="#69cf82" stroke-width="3"/><path d="M926 366L940 375L926 384" fill="none" stroke="#69cf82" stroke-width="3"/><text x="40" y="430" font-size="32" font-weight="700" fill="#69cf82" text-anchor="start">LLM 갱신</text><text x="235" y="430" font-size="34" font-weight="500" fill="#69cf82" text-anchor="start">내보내기 개념 · 요구 비교 · 응대 FAQ</text><path d="M40 465L1360 465" fill="none" stroke="#a080ff" stroke-width="3"/><text x="40" y="525" font-size="32" font-weight="700" fill="#a080ff" text-anchor="start">후속 질문</text><text x="235" y="525" font-size="38" font-weight="700" fill="#f5f5f2" text-anchor="start">고객 B에게 지금 무엇을 말할까?</text><text x="235" y="580" font-size="28" font-weight="500" fill="#b7bab8" text-anchor="start">요청은 보존하고, 출시일이 미확정이라는 경계를 답에 남깁니다.</text></g></svg>
