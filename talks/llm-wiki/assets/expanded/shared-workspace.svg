<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">여러 작업자가 같은 위키와 기준을 읽는 공유 작업</title>
<desc id="desc">사람의 목적 아래 작성 역할과 검토 역할이 같은 원자료·개념·비교·현재 계획·결정 이유·결과물·남은 확인을 참조하는 구성 예. 실제 유명인이나 특정 봇이 참여한다는 표현 없이 역할과 공통 지식의 관계를 보여준다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="64" font-size="39" fill="#BD4B45" font-weight="600" text-anchor="start">사람의 목적: 다음 스터디의 한 쪽 진행안</text><rect x="35" y="174" width="330" height="320" rx="10" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><text x="75" y="240" font-size="38" fill="#286A5B" font-weight="600" text-anchor="start">작성 역할</text><text x="75" y="324" font-size="35" fill="#252A28" font-weight="400" text-anchor="start">읽기 · 초안</text><text x="75" y="391" font-size="35" fill="#252A28" font-weight="400" text-anchor="start">관계 연결</text><text x="75" y="457" font-size="28" fill="#68716B" font-weight="400" text-anchor="start">각자 작업하며</text><path d="M383 328L452 328" fill="none" stroke="#286A5B" stroke-width="2"/><path d="M439 320L452 328L439 336" fill="none" stroke="#286A5B" stroke-width="2"/><rect x="478" y="122" width="644" height="383" rx="12" fill="#172238"/><text x="522" y="188" font-size="42" fill="#FCFBF7" font-weight="600" text-anchor="start">함께 읽는 위키</text><text x="522" y="272" font-size="34" fill="#FCFBF7" font-weight="400" text-anchor="start">원자료 · 개념 · 비교</text><text x="522" y="345" font-size="34" fill="#FCFBF7" font-weight="400" text-anchor="start">현재 계획과 결정의 이유</text><text x="522" y="418" font-size="34" fill="#FCFBF7" font-weight="400" text-anchor="start">결과물과 남은 확인</text><text x="522" y="467" font-size="28" fill="#63D7C5" font-weight="400" text-anchor="start">같은 근거와 현재 결정을 참조</text><path d="M1140 328L1205 328" fill="none" stroke="#286A5B" stroke-width="2"/><path d="M1192 320L1205 328L1192 336" fill="none" stroke="#286A5B" stroke-width="2"/><text x="1241" y="240" font-size="36" fill="#286A5B" font-weight="600" text-anchor="start">검토 역할</text><text x="1241" y="323" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">근거 대조</text><text x="1241" y="389" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">조건 확인</text><text x="1241" y="455" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">수정 제안</text><path d="M1331 475C1331 550 820 560 800 521" fill="none" stroke="#BD4B45" stroke-width="2"/><text x="35" y="580" font-size="30" fill="#68716B" font-weight="400" text-anchor="start">역할을 나눠도, 공유할 목적·근거·현재 결정을 함께 읽습니다.</text></g>
</svg>
