<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">가상 새 조건이 관련 설명과 현재 계획을 바꾸는 모습</title>
<desc id="desc">입문자와 준비된 주제 메모 팩을 쓰는 15분 활동이라는 가상 조건을 반영한다. 보편적인 LLM Wiki 정의를 바꾸는 대신 우리 적용 범위·선택 기준·현재 계획의 작업과 시간을 갱신하며 목차·로그·관련 질문도 확인한다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="119" font-size="35" fill="#FF7A3D" font-weight="550" text-anchor="start">새 모임 조건</text><text x="35" y="224" font-size="40" fill="#F6F6F4" font-weight="400" text-anchor="start">입문자와 함께</text><text x="35" y="309" font-size="40" fill="#F6F6F4" font-weight="400" text-anchor="start">준비된 읽기 팩</text><text x="35" y="394" font-size="40" fill="#F6F6F4" font-weight="400" text-anchor="start">15분 활동</text><text x="35" y="531" font-size="28" fill="#A4A4A1" font-weight="400" text-anchor="start">설명용 가상 조건</text><path d="M433 315L515 315" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M502 307L515 315L502 323" fill="none" stroke="#5A5A57" stroke-width="2"/><text x="570" y="126" font-size="30" fill="#A4A4A1" font-weight="400" text-anchor="start">개념 · 우리 적용 범위</text><text x="570" y="196" font-size="42" fill="#F6F6F4" font-weight="500" text-anchor="start">입문 설명부터 다룹니다.</text><path d="M570 225L1455 225" fill="none" stroke="#5A5A57" stroke-width="1"/><text x="570" y="300" font-size="30" fill="#A4A4A1" font-weight="400" text-anchor="start">비교 · 선택 기준</text><text x="570" y="370" font-size="42" fill="#F6F6F4" font-weight="500" text-anchor="start">작은 자료 묶음으로 시작합니다.</text><path d="M570 399L1455 399" fill="none" stroke="#5A5A57" stroke-width="1"/><text x="570" y="474" font-size="30" fill="#A4A4A1" font-weight="400" text-anchor="start">계획 · 작업과 시간</text><text x="570" y="544" font-size="42" fill="#F6F6F4" font-weight="500" text-anchor="start">15분 활동에 맞춰 조정합니다.</text><path d="M570 573L1455 573" fill="none" stroke="#5A5A57" stroke-width="1"/></g>
</svg>
