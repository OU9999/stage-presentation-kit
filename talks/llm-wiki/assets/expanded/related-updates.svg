<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">새 조건이 관련 페이지와 현재 계획을 함께 바꾸는 모습</title>
<desc id="desc">입문자·준비된 공개 읽기 팩·15분 활동이라는 가상 모임 조건을 반영한다. 보편적인 LLM Wiki 정의를 바꾸는 대신 개념의 우리 적용 범위, 비교의 선택 기준, 계획의 작업과 시간을 갱신한다. 목차·로그·관련 질문도 확인한다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><rect x="35" y="62" width="388" height="440" rx="10" fill="#F0DDD2"/><text x="73" y="124" font-size="35" fill="#BD4B45" font-weight="600" text-anchor="start">새로운 모임 조건</text><text x="73" y="221" font-size="36" fill="#252A28" font-weight="400" text-anchor="start">입문자와 함께</text><text x="73" y="299" font-size="36" fill="#252A28" font-weight="400" text-anchor="start">준비된 읽기 팩</text><text x="73" y="377" font-size="36" fill="#252A28" font-weight="400" text-anchor="start">15분 활동</text><text x="73" y="463" font-size="28" fill="#BD4B45" font-weight="400" text-anchor="start">설명용 가상 조건</text><path d="M441 286L500 286" fill="none" stroke="#BD4B45" stroke-width="3"/><path d="M487 278L500 286L487 294" fill="none" stroke="#BD4B45" stroke-width="3"/><rect x="526" y="35" width="938" height="477" rx="12" fill="#172238"/><text x="566" y="98" font-size="38" fill="#FCFBF7" font-weight="600" text-anchor="start">관련 설명을 함께 갱신</text><text x="566" y="183" font-size="29" fill="#63D7C5" font-weight="500" text-anchor="start">개념 · 우리 적용 범위</text><text x="566" y="233" font-size="35" fill="#FCFBF7" font-weight="400" text-anchor="start">입문 설명부터 다룹니다.</text><text x="566" y="308" font-size="29" fill="#63D7C5" font-weight="500" text-anchor="start">비교 · 선택 기준</text><text x="566" y="358" font-size="35" fill="#FCFBF7" font-weight="400" text-anchor="start">작은 자료 묶음으로 시작합니다.</text><text x="566" y="433" font-size="29" fill="#63D7C5" font-weight="500" text-anchor="start">계획 · 작업과 시간</text><text x="566" y="483" font-size="35" fill="#FCFBF7" font-weight="400" text-anchor="start">15분 활동에 맞춰 조정합니다.</text><text x="36" y="575" font-size="31" fill="#68716B" font-weight="400" text-anchor="start">공통 정의는 유지합니다. 적용 범위·선택 기준·현재 계획을 고칩니다.</text></g>
</svg>
