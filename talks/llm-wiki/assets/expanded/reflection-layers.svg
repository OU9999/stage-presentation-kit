<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">일별 기록에서 더 긴 기간의 질문으로</title>
<desc id="desc">일별 기록을 주간에 다시 읽어 반복 패턴과 다음 계획을 만들고 월·분기·연간에는 더 긴 맥락의 질문으로 이어가는 설명용 배치다. 관찰한 사실과 해석을 구별하며 자동으로 정확한 회고가 보장된다는 뜻은 아니다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><rect x="56" y="329" width="300" height="184" rx="6" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><rect x="45" y="318" width="300" height="184" rx="6" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><rect x="34" y="307" width="300" height="184" rx="6" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><text x="67" y="370" font-size="34" fill="#286A5B" font-weight="600" text-anchor="start">일별 기록</text><text x="67" y="443" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">무엇을 했나?</text><path d="M362 397L479 330" fill="none" stroke="#286A5B" stroke-width="2"/><circle cx="479" cy="330" r="4" fill="#286A5B"/><rect x="510" y="194" width="418" height="309" rx="12" fill="#172238"/><text x="553" y="261" font-size="36" fill="#63D7C5" font-weight="600" text-anchor="start">주간의 종합</text><text x="553" y="344" font-size="36" fill="#FCFBF7" font-weight="400" text-anchor="start">무엇이 반복됐나?</text><text x="553" y="414" font-size="36" fill="#FCFBF7" font-weight="400" text-anchor="start">다음 주는 어떻게?</text><path d="M951 290L1045 216" fill="none" stroke="#286A5B" stroke-width="2"/><circle cx="1045" cy="216" r="4" fill="#286A5B"/><rect x="1073" y="65" width="389" height="438" rx="10" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><text x="1114" y="132" font-size="34" fill="#286A5B" font-weight="600" text-anchor="start">월 · 분기 · 연간</text><text x="1114" y="242" font-size="40" fill="#252A28" font-weight="600" text-anchor="start">어떤 맥락이</text><text x="1114" y="313" font-size="40" fill="#252A28" font-weight="600" text-anchor="start">바뀌었나?</text><text x="1114" y="444" font-size="29" fill="#68716B" font-weight="400" text-anchor="start">더 긴 질문과 서사</text><text x="35" y="579" font-size="30" fill="#68716B" font-weight="400" text-anchor="start">기록을 다시 읽어 종합하고, 관찰한 사실과 나의 해석을 구별합니다.</text></g>
</svg>
