<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">원자료를 넣는 사람의 맥락과 목적</title>
<desc id="desc">영상의 목적 질문에서 착안한 설명용 대화. 읽은 맥락·저장 이유·중요했던 부분·향후 활용을 함께 전달한다. 실제 사용자 개인 프로필이나 원영상의 직접 인용문이 아니다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><rect x="30" y="70" width="430" height="460" rx="12" fill="#172238"/><text x="74" y="139" font-size="30" fill="#63D7C5" font-weight="400" text-anchor="start">내가 남기려는 이유</text><text x="74" y="237" font-size="43" fill="#FCFBF7" font-weight="600" text-anchor="start">좋았던 자료가</text><text x="74" y="312" font-size="43" fill="#FCFBF7" font-weight="600" text-anchor="start">어디에 쓰일까?</text><text x="74" y="460" font-size="29" fill="#63D7C5" font-weight="400" text-anchor="start">사람이 직접 쓴 선택 이유</text><text x="509" y="95" font-size="30" fill="#BD4B45" font-weight="600" text-anchor="start">01</text><text x="578" y="95" font-size="34" fill="#252A28" font-weight="600" text-anchor="start">어떤 맥락에서 읽었나요?</text><text x="578" y="143" font-size="34" fill="#68716B" font-weight="400" text-anchor="start">다음 AI 스터디를 준비합니다.</text><text x="509" y="220" font-size="30" fill="#BD4B45" font-weight="600" text-anchor="start">02</text><text x="578" y="220" font-size="34" fill="#252A28" font-weight="600" text-anchor="start">왜 이 자료를 남겼나요?</text><text x="578" y="268" font-size="34" fill="#68716B" font-weight="400" text-anchor="start">차이를 설명하고 한 쪽 진행안을 만들고 싶어요.</text><text x="509" y="345" font-size="30" fill="#BD4B45" font-weight="600" text-anchor="start">03</text><text x="578" y="345" font-size="34" fill="#252A28" font-weight="600" text-anchor="start">무엇이 중요했나요?</text><text x="578" y="393" font-size="34" fill="#68716B" font-weight="400" text-anchor="start">좋은 재료 · 사람의 이유 · 연결된 종합입니다.</text><text x="509" y="470" font-size="30" fill="#BD4B45" font-weight="600" text-anchor="start">04</text><text x="578" y="470" font-size="34" fill="#252A28" font-weight="600" text-anchor="start">앞으로 어디에 쓸 건가요?</text><text x="578" y="518" font-size="34" fill="#68716B" font-weight="400" text-anchor="start">다음 모임의 읽기 활동을 준비합니다.</text></g>
</svg>
