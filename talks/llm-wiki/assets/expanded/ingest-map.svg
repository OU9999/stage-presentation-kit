<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">자료를 반영하며 요약과 개념과 현재 계획을 연결</title>
<desc id="desc">자작 주제 메모 세 개를 읽어 자료 요약을 만들고 기존 개념·비교·현재 스터디 계획과의 관계를 작성하고 갱신한다. 형식 변환만 하는 흐름과 구별하며 원자료·사람의 이유·종합을 유지한다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="121" font-size="28" fill="#A4A4A1" font-weight="400" text-anchor="start">같은 원자료 세 메모</text><text x="35" y="185" font-size="36" fill="#F6F6F4" font-weight="550" text-anchor="start">목적과 맥락</text><text x="35" y="229" font-size="27" fill="#A4A4A1" font-weight="400" text-anchor="start">목적 · 이유 · 결과</text><path d="M35 255L365 255" fill="none" stroke="#5A5A57" stroke-width="1"/><text x="35" y="310" font-size="36" fill="#F6F6F4" font-weight="550" text-anchor="start">검색과 비교</text><text x="35" y="354" font-size="27" fill="#A4A4A1" font-weight="400" text-anchor="start">근거 검색 · 차이</text><path d="M35 380L365 380" fill="none" stroke="#5A5A57" stroke-width="1"/><text x="35" y="435" font-size="36" fill="#F6F6F4" font-weight="550" text-anchor="start">지식의 활용</text><text x="35" y="479" font-size="27" fill="#A4A4A1" font-weight="400" text-anchor="start">종합 · 공유 · 검토</text><path d="M393 316L485 316" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M472 308L485 316L472 324" fill="none" stroke="#5A5A57" stroke-width="2"/><text x="537" y="102" font-size="40" fill="#F6F6F4" font-weight="550" text-anchor="start">요약을 넘어, 기존 설명과 연결</text><path d="M690 250L1235 250" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M690 250L1000 474" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M1235 250L1000 474" fill="none" stroke="#5A5A57" stroke-width="2"/><circle cx="690" cy="250" r="11" fill="#69CF82"/><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="690" y="220" font-size="38" fill="#F6F6F4" font-weight="550" text-anchor="middle">자료 요약</text><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="690" y="301" font-size="28" fill="#A4A4A1" font-weight="400" text-anchor="middle">원자료의 입구</text><circle cx="1235" cy="250" r="11" fill="#69CF82"/><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="1235" y="220" font-size="38" fill="#F6F6F4" font-weight="550" text-anchor="middle">개념 · 비교</text><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="1235" y="301" font-size="28" fill="#A4A4A1" font-weight="400" text-anchor="middle">기존 설명과 연결</text><circle cx="1000" cy="474" r="11" fill="#69CF82"/><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="1000" y="444" font-size="38" fill="#F6F6F4" font-weight="550" text-anchor="middle">현재 계획</text><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="1000" y="525" font-size="28" fill="#A4A4A1" font-weight="400" text-anchor="middle">여러 자료의 종합</text></g>
</svg>
