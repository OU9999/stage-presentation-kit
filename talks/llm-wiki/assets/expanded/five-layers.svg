<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">서로 다른 다섯 기록을 구별해 회고에 활용</title>
<desc id="desc">의도·실행·현실·해석·AI 로그라는 서로 다른 기록 유형의 자작 설명 예다. 병렬 기록을 회고와 다음 계획에서 다시 읽으며 실제 시간·기간·고정 순서나 측정값을 뜻하지 않는다. 다섯 유형을 LLM Wiki의 필수 구조로 일반화하지 않는다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="75" font-size="40" fill="#F6F6F4" font-weight="550" text-anchor="start">기록의 종류를 구별합니다</text><text x="35" y="165" font-size="35" fill="#F6F6F4" font-weight="550" text-anchor="start">의도</text><text x="280" y="165" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">오늘 집중할 일</text><path d="M280 188L1115 188" fill="none" stroke="#5A5A57" stroke-width="1"/><path d="M1135 155L1220 155" fill="none" stroke="#5A5A57" stroke-width="1"/><text x="35" y="250" font-size="35" fill="#F6F6F4" font-weight="550" text-anchor="start">실행</text><text x="280" y="250" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">메모 · 회의 · 실제 작업</text><path d="M280 273L1115 273" fill="none" stroke="#5A5A57" stroke-width="1"/><path d="M1135 240L1220 240" fill="none" stroke="#5A5A57" stroke-width="1"/><text x="35" y="335" font-size="35" fill="#F6F6F4" font-weight="550" text-anchor="start">현실</text><text x="280" y="335" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">관찰된 화면 · 활동 기록</text><path d="M280 358L1115 358" fill="none" stroke="#5A5A57" stroke-width="1"/><path d="M1135 325L1220 325" fill="none" stroke="#5A5A57" stroke-width="1"/><text x="35" y="420" font-size="35" fill="#F6F6F4" font-weight="550" text-anchor="start">해석</text><text x="280" y="420" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">돌아보며 의미 붙이기</text><path d="M280 443L1115 443" fill="none" stroke="#5A5A57" stroke-width="1"/><path d="M1135 410L1220 410" fill="none" stroke="#5A5A57" stroke-width="1"/><text x="35" y="505" font-size="35" fill="#F6F6F4" font-weight="550" text-anchor="start">AI 로그</text><text x="280" y="505" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">대화와 작업의 요약</text><path d="M280 528L1115 528" fill="none" stroke="#5A5A57" stroke-width="1"/><path d="M1135 495L1220 495" fill="none" stroke="#5A5A57" stroke-width="1"/><path d="M1220 155L1250 155L1250 495L1220 495" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M1270 325L1312 325" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M1299 317L1312 325L1299 333" fill="none" stroke="#5A5A57" stroke-width="2"/><text x="1400" y="304" font-size="39" fill="#69CF82" font-weight="550" text-anchor="middle">회고</text><text x="1400" y="367" font-size="30" fill="#F6F6F4" font-weight="400" text-anchor="middle">다음 계획</text><text x="35" y="581" font-size="28" fill="#A4A4A1" font-weight="400" text-anchor="start">개인 기록의 설명 예 · 다섯 유형은 LLM Wiki의 필수 구조가 아닙니다.</text></g>
</svg>
