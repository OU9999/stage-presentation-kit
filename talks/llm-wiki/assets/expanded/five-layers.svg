<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">서로 다른 다섯 기록을 구별해 회고에 활용</title>
<desc id="desc">원영상 발표자가 설명한 의도·실행·현실·해석·AI 로그를 서로 다른 기록 유형의 병렬 층으로 시각화한다. 같은 길이의 얇은 연결과 문서 표시가 회고와 다음 계획으로 모인다. 실제 시간·기간·고정 순서나 측정값이 아니며 다섯 층을 LLM Wiki의 필수 구조로 제시하지 않는다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="48" font-size="31" fill="#286A5B" font-weight="600" text-anchor="start">기록을 구별해서 남기기</text><text x="35" y="125" font-size="36" fill="#286A5B" font-weight="600" text-anchor="start">의도</text><path d="M243 114L1220 114" fill="none" stroke="#CBD0C6" stroke-width="1"/><rect x="280" y="88" width="610" height="48" rx="0" fill="#F2F0E8"/><text x="291" y="125" font-size="34" fill="#286A5B" font-weight="400" text-anchor="start">오늘 집중할 일</text><rect x="962" y="89" width="214" height="56" rx="5" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><path d="M984 107L1151 107" fill="none" stroke="#286A5B" stroke-width="2"/><path d="M984 123L1127 123" fill="none" stroke="#CBD0C6" stroke-width="2"/><path d="M1176 114L1260 114" fill="none" stroke="#CBD0C6" stroke-width="1"/><text x="35" y="215" font-size="36" fill="#252A28" font-weight="600" text-anchor="start">실행</text><path d="M243 204L1220 204" fill="none" stroke="#CBD0C6" stroke-width="1"/><rect x="280" y="178" width="610" height="48" rx="0" fill="#F2F0E8"/><text x="291" y="215" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">메모 · 회의 · 실제 작업</text><rect x="962" y="179" width="214" height="56" rx="5" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><path d="M984 197L1151 197" fill="none" stroke="#252A28" stroke-width="2"/><path d="M984 213L1127 213" fill="none" stroke="#CBD0C6" stroke-width="2"/><path d="M1176 204L1260 204" fill="none" stroke="#CBD0C6" stroke-width="1"/><text x="35" y="305" font-size="36" fill="#68716B" font-weight="600" text-anchor="start">현실</text><path d="M243 294L1220 294" fill="none" stroke="#CBD0C6" stroke-width="1"/><rect x="280" y="268" width="610" height="48" rx="0" fill="#F2F0E8"/><text x="291" y="305" font-size="34" fill="#68716B" font-weight="400" text-anchor="start">관찰된 화면 · 활동 기록</text><rect x="962" y="269" width="214" height="56" rx="5" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><path d="M984 287L1151 287" fill="none" stroke="#68716B" stroke-width="2"/><path d="M984 303L1127 303" fill="none" stroke="#CBD0C6" stroke-width="2"/><path d="M1176 294L1260 294" fill="none" stroke="#CBD0C6" stroke-width="1"/><text x="35" y="395" font-size="36" fill="#BD4B45" font-weight="600" text-anchor="start">해석</text><path d="M243 384L1220 384" fill="none" stroke="#CBD0C6" stroke-width="1"/><rect x="280" y="358" width="610" height="48" rx="0" fill="#F2F0E8"/><text x="291" y="395" font-size="34" fill="#BD4B45" font-weight="400" text-anchor="start">돌아보며 의미 붙이기</text><rect x="962" y="359" width="214" height="56" rx="5" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><path d="M984 377L1151 377" fill="none" stroke="#BD4B45" stroke-width="2"/><path d="M984 393L1127 393" fill="none" stroke="#CBD0C6" stroke-width="2"/><path d="M1176 384L1260 384" fill="none" stroke="#CBD0C6" stroke-width="1"/><text x="35" y="485" font-size="36" fill="#286A5B" font-weight="600" text-anchor="start">AI 로그</text><path d="M243 474L1220 474" fill="none" stroke="#CBD0C6" stroke-width="1"/><rect x="280" y="448" width="610" height="48" rx="0" fill="#F2F0E8"/><text x="291" y="485" font-size="34" fill="#286A5B" font-weight="400" text-anchor="start">대화와 작업의 요약</text><rect x="962" y="449" width="214" height="56" rx="5" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><path d="M984 467L1151 467" fill="none" stroke="#286A5B" stroke-width="2"/><path d="M984 483L1127 483" fill="none" stroke="#CBD0C6" stroke-width="2"/><path d="M1176 474L1260 474" fill="none" stroke="#CBD0C6" stroke-width="1"/><path d="M1260 114L1290 114L1290 474L1260 474" fill="none" stroke="#286A5B" stroke-width="2"/><text x="1392" y="270" font-size="37" fill="#286A5B" font-weight="600" text-anchor="middle">회고</text><text x="1392" y="323" font-size="30" fill="#252A28" font-weight="400" text-anchor="middle">다음 계획</text><path d="M1307 288L1334 288" fill="none" stroke="#286A5B" stroke-width="2"/><path d="M1321 280L1334 288L1321 296" fill="none" stroke="#286A5B" stroke-width="2"/><text x="35" y="581" font-size="28" fill="#68716B" font-weight="400" text-anchor="start">영상 발표자의 개인 기록 사례 · 다섯 층은 LLM Wiki의 필수 형식이 아닙니다.</text></g>
</svg>
