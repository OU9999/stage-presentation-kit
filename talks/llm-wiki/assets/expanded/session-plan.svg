<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">실제 15분 LLM Wiki 활동 진행안의 핵심 발췌</title>
<desc id="desc">등록 자료 materials/session-plan.md의 제목·목표·선택 자료·네 시간 구간을 크게 발췌했다. 전체 세 영상 메모 중 브라이언 대담과 공동 세미나 메모를 선택하고 목적2분·읽기4분·관계근거5분·후속질문4분으로 배분한다. 준비된 읽기 팩을 쓰는 설명용 활동안이며 실제 운영이나 설치·모델 생성 완료 시간 측정이 아니다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><rect x="34" y="20" width="1430" height="533" rx="10" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><text x="75" y="86" font-size="44" fill="#286A5B" font-weight="600" text-anchor="start">입문자와 함께 읽는 15분 LLM Wiki 활동</text><text x="75" y="149" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">목표: 한 관계의 근거를 찾아 읽고, 다음 질문과 확인할 점을 남깁니다.</text><text x="75" y="198" font-size="28" fill="#68716B" font-weight="400" text-anchor="start">준비된 공개 읽기 팩 · 세 메모 중 브라이언 대담 + 공동 세미나 선택</text><path d="M75 224L1423 224" fill="none" stroke="#CBD0C6" stroke-width="2"/><text x="75" y="282" font-size="36" fill="#286A5B" font-weight="600" text-anchor="start">0~2분</text><text x="345" y="282" font-size="35" fill="#252A28" font-weight="400" text-anchor="start">목적 한 문장 정하기</text><text x="75" y="361" font-size="36" fill="#286A5B" font-weight="600" text-anchor="start">2~6분</text><text x="345" y="361" font-size="35" fill="#252A28" font-weight="400" text-anchor="start">선택한 두 읽기 메모 확인하기</text><text x="75" y="440" font-size="36" fill="#286A5B" font-weight="600" text-anchor="start">6~11분</text><text x="345" y="440" font-size="35" fill="#252A28" font-weight="400" text-anchor="start">원자료→개념→비교의 연결과 근거 읽기</text><text x="75" y="519" font-size="36" fill="#286A5B" font-weight="600" text-anchor="start">11~15분</text><text x="345" y="519" font-size="35" fill="#252A28" font-weight="400" text-anchor="start">후속 질문과 남은 확인 남기기</text><text x="35" y="589" font-size="27" fill="#68716B" font-weight="400" text-anchor="start">준비된 팩을 함께 읽는 활동 배분안 · 설치나 모델 생성 완료 시간을 측정한 결과가 아닙니다.</text></g>
</svg>
