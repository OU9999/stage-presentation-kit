<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">작업 기록의 맥락과 요청과 논의와 결과</title>
<desc id="desc">입문자와 준비된 주제 메모 팩으로 15분 활동을 하려는 맥락, 한 쪽 진행안 요청, 두 메모의 선택 이유와 범위에 관한 논의, 진행안·근거·남은 확인을 연결하는 자작 구성 예다. 네 의미를 네 독립 파일의 의무로 제시하지 않는다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="105" font-size="38" fill="#A4A4A1" font-weight="400" text-anchor="start">맥락</text><text x="295" y="105" font-size="43" fill="#F6F6F4" font-weight="500" text-anchor="start">입문자와, 준비된 팩으로 15분</text><path d="M35 153L1460 153" fill="none" stroke="#5A5A57" stroke-width="1"/><text x="35" y="235" font-size="38" fill="#A4A4A1" font-weight="400" text-anchor="start">요청</text><text x="295" y="235" font-size="43" fill="#F6F6F4" font-weight="500" text-anchor="start">한 쪽 진행안을 만들어 주세요.</text><path d="M35 283L1460 283" fill="none" stroke="#5A5A57" stroke-width="1"/><text x="35" y="365" font-size="38" fill="#A4A4A1" font-weight="400" text-anchor="start">논의</text><text x="295" y="365" font-size="43" fill="#F6F6F4" font-weight="500" text-anchor="start">왜 이 두 메모인가?  범위는 맞는가?</text><path d="M35 413L1460 413" fill="none" stroke="#5A5A57" stroke-width="1"/><text x="35" y="495" font-size="38" fill="#A4A4A1" font-weight="400" text-anchor="start">결과</text><text x="295" y="495" font-size="43" fill="#F6F6F4" font-weight="500" text-anchor="start">진행안 + 근거 + 남은 확인</text><text x="35" y="581" font-size="27" fill="#A4A4A1" font-weight="400" text-anchor="start">문서와 대화에 연결해 남길 내용 · 네 개의 독립 파일이 필수라는 뜻은 아닙니다.</text></g>
</svg>
