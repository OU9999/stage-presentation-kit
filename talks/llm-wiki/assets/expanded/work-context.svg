<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">공유 작업의 맥락 요청 논의 결과를 연결</title>
<desc id="desc">입문자와 준비된 읽기 팩으로 15분 활동을 진행하려는 맥락, 한 쪽 진행안 요청, 두 메모를 고른 이유와 범위에 관한 논의, 진행안과 근거와 남은 확인을 연결한 설명용 예. 네 종류의 의미이지 네 독립 파일의 보편 의무는 아니다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="36" y="73" font-size="42" fill="#286A5B" font-weight="600" text-anchor="start">작업의 맥락이 결과까지 이어지도록</text><text x="39" y="171" font-size="38" fill="#286A5B" font-weight="600" text-anchor="start">맥락</text><text x="295" y="171" font-size="37" fill="#252A28" font-weight="400" text-anchor="start">입문자와, 준비된 팩으로 15분</text><path d="M39 211L1456 211" fill="none" stroke="#CBD0C6" stroke-width="1"/><text x="39" y="278" font-size="38" fill="#286A5B" font-weight="600" text-anchor="start">요청</text><text x="295" y="278" font-size="37" fill="#252A28" font-weight="400" text-anchor="start">한 쪽 진행안을 만들어 주세요.</text><path d="M39 318L1456 318" fill="none" stroke="#CBD0C6" stroke-width="1"/><text x="39" y="385" font-size="38" fill="#286A5B" font-weight="600" text-anchor="start">논의</text><text x="295" y="385" font-size="37" fill="#252A28" font-weight="400" text-anchor="start">왜 이 두 메모인가?  범위는 맞는가?</text><path d="M39 425L1456 425" fill="none" stroke="#CBD0C6" stroke-width="1"/><text x="39" y="492" font-size="38" fill="#286A5B" font-weight="600" text-anchor="start">결과</text><text x="295" y="492" font-size="37" fill="#252A28" font-weight="400" text-anchor="start">진행안 + 근거 + 남은 확인</text><text x="37" y="583" font-size="27" fill="#68716B" font-weight="400" text-anchor="start">문서와 대화에 연결해 남길 내용입니다. 네 개의 독립 파일이 필수라는 뜻은 아닙니다.</text></g>
</svg>
