<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">같은 자료와 질문에서 연결된 위키를 읽는 흐름</title>
<desc id="desc">세 영상 읽기 메모를 반영하며 LLM Wiki 개념·RAG와 위키 비교·우리 스터디 계획을 연결된 문서로 작성한다. 질문할 때 필요한 페이지를 찾아 다시 읽으며 새 이해를 갱신한다. 실제 성능 비교가 아닌 설명용 구성이다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="36" y="68" font-size="44" fill="#BD4B45" font-weight="600" text-anchor="start">다음 AI 스터디에서 무엇부터 시도할까?</text><text x="35" y="126" font-size="28" fill="#68716B" font-weight="400" text-anchor="start">같은 원자료 세 편</text><rect x="35" y="150" width="330" height="104" rx="8" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><rect x="35" y="150" width="7" height="104" rx="0" fill="#286A5B"/><text x="60" y="191" font-size="34" fill="#252A28" font-weight="600" text-anchor="start">브라이언 대담</text><text x="60" y="232" font-size="26" fill="#68716B" font-weight="400" text-anchor="start">목적 · 개념 연결</text><rect x="35" y="266" width="330" height="104" rx="8" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><rect x="35" y="266" width="7" height="104" rx="0" fill="#BD4B45"/><text x="60" y="307" font-size="34" fill="#252A28" font-weight="600" text-anchor="start">용담 대담</text><text x="60" y="348" font-size="26" fill="#68716B" font-weight="400" text-anchor="start">검색 · 제어</text><rect x="35" y="382" width="330" height="104" rx="8" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><rect x="35" y="382" width="7" height="104" rx="0" fill="#286A5B"/><text x="60" y="423" font-size="34" fill="#252A28" font-weight="600" text-anchor="start">브라이언 세미나</text><text x="60" y="464" font-size="26" fill="#68716B" font-weight="400" text-anchor="start">사람의 이유 · 공유 작업</text><path d="M390 322L470 322" fill="none" stroke="#68716B" stroke-width="2"/><path d="M457 314L470 322L457 330" fill="none" stroke="#68716B" stroke-width="2"/><rect x="503" y="130" width="958" height="390" rx="12" fill="#172238"/><text x="545" y="193" font-size="36" fill="#63D7C5" font-weight="600" text-anchor="start">먼저 작성하고 유지하는 연결 문서</text><path d="M705 272L1190 272" fill="none" stroke="#4F7D83" stroke-width="2"/><path d="M705 272L940 382" fill="none" stroke="#4F7D83" stroke-width="2"/><path d="M1190 272L940 382" fill="none" stroke="#4F7D83" stroke-width="2"/><circle cx="705" cy="272" r="10" fill="#63D7C5"/><text x="705" y="250" font-size="34" fill="#FCFBF7" font-weight="500" text-anchor="middle">LLM Wiki 개념</text><circle cx="1190" cy="272" r="10" fill="#63D7C5"/><text x="1190" y="250" font-size="34" fill="#FCFBF7" font-weight="500" text-anchor="middle">RAG와 위키 비교</text><circle cx="940" cy="382" r="10" fill="#63D7C5"/><text x="940" y="360" font-size="34" fill="#FCFBF7" font-weight="500" text-anchor="middle">우리 스터디 계획</text><text x="545" y="482" font-size="34" fill="#63D7C5" font-weight="400" text-anchor="start">필요한 쪽 재읽기 → 이번 답에 활용</text><text x="38" y="568" font-size="34" fill="#286A5B" font-weight="400" text-anchor="start">이번 답: 세 메모를 엮어 스터디의 현재 계획을 정리합니다.</text></g>
</svg>
