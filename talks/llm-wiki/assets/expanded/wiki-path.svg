<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">저장된 관계와 종합에서 필요한 쪽을 다시 읽기</title>
<desc id="desc">목적과 맥락·검색과 비교·지식의 활용이라는 같은 세 주제 메모로 개념·비교·현재 계획을 연결해 유지한다. 같은 질문에서 필요한 페이지를 다시 읽어 스터디의 현재 계획을 종합한다. RAG와의 성능 우열이나 검색 없는 위키를 뜻하지 않는다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="54" font-size="31" fill="#A4A4A1" font-weight="400" text-anchor="start">공통 질문 · 다음 AI 스터디에서 LLM Wiki를 어떻게 시도할까?</text><text x="35" y="121" font-size="28" fill="#A4A4A1" font-weight="400" text-anchor="start">같은 원자료 세 메모</text><text x="35" y="185" font-size="36" fill="#F6F6F4" font-weight="550" text-anchor="start">목적과 맥락</text><text x="35" y="229" font-size="27" fill="#A4A4A1" font-weight="400" text-anchor="start">목적 · 이유 · 결과</text><path d="M35 255L365 255" fill="none" stroke="#5A5A57" stroke-width="1"/><text x="35" y="310" font-size="36" fill="#F6F6F4" font-weight="550" text-anchor="start">검색과 비교</text><text x="35" y="354" font-size="27" fill="#A4A4A1" font-weight="400" text-anchor="start">근거 검색 · 차이</text><path d="M35 380L365 380" fill="none" stroke="#5A5A57" stroke-width="1"/><text x="35" y="435" font-size="36" fill="#F6F6F4" font-weight="550" text-anchor="start">지식의 활용</text><text x="35" y="479" font-size="27" fill="#A4A4A1" font-weight="400" text-anchor="start">종합 · 공유 · 검토</text><path d="M392 316L475 316" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M462 308L475 316L462 324" fill="none" stroke="#5A5A57" stroke-width="2"/><text x="530" y="145" font-size="36" fill="#69CF82" font-weight="550" text-anchor="start">미리 작성하고 유지한 문서</text><path d="M666 278L1267 278" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M666 278L948 453" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M1267 278L948 453" fill="none" stroke="#5A5A57" stroke-width="2"/><circle cx="666" cy="278" r="11" fill="#69CF82"/><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="666" y="249" font-size="35" fill="#F6F6F4" font-weight="500" text-anchor="middle">LLM Wiki 개념</text><circle cx="1267" cy="278" r="11" fill="#69CF82"/><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="1267" y="249" font-size="35" fill="#F6F6F4" font-weight="500" text-anchor="middle">RAG와 위키 비교</text><circle cx="948" cy="453" r="11" fill="#69CF82"/><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="948" y="424" font-size="35" fill="#F6F6F4" font-weight="500" text-anchor="middle">우리 스터디 계획</text><text x="947" y="550" font-size="31" fill="#A4A4A1" font-weight="400" text-anchor="middle">필요한 쪽 재읽기 → 이번 답에 활용</text></g>
</svg>
