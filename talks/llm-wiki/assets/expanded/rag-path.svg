<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">같은 자료와 질문의 단순 RAG 설명 예</title>
<desc id="desc">세 영상의 읽기 메모에서 질문에 필요한 근거를 검색해 이번 입력 문맥에 넣고 답을 종합하는 교육용 예. 나쁜 답을 만들어 위키와 성능 우열을 비교하지 않는다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="36" y="68" font-size="44" fill="#BD4B45" font-weight="600" text-anchor="start">다음 AI 스터디에서 무엇부터 시도할까?</text><text x="35" y="126" font-size="28" fill="#68716B" font-weight="400" text-anchor="start">같은 원자료 세 편</text><rect x="35" y="150" width="330" height="104" rx="8" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><rect x="35" y="150" width="7" height="104" rx="0" fill="#286A5B"/><text x="60" y="191" font-size="34" fill="#252A28" font-weight="600" text-anchor="start">브라이언 대담</text><text x="60" y="232" font-size="26" fill="#68716B" font-weight="400" text-anchor="start">목적 · 개념 연결</text><rect x="35" y="266" width="330" height="104" rx="8" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><rect x="35" y="266" width="7" height="104" rx="0" fill="#BD4B45"/><text x="60" y="307" font-size="34" fill="#252A28" font-weight="600" text-anchor="start">용담 대담</text><text x="60" y="348" font-size="26" fill="#68716B" font-weight="400" text-anchor="start">검색 · 제어</text><rect x="35" y="382" width="330" height="104" rx="8" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><rect x="35" y="382" width="7" height="104" rx="0" fill="#286A5B"/><text x="60" y="423" font-size="34" fill="#252A28" font-weight="600" text-anchor="start">브라이언 세미나</text><text x="60" y="464" font-size="26" fill="#68716B" font-weight="400" text-anchor="start">사람의 이유 · 공유 작업</text><path d="M390 322L470 322" fill="none" stroke="#68716B" stroke-width="2"/><path d="M457 314L470 322L457 330" fill="none" stroke="#68716B" stroke-width="2"/><rect x="503" y="150" width="467" height="338" rx="12" fill="#172238"/><text x="539" y="210" font-size="34" fill="#63D7C5" font-weight="600" text-anchor="start">질문할 때 찾은 근거</text><path d="M539 239L930 239" fill="none" stroke="#45606A" stroke-width="2"/><text x="539" y="290" font-size="34" fill="#FCFBF7" font-weight="400" text-anchor="start">목적과 연결에 관한 부분</text><text x="539" y="341" font-size="34" fill="#FCFBF7" font-weight="400" text-anchor="start">검색과 위키에 관한 부분</text><text x="539" y="392" font-size="34" fill="#FCFBF7" font-weight="400" text-anchor="start">사람의 이유와 공유 작업</text><text x="539" y="445" font-size="30" fill="#63D7C5" font-weight="400" text-anchor="start">이번 답의 입력 문맥</text><path d="M991 322L1054 322" fill="none" stroke="#68716B" stroke-width="2"/><path d="M1041 314L1054 322L1041 330" fill="none" stroke="#68716B" stroke-width="2"/><text x="1090" y="207" font-size="34" fill="#286A5B" font-weight="600" text-anchor="start">이번 질문의 답</text><text x="1090" y="285" font-size="38" fill="#252A28" font-weight="400" text-anchor="start">세 메모를 엮어</text><text x="1090" y="349" font-size="38" fill="#252A28" font-weight="400" text-anchor="start">스터디 계획을</text><text x="1090" y="413" font-size="38" fill="#252A28" font-weight="400" text-anchor="start">정리해 봅니다.</text><text x="38" y="565" font-size="32" fill="#68716B" font-weight="400" text-anchor="start">검색한 근거를 읽고, 이번 질문에 맞게 종합하는 흐름</text></g>
</svg>
