<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">질문에 필요한 근거를 이번 문맥으로 읽기</title>
<desc id="desc">목적과 맥락·검색과 비교·지식의 활용이라는 같은 세 자작 주제 메모와 같은 질문을 쓴다. 검색한 근거를 이번 입력 문맥으로 읽어 현재 답을 종합하는 기본 RAG 설명 예이며 실제 모델 실행이나 성능 비교가 아니다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="54" font-size="31" fill="#A4A4A1" font-weight="400" text-anchor="start">공통 질문 · 다음 AI 스터디에서 LLM Wiki를 어떻게 시도할까?</text><text x="35" y="121" font-size="28" fill="#A4A4A1" font-weight="400" text-anchor="start">같은 원자료 세 메모</text><text x="35" y="185" font-size="36" fill="#F6F6F4" font-weight="550" text-anchor="start">목적과 맥락</text><text x="35" y="229" font-size="27" fill="#A4A4A1" font-weight="400" text-anchor="start">목적 · 이유 · 결과</text><path d="M35 255L365 255" fill="none" stroke="#5A5A57" stroke-width="1"/><text x="35" y="310" font-size="36" fill="#F6F6F4" font-weight="550" text-anchor="start">검색과 비교</text><text x="35" y="354" font-size="27" fill="#A4A4A1" font-weight="400" text-anchor="start">근거 검색 · 차이</text><path d="M35 380L365 380" fill="none" stroke="#5A5A57" stroke-width="1"/><text x="35" y="435" font-size="36" fill="#F6F6F4" font-weight="550" text-anchor="start">지식의 활용</text><text x="35" y="479" font-size="27" fill="#A4A4A1" font-weight="400" text-anchor="start">종합 · 공유 · 검토</text><path d="M392 316L475 316" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M462 308L475 316L462 324" fill="none" stroke="#5A5A57" stroke-width="2"/><rect x="505" y="132" width="493" height="365" rx="10" fill="#151515" stroke="#5A5A57" stroke-width="2"/><text x="544" y="195" font-size="38" fill="#24A8FF" font-weight="550" text-anchor="start">이번에 찾은 근거</text><text x="544" y="277" font-size="32" fill="#F6F6F4" font-weight="400" text-anchor="start">목적과 맥락에 관한 부분</text><text x="544" y="337" font-size="32" fill="#F6F6F4" font-weight="400" text-anchor="start">검색과 비교에 관한 부분</text><text x="544" y="397" font-size="32" fill="#F6F6F4" font-weight="400" text-anchor="start">지식 활용과 검토의 부분</text><text x="544" y="459" font-size="28" fill="#A4A4A1" font-weight="400" text-anchor="start">이번 답의 입력 문맥</text><path d="M1018 316L1084 316" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M1071 308L1084 316L1071 324" fill="none" stroke="#5A5A57" stroke-width="2"/><text x="1110" y="196" font-size="34" fill="#F6F6F4" font-weight="550" text-anchor="start">현재 질문의 답</text><text x="1110" y="290" font-size="38" fill="#F6F6F4" font-weight="400" text-anchor="start">세 메모를 엮어</text><text x="1110" y="360" font-size="38" fill="#F6F6F4" font-weight="400" text-anchor="start">스터디 계획을</text><text x="1110" y="430" font-size="38" fill="#F6F6F4" font-weight="400" text-anchor="start">정리합니다.</text></g>
</svg>
