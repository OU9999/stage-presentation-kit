<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">필요한 위키 페이지를 찾아 현재 문맥에서 실제로 읽기</title>
<desc id="desc">입문자와 15분 활동은 무엇부터 할지라는 질문에 목차·작업 규칙·개념·비교·현재 계획과 필요한 원자료를 찾아 실제 입력으로 읽는다. 파일이 존재하는 사실과 이번 답에 읽혔다는 사실을 구별하는 설명 예다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="108" font-size="36" fill="#F6F6F4" font-weight="550" text-anchor="start">필요한 페이지 찾기</text><circle cx="43" cy="204" r="5" fill="#A4A4A1"/><text x="70" y="215" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">목차와 작업 규칙</text><circle cx="43" cy="290" r="5" fill="#A4A4A1"/><text x="70" y="301" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">관련 개념과 비교</text><circle cx="43" cy="376" r="5" fill="#A4A4A1"/><text x="70" y="387" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">현재 스터디 계획</text><circle cx="43" cy="462" r="5" fill="#A4A4A1"/><text x="70" y="473" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">필요하면 원자료</text><path d="M393 315L475 315" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M462 307L475 315L462 323" fill="none" stroke="#5A5A57" stroke-width="2"/><rect x="505" y="125" width="495" height="380" rx="10" fill="#151515" stroke="#5A5A57" stroke-width="2"/><text x="546" y="193" font-size="32" fill="#24A8FF" font-weight="550" text-anchor="start">이번 답의 입력 문맥</text><text x="546" y="303" font-size="43" fill="#F6F6F4" font-weight="550" text-anchor="start">찾아낸 페이지를</text><text x="546" y="381" font-size="43" fill="#F6F6F4" font-weight="550" text-anchor="start">실제로 읽습니다.</text><path d="M1020 315L1080 315" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M1067 307L1080 315L1067 323" fill="none" stroke="#5A5A57" stroke-width="2"/><text x="1110" y="193" font-size="34" fill="#F6F6F4" font-weight="550" text-anchor="start">현재 질문의 답</text><text x="1110" y="295" font-size="37" fill="#F6F6F4" font-weight="400" text-anchor="start">목차와 연결을</text><text x="1110" y="365" font-size="37" fill="#F6F6F4" font-weight="400" text-anchor="start">읽고, 근거를</text><text x="1110" y="435" font-size="37" fill="#F6F6F4" font-weight="400" text-anchor="start">찾아봅니다.</text><text x="35" y="576" font-size="29" fill="#A4A4A1" font-weight="400" text-anchor="start">파일의 존재 ≠ 이번 답에서 실제로 읽은 사실</text></g>
</svg>
