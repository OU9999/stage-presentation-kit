<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">위키 페이지를 찾아 이번 답의 문맥으로 읽기</title>
<desc id="desc">입문자와 15분 활동은 무엇부터 할지 질문한다. 목차와 작업 규칙, 관련 개념·비교·현재 계획, 필요하면 원자료를 찾아 실제 입력 문맥에 읽고 답한다. 파일의 존재와 이번 답의 실제 재읽기를 구별한다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="36" y="72" font-size="44" fill="#BD4B45" font-weight="600" text-anchor="start">입문자와 15분 활동은 무엇부터 할까?</text><text x="36" y="159" font-size="30" fill="#286A5B" font-weight="600" text-anchor="start">필요한 페이지를 찾기</text><circle cx="50" cy="216" r="6" fill="#286A5B"/><text x="76" y="226" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">목차와 작업 규칙</text><circle cx="50" cy="296" r="6" fill="#286A5B"/><text x="76" y="306" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">관련 개념과 비교</text><circle cx="50" cy="376" r="6" fill="#286A5B"/><text x="76" y="386" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">현재 스터디 계획</text><circle cx="50" cy="456" r="6" fill="#286A5B"/><text x="76" y="466" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">필요하면 원자료</text><path d="M386 323L472 323" fill="none" stroke="#68716B" stroke-width="2"/><path d="M459 315L472 323L459 331" fill="none" stroke="#68716B" stroke-width="2"/><rect x="502" y="164" width="459" height="332" rx="12" fill="#172238"/><text x="540" y="223" font-size="31" fill="#63D7C5" font-weight="600" text-anchor="start">이번 답의 입력 문맥</text><text x="540" y="310" font-size="39" fill="#FCFBF7" font-weight="400" text-anchor="start">찾아낸 페이지를</text><text x="540" y="380" font-size="39" fill="#FCFBF7" font-weight="400" text-anchor="start">실제로 읽습니다.</text><path d="M983 323L1054 323" fill="none" stroke="#68716B" stroke-width="2"/><path d="M1041 315L1054 323L1041 331" fill="none" stroke="#68716B" stroke-width="2"/><text x="1090" y="222" font-size="34" fill="#286A5B" font-weight="600" text-anchor="start">현재 질문의 답</text><text x="1090" y="305" font-size="36" fill="#252A28" font-weight="400" text-anchor="start">목차와 연결을</text><text x="1090" y="370" font-size="36" fill="#252A28" font-weight="400" text-anchor="start">읽고, 근거를</text><text x="1090" y="435" font-size="36" fill="#252A28" font-weight="400" text-anchor="start">찾아봅니다.</text><text x="36" y="574" font-size="31" fill="#68716B" font-weight="400" text-anchor="start">파일이 있다는 사실과 이번 답에 읽혔다는 사실은 다릅니다.</text></g>
</svg>
