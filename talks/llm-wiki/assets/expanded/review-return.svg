<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">진행안을 대조한 기록과 선택 이유를 다음 질문에 연결</title>
<desc id="desc">실제 활동안의 시간 합계·출처와 작성 주체·근거 및 문서 연결을 대조한 범위, 결과물·두 메모 선택 이유·남은 확인의 저장, 30분이라면 무엇을 더 읽고 확인할지라는 후속 질문을 연결한다. 실제 학습효과나 사람 실행을 검증한 배지·통계는 사용하지 않는다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="104" font-size="39" fill="#286A5B" font-weight="600" text-anchor="start">대조한 내용</text><text x="35" y="195" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">2 + 4 + 5 + 4 = 15분</text><text x="35" y="283" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">출처와 작성 주체</text><text x="35" y="371" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">근거와 문서 연결</text><text x="35" y="478" font-size="28" fill="#68716B" font-weight="400" text-anchor="start">문서에서 확인한 범위</text><path d="M438 300L490 300" fill="none" stroke="#286A5B" stroke-width="2"/><path d="M477 292L490 300L477 308" fill="none" stroke="#286A5B" stroke-width="2"/><rect x="515" y="53" width="526" height="484" rx="12" fill="#172238"/><text x="556" y="119" font-size="37" fill="#FCFBF7" font-weight="600" text-anchor="start">결과와 이유를 저장</text><text x="556" y="216" font-size="35" fill="#FCFBF7" font-weight="400" text-anchor="start">한 쪽 진행안</text><text x="556" y="301" font-size="35" fill="#FCFBF7" font-weight="400" text-anchor="start">두 메모의 선택 이유</text><text x="556" y="386" font-size="35" fill="#FCFBF7" font-weight="400" text-anchor="start">아직 남은 확인</text><text x="556" y="486" font-size="29" fill="#63D7C5" font-weight="400" text-anchor="start">검토 기록을 위키에 연결</text><path d="M1058 300L1111 300" fill="none" stroke="#286A5B" stroke-width="2"/><path d="M1098 292L1111 300L1098 308" fill="none" stroke="#286A5B" stroke-width="2"/><text x="1145" y="157" font-size="29" fill="#BD4B45" font-weight="600" text-anchor="start">다음 질문</text><text x="1145" y="228" font-size="43" fill="#252A28" font-weight="600" text-anchor="start">30분이라면?</text><text x="1145" y="326" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">이번 결과와</text><text x="1145" y="392" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">선택 이유부터</text><text x="1145" y="458" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">다시 읽습니다.</text><text x="35" y="584" font-size="29" fill="#68716B" font-weight="400" text-anchor="start">확인한 결과와 선택 이유를 남겨, 다음 질문의 근거로 다시 읽습니다.</text></g>
</svg>
