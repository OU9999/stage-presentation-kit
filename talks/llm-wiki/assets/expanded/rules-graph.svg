<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">정리 기준 문서와 실제 문서 연결의 보기</title>
<desc id="desc">왼쪽의 규칙 문서는 원문과 해석·관계 이유·남은 질문을 구별하는 기준을 적는다. 오른쪽 그래프는 세 영상·개념·검색·비교·계획·질문의 실제 문서 연결을 탐색하는 보기다. 그래프 자체가 진실이나 온톨로지 전체를 증명하지 않는다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="96" font-size="38" fill="#286A5B" font-weight="600" text-anchor="start">문서화한 정리 기준</text><text x="35" y="207" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">원문과 우리 해석을 구별한다.</text><text x="35" y="311" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">관계를 연결한 이유를 적는다.</text><text x="35" y="415" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">모르는 내용은 질문으로 남긴다.</text><text x="35" y="547" font-size="31" fill="#68716B" font-weight="400" text-anchor="start">규칙은 정리의 기준입니다.</text><rect x="760" y="30" width="703" height="530" rx="12" fill="#172238"/><text x="801" y="94" font-size="35" fill="#FCFBF7" font-weight="600" text-anchor="start">문서의 연결을 따라 읽기</text><path d="M858 188L1019 289" fill="none" stroke="#507D84" stroke-width="2"/><path d="M1259 183L1019 289" fill="none" stroke="#507D84" stroke-width="2"/><path d="M1259 183L1310 324" fill="none" stroke="#507D84" stroke-width="2"/><path d="M1019 289L867 422" fill="none" stroke="#507D84" stroke-width="2"/><path d="M1019 289L1191 429" fill="none" stroke="#507D84" stroke-width="2"/><path d="M1310 324L867 422" fill="none" stroke="#507D84" stroke-width="2"/><path d="M867 422L1191 429" fill="none" stroke="#507D84" stroke-width="2"/><path d="M1191 429L1061 514" fill="none" stroke="#507D84" stroke-width="2"/><path d="M1070 188L1019 289" fill="none" stroke="#507D84" stroke-width="2"/><path d="M1070 188L1191 429" fill="none" stroke="#507D84" stroke-width="2"/><circle cx="858" cy="188" r="8" fill="#63D7C5"/><text x="858" y="169" font-size="34" fill="#FCFBF7" font-weight="500" text-anchor="middle">영상 1</text><circle cx="1259" cy="183" r="8" fill="#63D7C5"/><text x="1259" y="164" font-size="34" fill="#FCFBF7" font-weight="500" text-anchor="middle">영상 2</text><circle cx="1019" cy="289" r="8" fill="#63D7C5"/><text x="1019" y="270" font-size="34" fill="#FCFBF7" font-weight="500" text-anchor="middle">LLM Wiki</text><circle cx="1310" cy="324" r="8" fill="#63D7C5"/><text x="1310" y="305" font-size="34" fill="#FCFBF7" font-weight="500" text-anchor="middle">검색</text><circle cx="867" cy="422" r="8" fill="#63D7C5"/><text x="867" y="403" font-size="34" fill="#FCFBF7" font-weight="500" text-anchor="middle">비교</text><circle cx="1191" cy="429" r="8" fill="#63D7C5"/><text x="1191" y="410" font-size="34" fill="#FCFBF7" font-weight="500" text-anchor="middle">계획</text><circle cx="1061" cy="514" r="8" fill="#63D7C5"/><text x="1061" y="495" font-size="34" fill="#FCFBF7" font-weight="500" text-anchor="middle">질문</text><circle cx="1070" cy="188" r="8" fill="#63D7C5"/><text x="1070" y="169" font-size="34" fill="#FCFBF7" font-weight="500" text-anchor="middle">세미나</text></g>
</svg>
