<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">같은 축의 비교를 우리 목적의 계획으로 종합</title>
<desc id="desc">RAG와 LLM Wiki를 정리 시점·남는 결과·병행 방식이라는 같은 축으로 비교한다. 자작 주제 메모 세 개의 개념과 비교를 읽고 다음 스터디의 첫 시도 계획을 만드는 종합 예이며 성능 우열 수치나 실측 결과가 아니다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="96" font-size="41" fill="#F6F6F4" font-weight="550" text-anchor="start">RAG  ↔  LLM Wiki</text><text x="35" y="205" font-size="29" fill="#A4A4A1" font-weight="400" text-anchor="start">정리하는 시점</text><text x="35" y="263" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">질문할 때 · 자료를 반영할 때</text><text x="35" y="349" font-size="29" fill="#A4A4A1" font-weight="400" text-anchor="start">남는 결과</text><text x="35" y="407" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">근거와 답 · 연결된 개념과 종합</text><text x="35" y="493" font-size="29" fill="#A4A4A1" font-weight="400" text-anchor="start">함께 쓰는 방식</text><text x="35" y="551" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">위키를 검색 대상으로 활용</text><path d="M727 310L795 310" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M782 302L795 310L782 318" fill="none" stroke="#5A5A57" stroke-width="2"/><rect x="830" y="35" width="634" height="520" rx="8" fill="#F6F6F4" stroke="#CDCDC7" stroke-width="2"/><text x="872" y="110" font-size="43" fill="#1D1D1B" font-weight="600" text-anchor="start">우리의 첫 시도</text><text x="872" y="220" font-size="34" fill="#1D1D1B" font-weight="400" text-anchor="start">세 메모를 함께 읽습니다.</text><text x="872" y="310" font-size="34" fill="#1D1D1B" font-weight="400" text-anchor="start">개념·비교·계획을 남깁니다.</text><text x="872" y="400" font-size="34" fill="#1D1D1B" font-weight="400" text-anchor="start">후속 질문에서 다시 읽습니다.</text><text x="872" y="510" font-size="27" fill="#62625F" font-weight="400" text-anchor="start">syntheses/study-plan.md</text></g>
</svg>
