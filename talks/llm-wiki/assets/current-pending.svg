<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">검토한 답은 현행으로, 근거가 부족한 답은 검토 대기로</title>
  <desc id="desc">D2는 문장과 근거 위치와 주장 범위를 대조한 뒤 현행 답을 갱신하는 이 예제의 저장 정책이다. Q2의 검토한 운영 답은 현행 위키에 연결한다. 파일 위키를 만들면 필요한 파일을 언제나 찾을 수 있다는 부족한 초안은 pending/retrieval-coverage.md에 보류한다. 현재 원문과 파일 교정 실행은 검색 누락이 없다는 단정을 지원하지 않는다. 다음 행동은 실제 스터디 질문에서 답이 읽은 파일과 빠뜨린 근거를 사람이 확인하는 것이다.</desc>
  <rect width="1200" height="450" fill="#090909"/>
  <g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <text x="32" y="43" fill="#a080ff" font-size="36" font-weight="700">D2 · 문장·근거 위치·주장 범위를 대조한다</text>
    <path d="M32 75H1168" stroke="#a080ff" stroke-width="2"/>
    <text x="32" y="132" fill="#69cf82" font-size="38" font-weight="700">원문과 범위를 대조한 답</text>
    <text x="32" y="193" fill="#f5f5f2" font-size="42" font-weight="700">현행 위키에 연결</text>
    <text x="32" y="257" fill="#b7bab8" font-size="32" font-weight="400">Q2 · 이 예제의 운영 답</text>
    <text x="650" y="132" fill="#ff7a3d" font-size="38" font-weight="700">근거가 부족한 답</text>
    <text x="650" y="193" fill="#f5f5f2" font-size="42" font-weight="700">pending · 검토 대기</text>
    <text x="650" y="253" fill="#f5f5f2" font-size="32" font-weight="400">“파일 위키를 만들면 필요한 파일을</text>
    <text x="650" y="302" fill="#f5f5f2" font-size="32" font-weight="400">언제나 찾을 수 있다.”</text>
    <path d="M600 110V324" stroke="#424744" stroke-width="2"/>
    <path d="M32 347H1168" stroke="#424744" stroke-width="2"/>
    <text x="32" y="397" fill="#ff7a3d" font-size="32" font-weight="700">다음 행동</text>
    <text x="220" y="397" fill="#f5f5f2" font-size="32" font-weight="400">실제 질문에서 읽은 파일·빠뜨린 근거를 사람이 확인</text>
  </g>
</svg>
