<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">저장 페이지를 현재 문맥으로 읽고 유용한 답을 다시 위키에 남긴다</title><desc id="desc">index와 검색으로 관련 페이지를 찾고 본문을 현재 답변의 문맥에 넣어 답한다. 필요하면 원자료를 확인한다. 유용한 답은 새 페이지로 저장해 기존 개념과 연결하고 다음 질문에서 다시 읽는다.</desc><rect width="1400" height="620" fill="#090909"/><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="35" y="100" width="280" height="220" rx="18" fill="#131719" stroke="#24a8ff" stroke-width="2"/><text x="60" y="155" font-size="40" font-weight="700" fill="#f5f5f2" text-anchor="start">찾을 페이지</text><text x="60" y="215" font-size="32" font-weight="500" fill="#24a8ff" text-anchor="start">index · 검색</text><text x="60" y="272" font-size="28" font-weight="500" fill="#b7bab8" text-anchor="start">관련 위키로 진입</text><path d="M333 210L460 210" fill="none" stroke="#24a8ff" stroke-width="3"/><path d="M446 201L460 210L446 219" fill="none" stroke="#24a8ff" stroke-width="3"/><text x="397" y="168" font-size="28" font-weight="500" fill="#24a8ff" text-anchor="middle">읽음</text><rect x="475" y="100" width="420" height="220" rx="18" fill="#131719" stroke="#69cf82" stroke-width="2"/><text x="505" y="155" font-size="40" font-weight="700" fill="#f5f5f2" text-anchor="start">현재 답변의 문맥</text><text x="505" y="215" font-size="32" font-weight="500" fill="#69cf82" text-anchor="start">관련 페이지의 본문</text><text x="505" y="272" font-size="28" font-weight="500" fill="#b7bab8" text-anchor="start">필요하면 원자료도 확인</text><path d="M912 210L1040 210" fill="none" stroke="#69cf82" stroke-width="3"/><path d="M1026 201L1040 210L1026 219" fill="none" stroke="#69cf82" stroke-width="3"/><rect x="1055" y="100" width="310" height="220" rx="18" fill="#131719" stroke="#ffac5c" stroke-width="2"/><text x="1082" y="155" font-size="40" font-weight="700" fill="#f5f5f2" text-anchor="start">새 질문의 답</text><text x="1082" y="215" font-size="28" font-weight="500" fill="#ffac5c" text-anchor="start">근거와 남은 의문</text><path d="M1210 320V460H910" fill="none" stroke="#ffac5c" stroke-width="3"/><path d="M924 451L910 460L924 469" fill="none" stroke="#ffac5c" stroke-width="3"/><text x="1030" y="420" font-size="30" font-weight="500" fill="#ffac5c" text-anchor="middle">유용한 답 저장</text><rect x="475" y="400" width="420" height="155" rx="18" fill="#131719" stroke="#a080ff" stroke-width="2"/><text x="505" y="454" font-size="38" font-weight="700" fill="#f5f5f2" text-anchor="start">새 비교·답 페이지</text><text x="505" y="514" font-size="30" font-weight="500" fill="#a080ff" text-anchor="start">기존 개념·질문과 연결</text><path d="M475 475H170V335" fill="none" stroke="#a080ff" stroke-width="3"/><path d="M161 349L170 335L179 349" fill="none" stroke="#a080ff" stroke-width="3"/><text x="35" y="585" font-size="32" font-weight="700" fill="#f5f5f2" text-anchor="start">다음 질문은 저장된 페이지를 다시 찾아 읽습니다.</text></g></svg>
