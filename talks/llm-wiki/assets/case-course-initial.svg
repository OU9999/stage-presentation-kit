<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title desc">
<title id="title">두 강의의 공통 기준을 개념 페이지에 연결한다</title>
<desc id="desc">가상 강의의2주차 회귀와7주차 회귀트리 메모만 읽은 상태다. 이 예에서 두 모델에 쓰인 제곱오차를 공유 개념에 연결하고 어느 강의에서 읽었는지 남긴다.</desc>
<rect width="1500" height="540" fill="#080808"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" letter-spacing="-.6">
<text x="60" y="62" font-size="30" fill="#a5a5a2" font-weight="400" text-anchor="start">읽은 두 단원</text>
<text x="60" y="151" font-size="30" fill="#24a8ff" font-weight="400" text-anchor="start">2주차</text>
<text x="60" y="218" font-size="58" fill="#f6f6f4" font-weight="400" text-anchor="start">회귀</text>
<text x="60" y="331" font-size="30" fill="#24a8ff" font-weight="400" text-anchor="start">7주차</text>
<text x="60" y="398" font-size="58" fill="#f6f6f4" font-weight="400" text-anchor="start">회귀트리</text>
<path d="M360 202H580V288H725" fill="none" stroke="#474745" stroke-width="2"/>
<path d="M360 382H580V288" fill="none" stroke="#474745" stroke-width="2"/>
<circle cx="580" cy="288" r="5" fill="#69cf82"/>
<text x="800" y="241" font-size="32" fill="#69cf82" font-weight="400" text-anchor="start">공유 개념 페이지</text>
<text x="800" y="319" font-size="72" fill="#f6f6f4" font-weight="400" text-anchor="start">제곱오차</text>
<text x="800" y="394" font-size="30" fill="#a5a5a2" font-weight="400" text-anchor="start">근거: 2·7주차</text>
<path d="M40 458L1460 458" fill="none" stroke="#474745" stroke-width="2"/>
<text x="40" y="512" font-size="34" fill="#f6f6f4" font-weight="400" text-anchor="start">같은 기준이 쓰인 위치를 연결합니다.</text>
</g>
</svg>
