<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">소설 독서에서 장 메모가 인물과 주제를 갱신하고 다음 해석에 쓰인다</title><desc id="desc">가상 소설의 1장에는 지도를 숨긴 행동이 있고 3장에는 추적 장치가 드러난다. 서하는 동료 보호가 목적이었다고 설명한다. LLM은 인물·신뢰 주제·장 요약을 연결하되 자기 설명의 미확인을 남긴다. 배신으로만 볼 수 없는 이유를 질문 답으로 저장한다.</desc><rect width="1400" height="620" fill="#090909"/><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="40" y="65" font-size="28" font-weight="500" fill="#b7bab8" text-anchor="start">가상 소설 · 3장까지 읽은 적용 예</text><rect x="40" y="110" width="400" height="330" rx="18" fill="#131719" stroke="#24a8ff" stroke-width="2"/><text x="68" y="165" font-size="42" font-weight="700" fill="#f5f5f2" text-anchor="start">장 메모</text><text x="68" y="227" font-size="32" font-weight="500" fill="#24a8ff" text-anchor="start">1장: 지도를 숨김</text><text x="68" y="285" font-size="28" font-weight="500" fill="#24a8ff" text-anchor="start">3장: 추적 장치가 드러남</text><text x="68" y="343" font-size="28" font-weight="500" fill="#b7bab8" text-anchor="start">서하: 동료 보호가 목적</text><text x="68" y="393" font-size="28" font-weight="500" fill="#b7bab8" text-anchor="start">이었다고 설명</text><path d="M460 265L610 265" fill="none" stroke="#24a8ff" stroke-width="3"/><path d="M596 256L610 265L596 274" fill="none" stroke="#24a8ff" stroke-width="3"/><text x="535" y="220" font-size="28" font-weight="500" fill="#69cf82" text-anchor="middle">LLM 갱신</text><rect x="630" y="110" width="730" height="330" rx="18" fill="#131719" stroke="#69cf82" stroke-width="2"/><text x="660" y="168" font-size="40" font-weight="700" fill="#f5f5f2" text-anchor="start">인물 ↔ 신뢰 주제 ↔ 장 요약</text><text x="660" y="235" font-size="30" font-weight="500" fill="#69cf82" text-anchor="start">행동 · 인물의 말 · 독자의 해석을 구분</text><text x="660" y="298" font-size="32" font-weight="500" fill="#ffac5c" text-anchor="start">서하의 설명 전체는 아직 미확인</text><text x="660" y="365" font-size="30" font-weight="500" fill="#b7bab8" text-anchor="start">유용한 해석은 질문 페이지로 저장</text><text x="40" y="515" font-size="32" font-weight="700" fill="#a080ff" text-anchor="start">후속 질문</text><text x="250" y="515" font-size="40" font-weight="700" fill="#f5f5f2" text-anchor="start">왜 배신으로만 볼 수 없을까?</text><text x="250" y="575" font-size="28" font-weight="500" fill="#b7bab8" text-anchor="start">읽은 근거와 미확인을 남기고, 다음 장에서 다시 확인합니다.</text></g></svg>
