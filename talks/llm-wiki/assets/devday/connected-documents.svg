<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" data-material-kind="explanatory-reconstruction" role="img" aria-labelledby="title desc">
  <title id="title">자료 요약과 함께 읽고 고칠 실제 문서 이름의 세 관계</title>
  <desc id="desc">자료 요약 영역은 목적과 맥락이라는 원자료의 입구다. 더 큰 개념·비교 영역 안에는 LLM Wiki와 RAG와 위키라는 문서 단서가 있고 현재 계획 영역에는 조건을 반영한 입문자와 하는 첫 위키 활동이 있다. 자료 요약과 개념·비교, 자료 요약과 현재 계획, 개념·비교와 현재 계획이라는 세 무방향 선은 각 영역 경계에 닿는다. 개념과 비교는 한 영역 안에 있으며 독립 네 노드로 확장하지 않았다. 선은 함께 읽고 고칠 관계이며 자동 갱신이나 필수 생성 순서를 뜻하지 않는다. 텍스트 팩의 논리 문서 구간을 조판한 발표팀의 설명용 재구성으로 실제 앱 UI가 아니다.</desc>
