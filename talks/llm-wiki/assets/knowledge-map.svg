<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">세 원문에서 개념과 비교를 거쳐 질문에 답하고 검토한 답을 재저장합니다</title>
  <desc id="desc">실제 공개 자료를 읽는 가상 스터디의 연결도입니다. RAG 논문은 검색 문맥 개념으로, LoRA 논문은 모델 적응 개념으로 이어집니다. 두 개념을 같은 질문으로 비교하고 LLM Wiki 설계 글에서 읽은 파일 정리와 함께 '위키 수정은 학습인가'라는 질문에 답합니다. 사람이 검토한 답을 질문 페이지에 저장하고, 관련 개념 및 비교 페이지와 연결합니다. 아래의 초록 선은 질문과 비교를 다시 연결하는 관계이며 파일 정리라는 개념을 답으로 덮어쓰는 흐름이 아닙니다. 화살표는 읽고 검토할 관계이며 자동 성공이나 효과의 증명이 아닙니다.</desc>
  <rect width="1200" height="450" fill="#090909"/>
  <g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <text x="32" y="49" fill="#a7aea9" font-size="32">원문</text>
    <text x="302" y="49" fill="#a7aea9" font-size="32">개념</text>
    <text x="32" y="113" fill="#24a8ff" font-size="38" font-weight="700">RAG 논문</text>
    <text x="302" y="113" fill="#f5f5f2" font-size="38" font-weight="700">검색 문맥</text>
    <text x="32" y="213" fill="#a080ff" font-size="38" font-weight="700">LoRA 논문</text>
    <text x="302" y="213" fill="#f5f5f2" font-size="38" font-weight="700">모델 적응</text>
    <text x="32" y="313" fill="#69cf82" font-size="36" font-weight="700">LLM Wiki</text>
    <text x="302" y="313" fill="#f5f5f2" font-size="38" font-weight="700">파일 정리</text>
    <g fill="none" stroke="#7d8883" stroke-width="3">
      <path d="M232 101H274"/><path d="M232 201H274"/><path d="M232 301H274"/>
      <path d="M500 101H548V162H600"/><path d="M500 201H600"/>
      <path d="M500 301H850V231H910"/><path d="M792 181H910"/>
    </g>
    <path d="M618 110H800" stroke="#a080ff" stroke-width="3"/>
    <text x="618" y="167" fill="#b7bab8" font-size="32">같은 질문</text>
    <text x="618" y="225" fill="#f5f5f2" font-size="48" font-weight="700">비교</text>
    <path d="M934 110H1168" stroke="#ff7a3d" stroke-width="3"/>
    <text x="934" y="167" fill="#f5f5f2" font-size="34" font-weight="700">위키 수정은</text>
    <text x="934" y="225" fill="#f5f5f2" font-size="44" font-weight="700">학습인가?</text>
    <path d="M1054 247V261" fill="none" stroke="#69cf82" stroke-width="3"/>
    <path d="M1054 267 1047 255H1061Z" fill="#69cf82"/>
    <text x="934" y="304" fill="#69cf82" font-size="32" font-weight="600">검토 후 저장</text>
    <path d="M1054 324V350H880V255H810" fill="none" stroke="#69cf82" stroke-width="3" stroke-dasharray="7 6"/>
    <g fill="#7d8883"><path d="M274 101 262 94V108Z"/><path d="M274 201 262 194V208Z"/><path d="M274 301 262 294V308Z"/><path d="M600 162 588 155V169Z"/><path d="M600 201 588 194V208Z"/><path d="M910 181 898 174V188Z"/><path d="M910 231 898 224V238Z"/></g>
    <path d="M810 255 824 247V263Z" fill="#69cf82"/>
    <text x="600" y="409" text-anchor="middle" fill="#69cf82" font-size="32" font-weight="600">질문에 답 저장 · 개념과 비교에 연결</text>
  </g>
</svg>
