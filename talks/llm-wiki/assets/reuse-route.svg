<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">고친 기록을 새 질문과 저장 기준에 다시 쓴다</title>
  <desc id="desc">고친 주장 C1을 첫 답 Q1에 반영하고 그 설명과 이전 선택 D1을 새 질문 Q2에서 다시 읽어 저장 기준 D2를 정한다. 아래는 함께 남는 기록이다. index는 읽기 입구, log는 바꾼 이유, D1은 대체된 선택을 보존하고 pending은 근거 부족 답을 남긴다. 사람이 검토한 연결이며 자동 영향 발견이나 스크립트 실행 순서를 뜻하지 않는다.</desc>
  <rect width="1200" height="450" fill="#090909"/>
  <g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <path d="M32 40H267M330 40H565M628 40H863M926 40H1168" stroke="#46524a" stroke-width="2"/>
    <text x="32" y="102" font-size="40" font-weight="700" fill="#f5f5f2">고친 주장</text>
    <text x="330" y="102" font-size="40" font-weight="700" fill="#f5f5f2">첫 답</text>
    <text x="628" y="102" font-size="40" font-weight="700" fill="#f5f5f2">새 질문</text>
    <text x="926" y="102" font-size="40" font-weight="700" fill="#f5f5f2">저장 기준</text>
    <text x="32" y="149" font-size="26" fill="#24a8ff">C1 · 범위 교정</text>
    <text x="330" y="149" font-size="26" fill="#24a8ff">Q1 · 고친 설명</text>
    <text x="628" y="149" font-size="26" fill="#69cf82">Q2 · 어떤 답을 남길까</text>
    <text x="926" y="149" font-size="26" fill="#69cf82">D2 · 검토 뒤 현행</text>
    <path d="M278 92H310M576 92H608M874 92H906" stroke="#88968d" stroke-width="3"/>
    <path d="M310 92 297 84V100ZM608 92 595 84V100ZM906 92 893 84V100Z" fill="#88968d"/>
    <text x="32" y="215" font-size="32" fill="#b7bab8">이전 설명과 선택을 다시 읽어 판단한다</text>
    <path d="M32 244H1168" stroke="#424744" stroke-width="2"/>
    <text x="32" y="290" font-size="28" fill="#b7bab8">함께 남는 기록</text>
    <text x="32" y="348" font-size="34" font-weight="700" fill="#f5f5f2">읽기 입구</text>
    <text x="330" y="348" font-size="34" font-weight="700" fill="#f5f5f2">바꾼 이유</text>
    <text x="628" y="348" font-size="34" font-weight="700" fill="#f5f5f2">이전 선택</text>
    <text x="926" y="348" font-size="34" font-weight="700" fill="#f5f5f2">검토 대기</text>
    <text x="32" y="392" font-size="26" fill="#24a8ff">index · 시작할 곳</text>
    <text x="330" y="392" font-size="26" fill="#24a8ff">log · 교정 이유</text>
    <text x="628" y="392" font-size="26" fill="#a080ff">D1 · 대체됨·보존</text>
    <text x="926" y="392" font-size="26" fill="#69cf82">pending · 근거 부족</text>
  </g>
</svg>
