<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">원자료를 보존하고, 연결된 wiki를 갱신합니다</title>
  <desc id="desc">Karpathy의 LLM Wiki 설계 제안을 다시 그린 자체 도식. raw 원자료에서 LLM이 wiki 파일을 갱신합니다. schema 작업 규칙은 wiki 아래 옆 칸에서 작업법을 정하며, 원자료 다음의 처리 단계가 아닙니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#24a8ff"/></marker>
    <marker id="rule" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#a080ff"/></marker>
  </defs>
  <rect width="1280" height="680" rx="24" fill="#090b10"/>
  <g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <text x="48" y="61" fill="#98a2b3" font-size="25" letter-spacing="2">LLM WIKI · 설계 제안</text>
    <rect x="48" y="120" width="414" height="298" rx="24" fill="#111923" stroke="#24a8ff" stroke-width="2"/>
    <path d="M84 166h36l14 14v39H84Z M120 166v14h14" stroke="#24a8ff" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <text x="84" y="278" fill="#f5f7fb" font-size="43" font-weight="700">원자료</text>
    <text x="84" y="329" fill="#24a8ff" font-size="31">raw · 보존</text>
    <text x="84" y="377" fill="#bac3d0" font-size="28">공지 · 읽기 메모 · 질문</text>
    <path d="M488 267H620" stroke="#24a8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <text x="550" y="222" text-anchor="middle" fill="#bac3d0" font-size="27">LLM</text>
    <text x="550" y="326" text-anchor="middle" fill="#bac3d0" font-size="27">갱신</text>
    <rect x="656" y="120" width="576" height="298" rx="24" fill="#101c17" stroke="#69cf82" stroke-width="2"/>
    <g fill="none" stroke="#69cf82" stroke-width="3"><path d="M700 171h51M712 198l29-23M712 198l57 14"/><circle cx="700" cy="171" r="8" fill="#101c17"/><circle cx="751" cy="171" r="8" fill="#101c17"/><circle cx="709" cy="200" r="8" fill="#101c17"/><circle cx="776" cy="214" r="8" fill="#101c17"/></g>
    <text x="696" y="278" fill="#f5f7fb" font-size="43" font-weight="700">연결된 wiki</text>
    <text x="696" y="329" fill="#69cf82" font-size="31">wiki · 파일로 축적</text>
    <text x="696" y="377" fill="#bac3d0" font-size="28">운영 ↔ 개념 ↔ 질문</text>
    <rect x="656" y="498" width="576" height="132" rx="20" fill="#191426" stroke="#a080ff" stroke-width="2"/>
    <text x="692" y="549" fill="#a080ff" font-size="32" font-weight="700">schema · 작업 규칙</text>
    <text x="692" y="596" fill="#e0d8f5" font-size="29">보존 · 연결 · 검토 방법</text>
    <path d="M944 493V433" stroke="#a080ff" stroke-width="3" stroke-dasharray="7 7" fill="none" marker-end="url(#rule)"/>
    <text x="48" y="555" fill="#f5f7fb" font-size="33" font-weight="600">남는 것은</text>
    <text x="48" y="606" fill="#bac3d0" font-size="31">다시 열어 고칠 수 있는 파일</text>
  </g>
</svg>
