<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">원자료는 보존하고 위키는 갱신하며 작업 규칙은 옆에서 적용합니다</title>
  <desc id="desc">Karpathy의 LLM Wiki 설계 아이디어를 다시 그린 자체 도식입니다. 왼쪽의 원자료를 보존하면서 LLM이 오른쪽의 연결된 위키 파일을 갱신합니다. 위키 아래의 schema는 자료가 통과하는 다음 단계가 아니라 보존·연결·검토 방법을 정하는 작업 규칙입니다. 규칙 준수를 보장한다는 뜻은 아닙니다.</desc>
  <rect width="1200" height="450" fill="#090909"/>
  <g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <path d="M36 83H410" stroke="#24a8ff" stroke-width="4"/>
    <text x="36" y="148" fill="#f5f5f2" font-size="48" font-weight="700">원자료</text>
    <text x="36" y="206" fill="#24a8ff" font-size="34">raw · 보존</text>
    <text x="36" y="261" fill="#b7bab8" font-size="32">논문 · 읽기 메모</text>
    <path d="M445 181H594" stroke="#24a8ff" stroke-width="4" />
    <path d="M594 181 576 170V192Z" fill="#24a8ff"/>
    <text x="517" y="145" text-anchor="middle" fill="#b7bab8" font-size="32">LLM</text>
    <text x="517" y="235" text-anchor="middle" fill="#b7bab8" font-size="32">갱신</text>
    <path d="M640 83H1164" stroke="#69cf82" stroke-width="4"/>
    <text x="640" y="148" fill="#f5f5f2" font-size="48" font-weight="700">연결된 위키</text>
    <text x="640" y="206" fill="#69cf82" font-size="34">wiki · 파일로 축적</text>
    <text x="640" y="261" fill="#b7bab8" font-size="32">개념 ↔ 비교 ↔ 질문</text>
    <path d="M640 329H1164" stroke="#a080ff" stroke-width="2"/>
    <text x="640" y="375" fill="#a080ff" font-size="36" font-weight="700">schema · 작업 규칙</text>
    <text x="640" y="421" fill="#b7bab8" font-size="32">보존 · 연결 · 검토 방법</text>
    <path d="M1118 319V282" fill="none" stroke="#a080ff" stroke-width="3" stroke-dasharray="6 6" />
    <path d="M1118 282 1108 298H1128Z" fill="#a080ff"/>
    <text x="36" y="367" fill="#b7bab8" font-size="32">다시 열어</text>
    <text x="36" y="413" fill="#b7bab8" font-size="32">고칠 수 있는 파일</text>
  </g>
</svg>
