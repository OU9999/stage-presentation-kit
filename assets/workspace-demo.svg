<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">발표 문장을 정리하는 작업 공간</title>
  <desc id="description">좌측에는 발표 개요, 가운데에는 편집 중인 제목과 문장, 우측에는 작성 가이드가 보이는 독자 제작 정적 화면입니다.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
      .ink { fill:#232323; }
      .muted { fill:#74746e; }
      .small { font-size:18px; }
      .body { font-size:25px; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#eeeee9"/>
  <rect width="1600" height="78" fill="#181818"/>
  <rect x="34" y="25" width="28" height="28" rx="6" fill="none" stroke="#e4e4df" stroke-width="2"/>
  <path d="M42 34h12M42 41h8M42 47h12" stroke="#e4e4df" stroke-width="2"/>
  <text x="80" y="49" fill="#f0f0eb" font-size="27" font-weight="500" letter-spacing="-.8">Workspace</text>
  <text x="1205" y="47" fill="#a6a6a0" font-size="18">모든 변경 내용 저장됨</text>
  <rect x="1410" y="20" width="154" height="39" rx="6" fill="#ecece6"/>
  <text x="1487" y="46" text-anchor="middle" fill="#242424" font-size="17" font-weight="500">발표 화면 보기 ↗</text>
  <rect x="0" y="78" width="268" height="822" fill="#e4e4de"/>
  <path d="M268 78v822" stroke="#d0d0c9"/>
  <text x="32" y="138" class="ink" font-size="21" font-weight="600">새로운 발표</text>
  <text x="32" y="168" class="muted" font-size="15">나만의 작업 공간</text>
  <rect x="18" y="208" width="232" height="50" rx="6" fill="#d2d2ca"/>
  <g fill="none" stroke="#555550" stroke-width="1.7"><rect x="34" y="225" width="16" height="16" rx="2"/><path d="M39 229v8M43 229v8"/></g>
  <text x="65" y="240" class="ink" font-size="18" font-weight="600">발표 개요</text>
  <text x="36" y="304" class="muted" font-size="15" letter-spacing="1.7">SLIDES</text>
  <text x="36" y="353" class="muted" font-size="16">01</text><text x="75" y="353" class="ink" font-size="18">시작하는 말</text>
  <text x="36" y="408" class="muted" font-size="16">02</text><text x="75" y="408" class="ink" font-size="18">하나의 메시지</text>
  <text x="36" y="463" class="muted" font-size="16">03</text><text x="75" y="463" class="ink" font-size="18">근거와 장면</text>
  <text x="36" y="518" class="muted" font-size="16">04</text><text x="75" y="518" class="ink" font-size="18">다음 행동</text>
  <path d="M28 788h212" stroke="#c7c7bf"/>
  <circle cx="43" cy="823" r="13" fill="#bfbfb5"/>
  <text x="68" y="829" class="muted" font-size="16">양식을 위한 예시 화면</text>
  <text x="340" y="142" class="muted" font-size="15" letter-spacing="2.4">DRAFT 01 / YOUR NEXT IDEA</text>
  <text x="340" y="254" class="ink" font-size="70" font-weight="500" letter-spacing="-3">이번에는,</text>
  <text x="340" y="342" class="ink" font-size="70" font-weight="500" letter-spacing="-3">무엇을 전할까요?</text>
  <text x="340" y="412" class="muted" font-size="27" letter-spacing="-.6">청중이 기억할 생각 하나부터 시작하세요.</text>
  <path d="M340 468h820" stroke="#c5c5bd"/>
  <circle cx="356" cy="536" r="16" fill="#33332f"/>
  <text x="356" y="542" text-anchor="middle" fill="#eeeeea" font-size="16">1</text>
  <text x="395" y="544" class="ink" font-size="28" font-weight="500" letter-spacing="-.8">먼저, 한 문장을 적어보세요.</text>
  <text x="395" y="588" class="muted" font-size="23" letter-spacing="-.4">말하고 싶은 모든 것보다, 가장 전하고 싶은 것.</text>
  <circle cx="356" cy="664" r="16" fill="#d2d2c9"/>
  <text x="356" y="670" text-anchor="middle" fill="#65655d" font-size="16">2</text>
  <text x="395" y="672" class="ink" font-size="28" font-weight="500" letter-spacing="-.8">그 생각이 보이는 장면을 고르세요.</text>
  <text x="395" y="716" class="muted" font-size="23" letter-spacing="-.4">차트 하나, 실제 화면 하나. 근거는 가까이 두세요.</text>
  <path d="M1220 118v674" stroke="#d0d0c7"/>
  <text x="1260" y="149" class="muted" font-size="15" letter-spacing="1.6">WRITING GUIDE</text>
  <text x="1260" y="218" class="ink" font-size="24" font-weight="500">적게 쓰고,</text>
  <text x="1260" y="253" class="ink" font-size="24" font-weight="500">더 또렷하게.</text>
  <path d="M1260 288h278" stroke="#cfcfc6"/>
  <text x="1260" y="334" class="muted" font-size="18">한 장의 핵심 메시지</text>
  <text x="1260" y="384" class="ink" font-size="42" font-weight="400">1</text>
  <text x="1296" y="382" class="muted" font-size="18">개</text>
  <text x="1260" y="450" class="muted" font-size="18">권장 제목 길이</text>
  <text x="1260" y="500" class="ink" font-size="42" font-weight="400">1–2</text>
  <text x="1346" y="498" class="muted" font-size="18">줄</text>
  <path d="M1260 550h278" stroke="#cfcfc6"/>
  <text x="1260" y="599" class="muted" font-size="18">완성되면</text>
  <text x="1260" y="632" class="ink" font-size="20">실제 화면에서</text>
  <text x="1260" y="663" class="ink" font-size="20">한 번 말해보세요.</text>
  <path d="M268 850h1332" stroke="#d0d0c7"/>
  <text x="340" y="881" class="muted" font-size="15">개인 작업 공간 / 새로운 발표 / 개요</text>
  <text x="1534" y="881" text-anchor="end" class="muted" font-size="15">독자 제작 정적 화면 · 자유롭게 교체하세요</text>
</svg>
