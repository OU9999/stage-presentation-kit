<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">자료를 고른 맥락과 다음 쓰임을 함께 남기기</title>
<desc id="desc">사람이 직접 적은 목적·선택 이유·중요한 점·앞으로의 쓰임을 자작 예제로 보여준다. 다음 AI 스터디의 한 쪽 진행안을 만들려는 설명용 목적이며 실제 개인 프로필이나 외부 발표자의 인용문이 아니다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="118" font-size="30" fill="#A4A4A1" font-weight="400" text-anchor="start">사람이 남기는 선택 이유</text><text x="35" y="234" font-size="47" fill="#F6F6F4" font-weight="550" text-anchor="start">좋았던 자료를</text><text x="35" y="311" font-size="47" fill="#F6F6F4" font-weight="550" text-anchor="start">다음 스터디의</text><text x="35" y="388" font-size="47" fill="#F6F6F4" font-weight="550" text-anchor="start">진행안으로</text><text x="35" y="530" font-size="32" fill="#FF7A3D" font-weight="400" text-anchor="start">쓰임을 먼저 정합니다.</text><text x="610" y="115" font-size="30" fill="#A4A4A1" font-weight="400" text-anchor="start">맥락</text><text x="610" y="168" font-size="36" fill="#F6F6F4" font-weight="500" text-anchor="start">다음 AI 스터디를 준비합니다.</text><text x="610" y="245" font-size="30" fill="#A4A4A1" font-weight="400" text-anchor="start">선택 이유</text><text x="610" y="298" font-size="36" fill="#F6F6F4" font-weight="500" text-anchor="start">차이를 설명할 자료를 골랐습니다.</text><text x="610" y="375" font-size="30" fill="#A4A4A1" font-weight="400" text-anchor="start">중요한 점</text><text x="610" y="428" font-size="36" fill="#F6F6F4" font-weight="500" text-anchor="start">원문 · 내 이유 · 연결된 종합</text><text x="610" y="505" font-size="30" fill="#A4A4A1" font-weight="400" text-anchor="start">앞으로의 쓰임</text><text x="610" y="558" font-size="36" fill="#F6F6F4" font-weight="500" text-anchor="start">한 쪽 진행안과 다음 읽기 활동</text></g>
</svg>
