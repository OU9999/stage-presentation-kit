<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Q2는 교정한 설명과 이전 결정을 다시 읽는다</title>
  <desc id="desc">Q2 우리 스터디는 어떤 답을 저장할까의 다시 읽은 파일은 C1, Q1, D1이다. C1은 링크가 있어도 일반화가 틀릴 수 있음을 보여 주고, Q1은 다음 답에 쓰려면 고친 파일을 다시 찾아 읽어야 한다고 설명하며, 초기 D1은 모든 질문의 답을 현행 노트로 저장하기로 했었다. 이 셋은 발표자가 만든 고정 승인 구성 예제의 판단 입력이다. 스크립트가 자동 검색이나 새 답 생성에 성공했다는 실험이 아니다.</desc>
  <rect width="1200" height="450" fill="#090909"/>
  <g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <text x="32" y="46" fill="#a080ff" font-size="36" font-weight="700">새 질문 Q2</text>
    <text x="32" y="133" fill="#f5f5f2" font-size="42" font-weight="700">우리 스터디는</text>
    <text x="32" y="191" fill="#f5f5f2" font-size="42" font-weight="700">어떤 답을</text>
    <text x="32" y="249" fill="#f5f5f2" font-size="42" font-weight="700">저장할까</text>
    <text x="32" y="329" fill="#b7bab8" font-size="32" font-weight="400">다시 읽은 파일</text>
    <path d="M340 217H402" stroke="#a080ff" stroke-width="3"/><path d="M402 217l-12 -8v16Z" fill="#a080ff"/>
    <path d="M436 57H1168" stroke="#24a8ff" stroke-width="2"/>
    <text x="436" y="105" fill="#24a8ff" font-size="36" font-weight="700">C1</text>
    <text x="535" y="105" fill="#f5f5f2" font-size="32" font-weight="400">링크가 있어도 일반화가 틀릴 수 있다</text>
    <path d="M436 178H1168" stroke="#24a8ff" stroke-width="2"/>
    <text x="436" y="226" fill="#24a8ff" font-size="36" font-weight="700">Q1</text>
    <text x="535" y="226" fill="#f5f5f2" font-size="32" font-weight="400">다음 답에 쓰려면 고친 파일을 다시 읽는다</text>
    <path d="M436 299H1168" stroke="#ff7a3d" stroke-width="2"/>
    <text x="436" y="347" fill="#ff7a3d" font-size="36" font-weight="700">D1</text>
    <text x="535" y="347" fill="#f5f5f2" font-size="32" font-weight="400">모든 질문의 답을 현행 노트로 저장한다</text>
    <text x="436" y="422" fill="#b7bab8" font-size="32" font-weight="400">고정 승인 예제의 판단 입력 · 검색·생성 성능 미측정</text>
  </g>
</svg>
