<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">자료 비교를 우리 스터디 계획으로 종합</title>
<desc id="desc">RAG와 LLM Wiki의 정리 시점·남는 결과·병행 방식을 비교한 뒤 자료 세 메모·개념과 비교·다음 질문의 재읽기를 갖춘 우리 스터디 첫 시도 계획을 작성하는 설명용 예다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="36" y="95" font-size="43" fill="#252A28" font-weight="600" text-anchor="start">자료 사이의 차이</text><text x="36" y="162" font-size="34" fill="#286A5B" font-weight="600" text-anchor="start">RAG  ↔  LLM Wiki</text><path d="M36 191L708 191" fill="none" stroke="#CBD0C6" stroke-width="2"/><text x="36" y="245" font-size="30" fill="#68716B" font-weight="400" text-anchor="start">정리하는 시점</text><text x="36" y="300" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">질문할 때 · 자료를 반영할 때</text><path d="M36 316L708 316" fill="none" stroke="#CBD0C6" stroke-width="2"/><text x="36" y="370" font-size="30" fill="#68716B" font-weight="400" text-anchor="start">남는 결과</text><text x="36" y="425" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">근거와 답 · 연결된 개념과 종합</text><path d="M36 441L708 441" fill="none" stroke="#CBD0C6" stroke-width="2"/><text x="36" y="495" font-size="30" fill="#68716B" font-weight="400" text-anchor="start">함께 쓰는 방식</text><text x="36" y="550" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">위키를 검색 대상으로 활용</text><path d="M733 300L799 300" fill="none" stroke="#BD4B45" stroke-width="2"/><path d="M786 292L799 300L786 308" fill="none" stroke="#BD4B45" stroke-width="2"/><rect x="833" y="36" width="630" height="500" rx="12" fill="#172238"/><text x="875" y="108" font-size="43" fill="#FCFBF7" font-weight="600" text-anchor="start">우리의 첫 시도</text><text x="875" y="206" font-size="35" fill="#FCFBF7" font-weight="400" text-anchor="start">세 메모를 함께 읽습니다.</text><text x="875" y="288" font-size="35" fill="#FCFBF7" font-weight="400" text-anchor="start">개념·비교·계획을 남깁니다.</text><text x="875" y="370" font-size="35" fill="#FCFBF7" font-weight="400" text-anchor="start">후속 질문에서 다시 읽습니다.</text><text x="875" y="489" font-size="27" fill="#63D7C5" font-weight="400" text-anchor="start">syntheses/study-plan.md</text></g>
</svg>
