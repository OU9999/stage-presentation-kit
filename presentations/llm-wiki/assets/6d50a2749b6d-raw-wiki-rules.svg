<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">원자료와 위키와 전역 작업 규칙</title>
<desc id="desc">raw에는 세 영상 읽기 메모를 보존하고 wiki에는 개념·비교·종합·질문·목차와 로그를 작성하고 갱신한다. 두 영역 밖 아래 공통 행의 rules.md가 전체 작업을 안내한다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
