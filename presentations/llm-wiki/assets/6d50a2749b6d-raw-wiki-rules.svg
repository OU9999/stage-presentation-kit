path d="M37 507L1460 507" fill="none" stroke="#286A5B" stroke-width="2"/><text x="39" y="563" font-size="30" fill="#286A5B" font-weight="600" text-anchor="start">rules.md</text><text x="225" y="563" font-size="30" fill="#252A28" font-weight="400" text-anchor="start">원자료 보존 · 근거 연결 · 관련 페이지 갱신 · 중요한 결과 확인</text></g>
