<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">한 자료의 요약과 여러 자료의 개념 페이지</title>
<desc id="desc">한 영상의 요약은 원문 위치와 그 자료의 설명을 다시 찾는 입구다. 개념 페이지는 여러 자료가 다루는 설명을 종합하고 세 읽기 메모와 관련 비교·계획 페이지에 연결한다. 발표용 구성 예다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><rect x="35" y="40" width="610" height="492" rx="10" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><text x="76" y="102" font-size="30" fill="#286A5B" font-weight="600" text-anchor="start">자료 요약</text><text x="76" y="163" font-size="39" fill="#252A28" font-weight="600" text-anchor="start">브라이언 영상 메모</text><text x="76" y="251" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">자료를 넣는 목적을 묻는다.</text><text x="76" y="316" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">개념을 뽑아 서로 연결한다.</text><path d="M76 394L601 394" fill="none" stroke="#CBD0C6" stroke-width="2"/><text x="76" y="448" font-size="28" fill="#68716B" font-weight="400" text-anchor="start">이 자료가 말한 내용을 다시 찾는 입구</text><text x="76" y="499" font-size="27" fill="#68716B" font-weight="400" text-anchor="start">원문 위치  09:41 · 11:04 · 31:37</text><path d="M666 280L720 280" fill="none" stroke="#68716B" stroke-width="2"/><path d="M707 272L720 280L707 288" fill="none" stroke="#68716B" stroke-width="2"/><rect x="747" y="40" width="716" height="492" rx="12" fill="#172238"/><text x="788" y="102" font-size="30" fill="#63D7C5" font-weight="600" text-anchor="start">개념 페이지</text><text x="788" y="163" font-size="43" fill="#FCFBF7" font-weight="600" text-anchor="start">LLM Wiki</text><text x="788" y="252" font-size="34" fill="#FCFBF7" font-weight="400" text-anchor="start">자료 사이의 관계와 현재 이해를</text><text x="788" y="317" font-size="34" fill="#FCFBF7" font-weight="400" text-anchor="start">연결된 문서로 작성하고 갱신한다.</text><path d="M788 394L1420 394" fill="none" stroke="#45686E" stroke-width="2"/><text x="788" y="450" font-size="28" fill="#63D7C5" font-weight="400" text-anchor="start">근거  대담 두 편 + 공동 세미나</text><text x="788" y="501" font-size="28" fill="#63D7C5" font-weight="400" text-anchor="start">연결  RAG와 위키 비교 · 현재 계획</text></g>
</svg>
