<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">질문 답과 근거와 남은 확인이 담긴 새 문서</title>
<desc id="desc">활동을 준비하며 목차에서 개념·비교·현재 계획을 찾아 읽는다는 검토한 답을 질문 페이지에 저장한 구성 예다. 근거와 남은 확인을 연결하며, 15분 읽기 활동 중 위키 파일을 쓴다는 뜻이나 실제 모델 실행 결과가 아니다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="224" font-size="34" fill="#F6F6F4" font-weight="550" text-anchor="start">검토한 질문과 답</text><text x="35" y="309" font-size="41" fill="#F6F6F4" font-weight="400" text-anchor="start">다시 읽을</text><text x="35" y="382" font-size="41" fill="#F6F6F4" font-weight="400" text-anchor="start">위키의 일부로</text><path d="M340 315L395 315" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M382 307L395 315L382 323" fill="none" stroke="#5A5A57" stroke-width="2"/><rect x="425" y="35" width="1040" height="520" rx="8" fill="#F6F6F4" stroke="#CDCDC7" stroke-width="2"/><text x="466" y="94" font-size="27" fill="#62625F" font-weight="400" text-anchor="start">wiki/questions/first-study.md</text><path d="M466 120L1422 120" fill="none" stroke="#CDCDC7" stroke-width="2"/><text x="466" y="185" font-size="36" fill="#1D1D1B" font-weight="600" text-anchor="start">입문자와 15분 활동은 무엇부터 할까?</text><text x="466" y="279" font-size="34" fill="#1D1D1B" font-weight="400" text-anchor="start">목차에서 개념·비교·계획을 찾아 읽습니다.</text><text x="466" y="344" font-size="34" fill="#1D1D1B" font-weight="400" text-anchor="start">근거를 찾고, 질문 답을 남겨 다시 읽습니다.</text><path d="M466 385L1422 385" fill="none" stroke="#CDCDC7" stroke-width="2"/><text x="466" y="442" font-size="30" fill="#2D6A43" font-weight="400" text-anchor="start">근거  관련 개념 · 비교 · 현재 계획</text><text x="466" y="511" font-size="29" fill="#62625F" font-weight="400" text-anchor="start">남은 확인  필요한 페이지를 실제로 읽었는가?</text></g>
</svg>
