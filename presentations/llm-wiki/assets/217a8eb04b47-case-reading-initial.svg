<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title desc">
<title id="title">1장 근거로 인물과 신뢰 주제를 연결한다</title>
<desc id="desc">가상 소설의1장까지 읽은 상태다. 서하가 지도를 숨기고 북문을 떠난 행동과 버림받았다는 도윤의 말을 인물과 신뢰 주제에 연결한다. 서하의 동기는 아직 미확인이다.</desc>
<rect width="1500" height="540" fill="#080808"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" letter-spacing="-.6">
<text x="40" y="55" font-size="30" fill="#a5a5a2" font-weight="400" text-anchor="start">1장까지 읽은 근거</text>
<text x="40" y="135" font-size="30" fill="#24a8ff" font-weight="400" text-anchor="start">서하의 행동</text>
<text x="40" y="190" font-size="40" fill="#f6f6f4" font-weight="400" text-anchor="start">지도를 숨기고 북문을 떠남</text>
<text x="40" y="290" font-size="30" fill="#a080ff" font-weight="400" text-anchor="start">도윤의 말</text>
<text x="40" y="345" font-size="40" fill="#f6f6f4" font-weight="400" text-anchor="start">버림받았다고 느낀다.</text>
<path d="M619 246L713 246" fill="none" stroke="#a5a5a2" stroke-width="2"/><polyline points="701,238 713,246 701,254" fill="none" stroke="#a5a5a2" stroke-width="2.5"/>
<text x="785" y="55" font-size="30" fill="#69cf82" font-weight="400" text-anchor="start">현재 인물 페이지</text>
<text x="785" y="150" font-size="72" fill="#f6f6f4" font-weight="400" text-anchor="start">서하</text>
<text x="785" y="225" font-size="40" fill="#f6f6f4" font-weight="400" text-anchor="start">행동은 알지만,</text>
<text x="785" y="286" font-size="40" fill="#ff9d60" font-weight="400" text-anchor="start">동기는 아직 미확인.</text>
<path d="M785 325L1460 325" fill="none" stroke="#474745" stroke-width="2"/>
<text x="785" y="389" font-size="44" fill="#a080ff" font-weight="400" text-anchor="start">신뢰</text>
<text x="1016" y="389" font-size="44" fill="#24a8ff" font-weight="400" text-anchor="start">1장</text>
<path d="M891 373L979 373" fill="none" stroke="#474745" stroke-width="2"/>
<text x="785" y="441" font-size="28" fill="#a5a5a2" font-weight="400" text-anchor="start">연결할 주제</text>
<text x="1016" y="441" font-size="28" fill="#a5a5a2" font-weight="400" text-anchor="start">다시 읽을 근거</text>
</g>
</svg>
