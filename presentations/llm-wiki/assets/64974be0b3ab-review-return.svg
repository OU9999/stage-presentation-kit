<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">진행안의 검토와 선택 이유를 다음 질문으로 연결</title>
<desc id="desc">활동안의 시간 합계·출처와 작성 주체·근거 및 문서 연결을 대조한 범위를 나타낸다. 결과·두 메모의 선택 이유·남은 확인을 저장하고 30분이라면 무엇을 더 읽고 확인할지라는 후속 질문에 연결한다. 실제 학습효과나 사람 실행을 검증한 통계가 아니다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="115" font-size="38" fill="#F6F6F4" font-weight="550" text-anchor="start">대조한 내용</text><text x="35" y="216" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">2 + 4 + 5 + 4 = 15분</text><text x="35" y="304" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">출처와 작성 주체</text><text x="35" y="392" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">근거와 문서 연결</text><text x="35" y="520" font-size="28" fill="#A4A4A1" font-weight="400" text-anchor="start">문서에서 확인한 범위</text><path d="M437 315L493 315" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M480 307L493 315L480 323" fill="none" stroke="#5A5A57" stroke-width="2"/><rect x="520" y="55" width="525" height="485" rx="8" fill="#F6F6F4" stroke="#CDCDC7" stroke-width="2"/><text x="560" y="125" font-size="36" fill="#1D1D1B" font-weight="600" text-anchor="start">결과와 이유를 저장</text><text x="560" y="227" font-size="35" fill="#1D1D1B" font-weight="400" text-anchor="start">한 쪽 진행안</text><text x="560" y="315" font-size="35" fill="#1D1D1B" font-weight="400" text-anchor="start">두 메모의 선택 이유</text><text x="560" y="403" font-size="35" fill="#1D1D1B" font-weight="400" text-anchor="start">아직 남은 확인</text><text x="560" y="496" font-size="29" fill="#2D6A43" font-weight="400" text-anchor="start">검토 기록을 위키에 연결</text><path d="M1062 315L1120 315" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M1107 307L1120 315L1107 323" fill="none" stroke="#5A5A57" stroke-width="2"/><text x="1150" y="150" font-size="29" fill="#A4A4A1" font-weight="400" text-anchor="start">다음 질문</text><text x="1150" y="233" font-size="43" fill="#F6F6F4" font-weight="550" text-anchor="start">30분이라면?</text><text x="1150" y="338" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">이번 결과와</text><text x="1150" y="406" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">선택 이유부터</text><text x="1150" y="474" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">다시 읽습니다.</text></g>
</svg>
