<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">검토한 답과 근거가 저장된 새 질문 페이지</title>
<desc id="desc">입문자와 15분 활동에서 목차·연결을 읽고 근거를 찾은 뒤 질문 답을 남긴다는 검토한 답을 질문 페이지로 저장한다. 관련 개념·비교·현재 계획을 근거로 연결하고 실제로 읽었는지라는 남은 확인도 남긴다. 실제 모델 실행 결과가 아닌 설명용 구성이다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><rect x="33" y="183" width="285" height="224" rx="12" fill="#172238"/><text x="65" y="258" font-size="35" fill="#FCFBF7" font-weight="600" text-anchor="start">질문과 답도</text><text x="65" y="324" font-size="35" fill="#FCFBF7" font-weight="600" text-anchor="start">위키의 일부로</text><path d="M337 294L393 294" fill="none" stroke="#286A5B" stroke-width="2"/><path d="M380 286L393 294L380 302" fill="none" stroke="#286A5B" stroke-width="2"/><rect x="420" y="35" width="1044" height="505" rx="10" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><text x="461" y="91" font-size="27" fill="#68716B" font-weight="400" text-anchor="start">wiki/questions/first-study.md</text><path d="M461 117L1423 117" fill="none" stroke="#CBD0C6" stroke-width="2"/><text x="461" y="177" font-size="35" fill="#252A28" font-weight="600" text-anchor="start">입문자와 15분 활동은 무엇부터 할까?</text><text x="461" y="260" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">공개 메모 두 개에서 목차와 연결을 읽습니다.</text><text x="461" y="323" font-size="34" fill="#252A28" font-weight="400" text-anchor="start">근거를 찾고, 질문 답을 남겨 다시 읽습니다.</text><path d="M461 369L1423 369" fill="none" stroke="#CBD0C6" stroke-width="2"/><text x="461" y="421" font-size="30" fill="#286A5B" font-weight="400" text-anchor="start">근거  관련 개념 · 비교 · 현재 계획</text><text x="461" y="485" font-size="29" fill="#68716B" font-weight="400" text-anchor="start">남은 확인  필요한 페이지를 실제로 읽었는가?</text><text x="35" y="583" font-size="30" fill="#68716B" font-weight="400" text-anchor="start">저장한 답과 종합을, 한 쪽 진행안을 만드는 근거로 다시 읽습니다.</text></g>
</svg>
