<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">합성 예제: 변경 공지에서 새 주장과 새 결정을 연결하고 이전 결정을 보존합니다</title>
  <desc id="desc">E2 공지 2판은 이번 11월 5일 모임의 시작을 오후 8시 30분으로 명시적으로 변경합니다. EC2의 현행 주장은 11월 5일 오후 8시 30분 시작이며, 사람이 해당 범위와 영향을 검토하고 ED2로 이번 안내 교체를 가상 승인합니다. 이전 ED1의 오후 8시 안내 결정은 삭제하지 않고 superseded by ED2로 남깁니다. 운영 페이지와 관련 안내를 점검할 일로 남기며 다른 날짜로 확대하지 않습니다. 모두 합성 예제입니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#66748a"/></marker></defs>
  <rect width="1280" height="720" rx="24" fill="#090b10"/>
  <g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <text x="48" y="57" fill="#98a2b3" font-size="25" letter-spacing="2">새 자료가 오면 · 영향과 결정 검토</text>
    <rect x="1034" y="24" width="198" height="48" rx="24" fill="#302315"/><text x="1133" y="56" text-anchor="middle" fill="#edcf66" font-size="26" font-weight="600">합성 예제</text>
    <rect x="48" y="136" width="344" height="250" rx="22" fill="#111923" stroke="#24a8ff" stroke-width="2"/>
    <text x="77" y="184" fill="#24a8ff" font-size="28" font-weight="600">E2 · 변경 공지</text>
    <text x="77" y="255" fill="#f5f7fb" font-size="36" font-weight="700">11월 5일</text><text x="77" y="307" fill="#f5f7fb" font-size="36" font-weight="700">20:30으로 변경</text><text x="77" y="358" fill="#bac3d0" font-size="27">2판의 명시적 변경</text>
    <rect x="468" y="136" width="344" height="250" rx="22" fill="#191426" stroke="#a080ff" stroke-width="2"/>
    <text x="497" y="184" fill="#a080ff" font-size="28" font-weight="600">EC2 · 현행 주장</text>
    <text x="497" y="255" fill="#f5f7fb" font-size="36" font-weight="700">11월 5일 시작</text><text x="497" y="307" fill="#f5f7fb" font-size="42" font-weight="700">20:30</text><text x="497" y="358" fill="#bac3d0" font-size="27">근거 · E2 변경 문장</text>
    <rect x="888" y="136" width="344" height="250" rx="22" fill="#101c17" stroke="#69cf82" stroke-width="2"/>
    <text x="917" y="184" fill="#69cf82" font-size="28" font-weight="600">ED2 · 새 결정</text>
    <text x="917" y="255" fill="#f5f7fb" font-size="36" font-weight="700">이번 안내 교체</text><text x="917" y="307" fill="#f5f7fb" font-size="36" font-weight="700">사람이 검토·승인</text><text x="917" y="358" fill="#bac3d0" font-size="27">가상 accepted</text>
    <g fill="none" stroke="#66748a" stroke-width="3" marker-end="url(#arrow)"><path d="M410 261H449"/><path d="M830 261H869"/></g>
    <rect x="48" y="474" width="764" height="185" rx="20" fill="#12151c" stroke="#3c475a" stroke-width="2"/>
    <text x="78" y="522" fill="#edcf66" font-size="30" font-weight="600">이번 날짜의 범위</text>
    <text x="78" y="570" fill="#f5f7fb" font-size="31">운영 페이지와 관련 안내 점검</text>
    <text x="78" y="620" fill="#bac3d0" font-size="29">다른 날짜까지 확대하지 않기</text>
    <rect x="888" y="474" width="344" height="185" rx="20" fill="#241810" stroke="#ff7a3d" stroke-width="2"/>
    <text x="917" y="520" fill="#ff7a3d" font-size="28" font-weight="600">ED1 · 이전 결정</text><text x="917" y="569" fill="#f5f7fb" font-size="32">20:00 안내 · 보존</text><text x="917" y="618" fill="#ffbd9e" font-size="26">superseded → ED2</text>
    <path d="M1060 469V409" fill="none" stroke="#66748a" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
