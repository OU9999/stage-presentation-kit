<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">원자료와 위키를 구별하고 전체 작업 규칙을 두기</title>
<desc id="desc">raw의 context-note.md·retrieval-note.md·synthesis-note.md는 자작 설명용 원자료 메모다. wiki의 개념·비교·종합·질문·목차·로그를 작성하고 갱신하며 두 영역 밖 rules.md가 전체 작업을 안내한다. 원요지·사람의 이유·종합을 구별한다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><rect x="35" y="35" width="425" height="420" rx="8" fill="#F6F6F4" stroke="#CDCDC7" stroke-width="2"/><text x="73" y="103" font-size="44" fill="#1D1D1B" font-weight="600" text-anchor="start">raw/</text><text x="73" y="161" font-size="34" fill="#1D1D1B" font-weight="400" text-anchor="start">보존할 원자료</text><path d="M73 190L421 190" fill="none" stroke="#CDCDC7" stroke-width="2"/><text x="73" y="247" font-size="30" fill="#62625F" font-weight="400" text-anchor="start">context-note.md</text><text x="73" y="304" font-size="30" fill="#62625F" font-weight="400" text-anchor="start">retrieval-note.md</text><text x="73" y="361" font-size="30" fill="#62625F" font-weight="400" text-anchor="start">synthesis-note.md</text><text x="73" y="415" font-size="27" fill="#62625F" font-weight="400" text-anchor="start">요지 · 선택 이유 · 남은 질문</text><path d="M487 250L560 250" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M547 242L560 250L547 258" fill="none" stroke="#5A5A57" stroke-width="2"/><text x="600" y="104" font-size="44" fill="#F6F6F4" font-weight="600" text-anchor="start">wiki/</text><text x="600" y="163" font-size="34" fill="#A4A4A1" font-weight="400" text-anchor="start">작성하고 갱신할 이해</text><text x="600" y="238" font-size="34" fill="#F6F6F4" font-weight="550" text-anchor="start">개념</text><text x="915" y="238" font-size="32" fill="#F6F6F4" font-weight="400" text-anchor="start">여러 자료에서 만나는 설명</text><text x="600" y="315" font-size="34" fill="#F6F6F4" font-weight="550" text-anchor="start">비교 · 종합</text><text x="915" y="315" font-size="32" fill="#F6F6F4" font-weight="400" text-anchor="start">차이와 현재 계획</text><text x="600" y="392" font-size="34" fill="#F6F6F4" font-weight="550" text-anchor="start">질문 · 목차 · 로그</text><text x="915" y="392" font-size="32" fill="#F6F6F4" font-weight="400" text-anchor="start">답과 탐색, 변화의 이유</text><path d="M35 510L1460 510" fill="none" stroke="#5A5A57" stroke-width="2"/><text x="35" y="565" font-size="30" fill="#F6F6F4" font-weight="550" text-anchor="start">rules.md</text><text x="230" y="565" font-size="30" fill="#A4A4A1" font-weight="400" text-anchor="start">원자료 보존 · 근거 연결 · 관련 쪽 갱신 · 중요한 결과 확인</text></g>
</svg>
