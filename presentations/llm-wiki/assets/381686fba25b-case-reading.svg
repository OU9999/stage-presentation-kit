<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title desc">
<title id="title">새 장을 읽으면 인물과 주제의 해석도 달라진다</title>
<desc id="desc">가상 소설의 구성 예다. 1장에서 서하는 지도를 숨기고 떠났고 3장에서 지도에 추적 장치가 있었다는 정보가 추가된다. 동료를 피신시키려 했다는 서하의 자기 설명을 인물·신뢰 주제·장 요약에 연결하되 그 말 전체의 진위는 미확인으로 남긴다.</desc>
<rect width="1500" height="540" fill="#080808"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" letter-spacing="-.6">
<text x="40" y="55" font-size="30" fill="#a5a5a2" font-weight="400" text-anchor="start">장 메모에서 읽은 것</text>
<text x="40" y="135" font-size="30" fill="#24a8ff" font-weight="400" text-anchor="start">1장 · 행동</text>
<text x="40" y="190" font-size="40" fill="#f6f6f4" font-weight="400" text-anchor="start">지도를 숨기고 북문을 떠남</text>
<text x="40" y="290" font-size="30" fill="#ff9d60" font-weight="400" text-anchor="start">3장 · 새로 알게 된 것</text>
<text x="40" y="345" font-size="36" fill="#f6f6f4" font-weight="400" text-anchor="start">지도에는 추적 장치가 있었다.</text>
<text x="40" y="399" font-size="32" fill="#a5a5a2" font-weight="400" text-anchor="start">서하: “동료를 피신시키려 했다.”</text>
<path d="M619 246L713 246" fill="none" stroke="#a5a5a2" stroke-width="2"/><polyline points="701,238 713,246 701,254" fill="none" stroke="#a5a5a2" stroke-width="2.5"/>
<text x="785" y="55" font-size="30" fill="#69cf82" font-weight="400" text-anchor="start">갱신할 인물 페이지</text>
<text x="785" y="150" font-size="72" fill="#f6f6f4" font-weight="400" text-anchor="start">서하</text>
<text x="785" y="217" font-size="36" fill="#f6f6f4" font-weight="400" text-anchor="start">동료 보호가 목적이었다고 설명한다.</text>
<path d="M785 261L1460 261" fill="none" stroke="#474745" stroke-width="2"/>
<text x="785" y="325" font-size="44" fill="#a080ff" font-weight="400" text-anchor="start">신뢰</text>
<text x="1016" y="325" font-size="44" fill="#24a8ff" font-weight="400" text-anchor="start">1·3장</text>
<path d="M891 309L979 309" fill="none" stroke="#474745" stroke-width="2"/>
<text x="785" y="370" font-size="28" fill="#a5a5a2" font-weight="400" text-anchor="start">주제</text>
<text x="1016" y="370" font-size="28" fill="#a5a5a2" font-weight="400" text-anchor="start">다시 읽을 근거</text>
<path d="M785 420L785 495" fill="none" stroke="#ff9d60" stroke-width="4"/>
<text x="810" y="451" font-size="28" fill="#ff9d60" font-weight="400" text-anchor="start">미확인</text>
<text x="810" y="493" font-size="32" fill="#a5a5a2" font-weight="400" text-anchor="start">서하의 설명 전체와 이후 선택</text>
</g>
</svg>
