<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">외부 파일을 쓰면 학습이 없다는 일반화를 원문과 대조해 고칩니다</title>
  <desc id="desc">가상 학습자가 쓴 '외부 파일 사용은 학습 없음'이라는 과도한 문장을 검토합니다. RAG 논문의 §2.4는 학습 절차를 포함하고 LoRA 논문의 §4.1은 기본 가중치를 고정하며 추가 행렬을 학습하는 방법을 설명합니다. 따라서 이 사례의 위키 파일 수정과 모델 매개변수 학습을 구분하도록 문장을 고칩니다. 실제 원문과 가상의 수정 과정은 구분하며 log에는 무엇을 왜 고쳤는지 남깁니다. 관련 비교 페이지와 질문 답을 다시 읽어야 할 후보로 삼습니다.</desc>
  <rect width="1200" height="450" fill="#090909"/>
  <g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <text x="32" y="49" fill="#ff7a3d" font-size="32">검토 전</text>
    <text x="438" y="49" fill="#24a8ff" font-size="32">원문 대조</text>
    <text x="850" y="49" fill="#69cf82" font-size="32">범위 교정</text>
    <path d="M32 76H340" stroke="#ff7a3d" stroke-width="3"/>
    <path d="M438 76H752" stroke="#24a8ff" stroke-width="3"/>
    <path d="M850 76H1168" stroke="#69cf82" stroke-width="3"/>
    <text x="32" y="143" fill="#f5f5f2" font-size="40" font-weight="700">외부 파일 사용</text>
    <text x="32" y="204" fill="#f5f5f2" font-size="40" font-weight="700">= 학습 없음</text>
    <path d="M32 187H290" stroke="#ff7a3d" stroke-width="3"/>
    <text x="32" y="274" fill="#ff7a3d" font-size="32">과도한 일반화 제거</text>
    <text x="438" y="139" fill="#f5f5f2" font-size="38" font-weight="700">RAG §2.4</text>
    <text x="438" y="185" fill="#b7bab8" font-size="32">학습 절차 포함</text>
    <text x="438" y="245" fill="#f5f5f2" font-size="38" font-weight="700">LoRA §4.1</text>
    <text x="438" y="291" fill="#b7bab8" font-size="32">추가 행렬 학습</text>
    <text x="850" y="143" fill="#f5f5f2" font-size="40" font-weight="700">파일 수정과</text>
    <text x="850" y="204" fill="#f5f5f2" font-size="40" font-weight="700">매개변수 학습을</text>
    <text x="850" y="265" fill="#69cf82" font-size="44" font-weight="700">구분</text>
    <g fill="none" stroke="#7d8883" stroke-width="3"><path d="M360 188H410"/><path d="M772 188H822"/></g>
    <g fill="#7d8883"><path d="M410 188 398 181V195Z"/><path d="M822 188 810 181V195Z"/></g>
    <path d="M32 350H1168" stroke="#424744" stroke-width="2"/>
    <text x="32" y="411" fill="#b7bab8" font-size="32">log · 무엇을 왜 고쳤나</text>
    <text x="650" y="411" fill="#b7bab8" font-size="32">다시 검토할 곳 · 비교와 질문 답</text>
  </g>
</svg>
