<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">작성과 검토가 같은 현재 위키를 함께 읽기</title>
<desc id="desc">사람의 목적 아래 작성 역할과 검토 역할이 같은 원자료·개념·비교·현재 계획·결정 이유·결과와 남은 확인을 읽고 수정하는 자작 구성 예다. 역할별 독립 저장소나 실제 유명인 참여를 뜻하지 않는다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="70" font-size="33" fill="#A4A4A1" font-weight="400" text-anchor="start">사람의 목적 · 다음 스터디의 한 쪽 진행안</text><text x="35" y="215" font-size="38" fill="#F6F6F4" font-weight="550" text-anchor="start">작성 역할</text><text x="35" y="315" font-size="38" fill="#F6F6F4" font-weight="400" text-anchor="start">읽기 · 초안</text><text x="35" y="393" font-size="38" fill="#F6F6F4" font-weight="400" text-anchor="start">관계 연결</text><text x="35" y="510" font-size="28" fill="#A4A4A1" font-weight="400" text-anchor="start">각자 작업하며</text><path d="M362 330L450 330" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M437 322L450 330L437 338" fill="none" stroke="#5A5A57" stroke-width="2"/><text x="510" y="185" font-size="44" fill="#F6F6F4" font-weight="550" text-anchor="start">함께 읽는 위키</text><text x="510" y="286" font-size="36" fill="#F6F6F4" font-weight="400" text-anchor="start">원자료 · 개념 · 비교</text><text x="510" y="366" font-size="36" fill="#F6F6F4" font-weight="400" text-anchor="start">현재 계획과 결정의 이유</text><text x="510" y="446" font-size="36" fill="#F6F6F4" font-weight="400" text-anchor="start">결과물과 남은 확인</text><path d="M510 495L1100 495" fill="none" stroke="#69CF82" stroke-width="2"/><text x="510" y="548" font-size="30" fill="#69CF82" font-weight="400" text-anchor="start">같은 근거와 현재 결정</text><path d="M1125 330L1200 330" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M1187 322L1200 330L1187 338" fill="none" stroke="#5A5A57" stroke-width="2"/><text x="1240" y="215" font-size="38" fill="#F6F6F4" font-weight="550" text-anchor="start">검토 역할</text><text x="1240" y="314" font-size="36" fill="#F6F6F4" font-weight="400" text-anchor="start">근거 대조</text><text x="1240" y="389" font-size="36" fill="#F6F6F4" font-weight="400" text-anchor="start">조건 확인</text><text x="1240" y="464" font-size="36" fill="#F6F6F4" font-weight="400" text-anchor="start">수정 제안</text><path d="M1350 502C1350 580 855 593 800 557" fill="none" stroke="#5A5A57" stroke-width="2"/></g>
</svg>
