<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">인제스트가 만드는 요약과 개념과 종합의 관계</title>
<desc id="desc">세 영상 읽기 메모를 반영해 자료 요약·개념과 비교·현재 스터디 계획을 연결한다. 형식 변환만 수행하는 대신 관련 페이지의 의미를 함께 작성하고 갱신한다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="116" font-size="28" fill="#68716B" font-weight="400" text-anchor="start">같은 원자료 세 편</text><rect x="35" y="140" width="335" height="104" rx="8" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><rect x="35" y="140" width="7" height="104" rx="0" fill="#286A5B"/><text x="60" y="181" font-size="34" fill="#252A28" font-weight="600" text-anchor="start">브라이언 대담</text><text x="60" y="222" font-size="26" fill="#68716B" font-weight="400" text-anchor="start">목적 · 개념 연결</text><rect x="35" y="256" width="335" height="104" rx="8" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><rect x="35" y="256" width="7" height="104" rx="0" fill="#BD4B45"/><text x="60" y="297" font-size="34" fill="#252A28" font-weight="600" text-anchor="start">용담 대담</text><text x="60" y="338" font-size="26" fill="#68716B" font-weight="400" text-anchor="start">검색 · 제어</text><rect x="35" y="372" width="335" height="104" rx="8" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><rect x="35" y="372" width="7" height="104" rx="0" fill="#286A5B"/><text x="60" y="413" font-size="34" fill="#252A28" font-weight="600" text-anchor="start">브라이언 세미나</text><text x="60" y="454" font-size="26" fill="#68716B" font-weight="400" text-anchor="start">사람의 이유 · 공유 작업</text><path d="M393 304L484 304" fill="none" stroke="#BD4B45" stroke-width="3"/><path d="M471 296L484 304L471 312" fill="none" stroke="#BD4B45" stroke-width="3"/><text x="394" y="255" font-size="28" fill="#BD4B45" font-weight="600" text-anchor="start">인제스트</text><rect x="520" y="54" width="944" height="480" rx="12" fill="#172238"/><text x="562" y="119" font-size="38" fill="#FCFBF7" font-weight="600" text-anchor="start">자료의 내용과 관계를 함께 씁니다</text><path d="M715 236L1098 234" fill="none" stroke="#4B777D" stroke-width="2"/><path d="M715 236L1025 399" fill="none" stroke="#4B777D" stroke-width="2"/><path d="M1098 234L1025 399" fill="none" stroke="#4B777D" stroke-width="2"/><circle cx="715" cy="236" r="11" fill="#63D7C5"/><text x="715" y="213" font-size="36" fill="#FCFBF7" font-weight="500" text-anchor="middle">자료 요약</text><text x="715" y="284" font-size="28" fill="#63D7C5" font-weight="400" text-anchor="middle">원자료의 입구</text><circle cx="1098" cy="234" r="11" fill="#63D7C5"/><text x="1098" y="211" font-size="36" fill="#FCFBF7" font-weight="500" text-anchor="middle">개념 · 비교</text><text x="1098" y="282" font-size="28" fill="#63D7C5" font-weight="400" text-anchor="middle">기존 설명과 연결</text><circle cx="1025" cy="399" r="11" fill="#63D7C5"/><text x="1025" y="376" font-size="36" fill="#FCFBF7" font-weight="500" text-anchor="middle">현재 계획</text><text x="1025" y="447" font-size="28" fill="#63D7C5" font-weight="400" text-anchor="middle">여러 자료의 종합</text><text x="35" y="581" font-size="31" fill="#68716B" font-weight="400" text-anchor="start">형식 변환 → 요약과 개념 추출 → 관련 페이지 연결·갱신</text></g>
</svg>
