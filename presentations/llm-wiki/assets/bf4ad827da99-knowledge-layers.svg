<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">원자료와 다시 읽는 연결 지식</title>
<desc id="desc">자작 주제 메모 세 개를 보존하고 개념·비교·현재 이해·계획·다음 질문을 연결된 문서로 작성해 다시 읽는 설명용 구조다. 관계의 저장과 갱신을 나타내며 자동 정확도를 보장하지 않는다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="115" font-size="40" fill="#F6F6F4" font-weight="600" text-anchor="start">원자료</text><text x="35" y="169" font-size="28" fill="#A4A4A1" font-weight="400" text-anchor="start">보존할 세 주제 메모</text><text x="35" y="255" font-size="36" fill="#F6F6F4" font-weight="400" text-anchor="start">목적과 맥락</text><path d="M35 283L360 283" fill="none" stroke="#5A5A57" stroke-width="1"/><text x="35" y="360" font-size="36" fill="#F6F6F4" font-weight="400" text-anchor="start">검색과 비교</text><path d="M35 388L360 388" fill="none" stroke="#5A5A57" stroke-width="1"/><text x="35" y="465" font-size="36" fill="#F6F6F4" font-weight="400" text-anchor="start">지식의 활용</text><path d="M35 493L360 493" fill="none" stroke="#5A5A57" stroke-width="1"/><path d="M400 310L505 310" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M492 302L505 310L492 318" fill="none" stroke="#5A5A57" stroke-width="2"/><text x="398" y="270" font-size="28" fill="#A4A4A1" font-weight="400" text-anchor="start">읽고 연결</text><text x="580" y="92" font-size="45" fill="#F6F6F4" font-weight="600" text-anchor="start">연결된 지식</text><text x="1435" y="90" font-size="28" fill="#A4A4A1" font-weight="400" text-anchor="end">wiki/</text><path d="M650 210L970 320" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M1280 205L970 320" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M970 320L760 480" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M970 320L1270 480" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M760 480L1270 480" fill="none" stroke="#5A5A57" stroke-width="2"/><circle cx="650" cy="210" r="11" fill="#69CF82"/><text x="650" y="184" font-size="38" fill="#F6F6F4" font-weight="500" text-anchor="middle">개념</text><circle cx="1280" cy="205" r="11" fill="#69CF82"/><text x="1280" y="179" font-size="38" fill="#F6F6F4" font-weight="500" text-anchor="middle">비교</text><circle cx="970" cy="320" r="11" fill="#F6F6F4"/><text x="970" y="294" font-size="38" fill="#F6F6F4" font-weight="500" text-anchor="middle">현재 이해</text><circle cx="760" cy="480" r="11" fill="#69CF82"/><text x="760" y="454" font-size="38" fill="#F6F6F4" font-weight="500" text-anchor="middle">계획</text><circle cx="1270" cy="480" r="11" fill="#69CF82"/><text x="1270" y="454" font-size="38" fill="#F6F6F4" font-weight="500" text-anchor="middle">다음 질문</text></g>
</svg>
