<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">공용 스터디 노트의 역할을 파일로 나눈다</title>
  <desc id="desc">원자료함은 raw로 보존하고 함께 고친 설명쪽은 wiki로 남긴다. log에는 무엇을 왜 고쳤는지 기록한다. 작업 규칙은 원자료 보존과 근거 위치, 검토 방법을 정하는 전체 작업의 약속이며 다음 변환 단계가 아니다. 다음 질문에는 필요한 설명과 근거를 다시 읽어야 한다.</desc>
  <rect width="1200" height="450" fill="#090909"/>
  <g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <path d="M44 58H334V270H44Z" fill="#13171a" stroke="#4c6879" stroke-width="2"/>
    <path d="M36 50H326V262H36Z" fill="#13171a" stroke="#24a8ff" stroke-width="2"/>
    <text x="60" y="111" font-size="42" font-weight="700" fill="#f5f5f2">원자료함</text>
    <text x="60" y="166" font-size="34" fill="#24a8ff">raw · 보존</text>
    <text x="60" y="222" font-size="32" fill="#b7bab8">읽은 자료를 남긴다</text>
    <text x="372" y="113" font-size="32" fill="#b7bab8">함께 고치기</text>
    <path d="M374 155H562" stroke="#69cf82" stroke-width="4"/>
    <path d="M562 155 543 143V167Z" fill="#69cf82"/>
    <text x="372" y="208" font-size="32" fill="#b7bab8">근거를 대조</text>
    <path d="M614 34H1142L1170 62V183H614Z" fill="#121713" stroke="#69cf82" stroke-width="2"/>
    <path d="M1142 34V62H1170" fill="none" stroke="#69cf82" stroke-width="2"/>
    <text x="640" y="96" font-size="42" font-weight="700" fill="#f5f5f2">함께 고친 설명쪽</text>
    <text x="640" y="148" font-size="34" fill="#69cf82">wiki · 설명·근거·연결</text>
    <path d="M660 184V207H1140" fill="none" stroke="#405247" stroke-width="2"/>
    <text x="640" y="246" font-size="34" fill="#f5f5f2">바꾼 이유 · log</text>
    <text x="640" y="288" font-size="32" fill="#b7bab8">무엇을 왜 고쳤나</text>
    <path d="M36 309V329H1170V309" fill="none" stroke="#a080ff" stroke-width="2"/>
    <text x="36" y="382" font-size="36" font-weight="700" fill="#a080ff">적는 약속 · 작업 규칙</text>
    <text x="580" y="382" font-size="32" fill="#b7bab8">보존 · 근거 위치 · 검토</text>
    <text x="36" y="429" font-size="26" fill="#b7bab8">전체 작업에 적용하는 약속</text>
  </g>
</svg>
