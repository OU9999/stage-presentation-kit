<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc"><title id="title">강의 메모에서 공통 개념을 연결하고 새 분류 기준을 비교와 종합에 추가한다</title><desc id="desc">가상 2주차 회귀와 7주차 회귀트리는 제곱오차를 공유한다. LLM은 공유 개념·모델별 설명·비교를 연결한다. 8주차 분류트리의 Gini 기준을 별도 조건으로 추가하고 공통점과 차이를 설명하는 종합도 저장한다. 실제 논문의 출력은 아니다.</desc><rect width="1400" height="650" fill="#090909"/><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="40" y="65" font-size="28" font-weight="500" fill="#b7bab8" text-anchor="start">가상 강의 메모 · 단원 사이의 개념을 잇는 적용 예</text><rect x="40" y="105" width="410" height="200" rx="18" fill="#131719" stroke="#24a8ff" stroke-width="2"/><text x="68" y="160" font-size="38" font-weight="700" fill="#f5f5f2" text-anchor="start">2주차 · 회귀</text><text x="68" y="225" font-size="30" font-weight="500" fill="#24a8ff" text-anchor="start">관측과 예측의 오차</text><text x="68" y="275" font-size="30" font-weight="500" fill="#24a8ff" text-anchor="start">제곱오차를 줄임</text><rect x="40" y="345" width="410" height="200" rx="18" fill="#131719" stroke="#24a8ff" stroke-width="2"/><text x="68" y="400" font-size="38" font-weight="700" fill="#f5f5f2" text-anchor="start">7주차 · 회귀트리</text><text x="68" y="465" font-size="30" font-weight="500" fill="#24a8ff" text-anchor="start">영역을 나누는 기준</text><text x="68" y="515" font-size="30" font-weight="500" fill="#24a8ff" text-anchor="start">분할 뒤 제곱오차</text><path d="M470 200L640 200" fill="none" stroke="#24a8ff" stroke-width="3"/><path d="M626 191L640 200L626 209" fill="none" stroke="#24a8ff" stroke-width="3"/><path d="M450 445H530V260H645" fill="none" stroke="#24a8ff" stroke-width="3"/><path d="M631 251L645 260L631 269" fill="none" stroke="#24a8ff" stroke-width="3"/><rect x="660" y="105" width="700" height="200" rx="18" fill="#131719" stroke="#69cf82" stroke-width="2"/><text x="690" y="160" font-size="40" font-weight="700" fill="#f5f5f2" text-anchor="start">공유 개념 · 제곱오차</text><text x="690" y="225" font-size="30" font-weight="500" fill="#69cf82" text-anchor="start">구조가 다른 모델의 공통 기준</text><text x="690" y="275" font-size="30" font-weight="500" fill="#b7bab8" text-anchor="start">개념 ↔ 모델별 설명 ↔ 비교</text><rect x="660" y="345" width="700" height="200" rx="18" fill="#131719" stroke="#a080ff" stroke-width="2"/><text x="690" y="400" font-size="38" font-weight="700" fill="#f5f5f2" text-anchor="start">8주차 · 분류트리 추가</text><text x="690" y="465" font-size="30" font-weight="500" fill="#a080ff" text-anchor="start">이 예는 Gini 불순도를 사용</text><text x="690" y="515" font-size="30" font-weight="500" fill="#b7bab8" text-anchor="start">새 기준과 조건을 비교·종합에 연결</text><text x="40" y="600" font-size="32" font-weight="700" fill="#f5f5f2" text-anchor="start">후속 질문: 무엇이 같고 다른가? → 여러 단원을 읽고 얻은 종합도 저장</text><path d="M1010 345V320" fill="none" stroke="#a080ff" stroke-width="3"/><path d="M1001 334L1010 320L1019 334" fill="none" stroke="#a080ff" stroke-width="3"/></g></svg>
