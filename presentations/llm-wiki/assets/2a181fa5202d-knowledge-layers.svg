<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">저장된 자료에서 연결된 지식으로</title>
<desc id="desc">원자료 세 개를 읽고 연결해 개념·비교·현재 이해·계획·다음 질문이 연결된 위키를 작성하고 유지한다. 이름이 있는 다섯 노드로 저장되는 관계를 보여준다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><rect x="38" y="102" width="342" height="390" rx="10" fill="#FCFBF7" stroke="#CBD0C6" stroke-width="2"/><text x="70" y="164" font-size="40" fill="#286A5B" font-weight="700" text-anchor="start">원자료</text><text x="70" y="217" font-size="30" fill="#68716B" font-weight="400" text-anchor="start">영상 · 메모 · 문서</text><rect x="70" y="244" width="265" height="58" rx="4" fill="#F2F0E8"/><rect x="70" y="244" width="5" height="58" rx="0" fill="#286A5B"/><text x="93" y="282" font-size="30" fill="#252A28" font-weight="400" text-anchor="start">읽기 메모 1</text><rect x="70" y="324" width="265" height="58" rx="4" fill="#F2F0E8"/><rect x="70" y="324" width="5" height="58" rx="0" fill="#286A5B"/><text x="93" y="362" font-size="30" fill="#252A28" font-weight="400" text-anchor="start">읽기 메모 2</text><rect x="70" y="404" width="265" height="58" rx="4" fill="#F2F0E8"/><rect x="70" y="404" width="5" height="58" rx="0" fill="#286A5B"/><text x="93" y="442" font-size="30" fill="#252A28" font-weight="400" text-anchor="start">읽기 메모 3</text><path d="M404 295L497 295" fill="none" stroke="#BD4B45" stroke-width="3"/><path d="M484 287L497 295L484 303" fill="none" stroke="#BD4B45" stroke-width="3"/><text x="402" y="255" font-size="28" fill="#BD4B45" font-weight="400" text-anchor="start">읽고 연결</text><rect x="530" y="32" width="930" height="510" rx="14" fill="#172238"/><text x="576" y="100" font-size="45" fill="#FCFBF7" font-weight="700" text-anchor="start">연결된 지식</text><text x="1418" y="97" font-size="28" fill="#63D7C5" font-weight="400" text-anchor="end">wiki/</text><path d="M690 205L1010 290" fill="none" stroke="#436E7A" stroke-width="2"/><path d="M1190 190L1010 290" fill="none" stroke="#436E7A" stroke-width="2"/><path d="M1010 290L790 430" fill="none" stroke="#436E7A" stroke-width="2"/><path d="M1010 290L1230 430" fill="none" stroke="#436E7A" stroke-width="2"/><path d="M790 430L1230 430" fill="none" stroke="#436E7A" stroke-width="2"/><circle cx="690" cy="205" r="12" fill="#63D7C5"/><text x="690" y="179" font-size="36" fill="#FCFBF7" font-weight="500" text-anchor="middle">개념</text><circle cx="1190" cy="190" r="12" fill="#63D7C5"/><text x="1190" y="164" font-size="36" fill="#FCFBF7" font-weight="500" text-anchor="middle">비교</text><circle cx="1010" cy="290" r="12" fill="#FCFBF7"/><text x="1010" y="264" font-size="36" fill="#FCFBF7" font-weight="500" text-anchor="middle">현재 이해</text><circle cx="790" cy="430" r="12" fill="#63D7C5"/><text x="790" y="404" font-size="36" fill="#FCFBF7" font-weight="500" text-anchor="middle">계획</text><circle cx="1230" cy="430" r="12" fill="#63D7C5"/><text x="1230" y="404" font-size="36" fill="#FCFBF7" font-weight="500" text-anchor="middle">다음 질문</text><text x="574" y="508" font-size="31" fill="#63D7C5" font-weight="400" text-anchor="start">관계와 종합이 남고, 새 자료로 다시 고칩니다.</text><text x="45" y="579" font-size="30" fill="#68716B" font-weight="400" text-anchor="start">원자료를 보존하고 · 이해를 연결하고 · 다음 질문에서 다시 읽기</text></g>
