<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">한 자료 요약과 여러 자료를 엮는 개념 페이지</title>
<desc id="desc">context-note.md의 요약은 목적과 맥락이라는 한 메모의 요지를 다시 읽는 입구다. LLM Wiki 개념 페이지는 목적과 맥락·검색과 비교·지식의 활용 세 자작 메모를 엮어 설명하고 비교·현재 계획에 연결하는 종합 문서다. 실제 실행 화면이 아닌 구성 예다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><rect x="35" y="35" width="610" height="520" rx="8" fill="#F6F6F4" stroke="#CDCDC7" stroke-width="2"/><text x="76" y="99" font-size="29" fill="#62625F" font-weight="400" text-anchor="start">자료 요약</text><text x="76" y="162" font-size="41" fill="#1D1D1B" font-weight="600" text-anchor="start">목적과 맥락</text><text x="76" y="248" font-size="34" fill="#1D1D1B" font-weight="400" text-anchor="start">자료를 넣는 목적을 정한다.</text><text x="76" y="313" font-size="34" fill="#1D1D1B" font-weight="400" text-anchor="start">내 이유와 다음 쓰임을 적는다.</text><path d="M76 390L602 390" fill="none" stroke="#CDCDC7" stroke-width="2"/><text x="76" y="446" font-size="29" fill="#62625F" font-weight="400" text-anchor="start">한 메모의 요지를 다시 찾는 입구</text><text x="76" y="510" font-size="27" fill="#62625F" font-weight="400" text-anchor="start">근거  context-note.md</text><path d="M670 295L720 295" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M707 287L720 295L707 303" fill="none" stroke="#5A5A57" stroke-width="2"/><rect x="747" y="35" width="716" height="520" rx="8" fill="#F6F6F4" stroke="#CDCDC7" stroke-width="2"/><text x="788" y="99" font-size="29" fill="#62625F" font-weight="400" text-anchor="start">개념 페이지</text><text x="788" y="162" font-size="43" fill="#1D1D1B" font-weight="600" text-anchor="start">LLM Wiki</text><text x="788" y="248" font-size="34" fill="#1D1D1B" font-weight="400" text-anchor="start">자료 사이의 관계와 현재 이해를</text><text x="788" y="313" font-size="34" fill="#1D1D1B" font-weight="400" text-anchor="start">연결된 문서로 작성하고 갱신한다.</text><path d="M788 390L1420 390" fill="none" stroke="#CDCDC7" stroke-width="2"/><text x="788" y="447" font-size="27" fill="#62625F" font-weight="400" text-anchor="start">근거  목적과 맥락 · 검색과 비교 · 지식의 활용</text><text x="788" y="510" font-size="29" fill="#2D6A43" font-weight="400" text-anchor="start">연결  RAG와 위키 비교 · 현재 계획</text></g>
</svg>
