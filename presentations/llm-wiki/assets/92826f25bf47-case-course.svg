<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title desc">
<title id="title">공유하는 개념과 새로 비교할 기준을 구분한다</title>
<desc id="desc">가상 강의 메모의 구성 예다. 2주차 회귀와 7주차 회귀트리는 제곱오차를 공유한다. 옆의 새 8주차 분류트리 예는 Gini 불순도를 사용한다. 같은 기준으로 합치지 않고 개념·비교·종합에 새로운 조건으로 연결한다.</desc>
<rect width="1500" height="540" fill="#080808"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" letter-spacing="-.6">
<text x="40" y="62" font-size="30" fill="#a5a5a2" font-weight="400" text-anchor="start">이미 읽은 두 단원</text>
<text x="40" y="151" font-size="28" fill="#24a8ff" font-weight="400" text-anchor="start">2주차</text>
<text x="40" y="218" font-size="58" fill="#f6f6f4" font-weight="400" text-anchor="start">회귀</text>
<text x="40" y="331" font-size="28" fill="#24a8ff" font-weight="400" text-anchor="start">7주차</text>
<text x="40" y="398" font-size="58" fill="#f6f6f4" font-weight="400" text-anchor="start">회귀트리</text>
<path d="M334 202H490V288H585" fill="none" stroke="#474745" stroke-width="2"/>
<path d="M334 382H490V288" fill="none" stroke="#474745" stroke-width="2"/>
<circle cx="490" cy="288" r="5" fill="#69cf82"/>
<text x="637" y="241" font-size="30" fill="#69cf82" font-weight="400" text-anchor="start">공유하는 기준</text>
<text x="637" y="319" font-size="66" fill="#f6f6f4" font-weight="400" text-anchor="start">제곱오차</text>
<path d="M1045 105L1045 418" fill="none" stroke="#474745" stroke-width="2"/>
<text x="1110" y="151" font-size="30" fill="#ff9d60" font-weight="400" text-anchor="start">새 8주차</text>
<text x="1110" y="218" font-size="48" fill="#f6f6f4" font-weight="400" text-anchor="start">분류트리</text>
<text x="1110" y="302" font-size="42" fill="#ff9d60" font-weight="400" text-anchor="start">Gini 불순도</text>
<text x="1110" y="357" font-size="28" fill="#a5a5a2" font-weight="400" text-anchor="start">이 예에서 다른 기준</text>
<path d="M40 458L1460 458" fill="none" stroke="#474745" stroke-width="2"/>
<text x="40" y="512" font-size="34" fill="#f6f6f4" font-weight="400" text-anchor="start">새 자료는 비교표와 종합에 조건을 더합니다.</text>
</g>
</svg>
