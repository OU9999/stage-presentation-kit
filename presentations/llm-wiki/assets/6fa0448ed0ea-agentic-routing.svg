<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">검색할 곳과 반복을 판단하는 에이전트</title>
<desc id="desc">에이전트가 질문을 보고 원자료·위키 페이지·웹 또는 다른 도구 중 필요한 근거를 찾을 곳과 방식을 고른다. 근거가 부족하면 다시 찾을 수 있다. 위키 자체가 검색 없는 방식이라는 뜻은 아니다.</desc>
<rect width="1500" height="600" fill="#F2F0E8"/>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="40" y="94" font-size="48" fill="#252A28" font-weight="600" text-anchor="start">어디를, 어떻게 찾아볼까?</text><text x="40" y="209" font-size="36" fill="#252A28" font-weight="400" text-anchor="start">사용자의 질문</text><text x="40" y="277" font-size="36" fill="#252A28" font-weight="400" text-anchor="start">필요한 근거는 무엇일까?</text><path d="M426 290L585 290" fill="none" stroke="#68716B" stroke-width="2"/><path d="M572 282L585 290L572 298" fill="none" stroke="#68716B" stroke-width="2"/><circle cx="736" cy="290" r="105" fill="#172238"/><text x="736" y="280" font-size="36" fill="#FCFBF7" font-weight="600" text-anchor="middle">에이전트</text><text x="736" y="332" font-size="29" fill="#63D7C5" font-weight="400" text-anchor="middle">검색 판단</text><path d="M841 290C1000 290 990 125 1110 125" fill="none" stroke="#68716B" stroke-width="2"/><circle cx="1120" cy="125" r="9" fill="#CBD0C6"/><text x="1160" y="137" font-size="36" fill="#252A28" font-weight="400" text-anchor="start">원자료</text><path d="M841 290C1000 290 990 290 1110 290" fill="none" stroke="#286A5B" stroke-width="3"/><circle cx="1120" cy="290" r="9" fill="#63D7C5"/><text x="1160" y="302" font-size="36" fill="#252A28" font-weight="600" text-anchor="start">위키 페이지</text><path d="M841 290C1000 290 990 455 1110 455" fill="none" stroke="#68716B" stroke-width="2"/><circle cx="1120" cy="455" r="9" fill="#CBD0C6"/><text x="1160" y="467" font-size="36" fill="#252A28" font-weight="400" text-anchor="start">웹 · 다른 도구</text><path d="M735 398C735 535 1067 554 1118 477" fill="none" stroke="#BD4B45" stroke-width="2"/><text x="800" y="546" font-size="30" fill="#BD4B45" font-weight="400" text-anchor="start">부족하면 다시 찾기</text></g>
</svg>
