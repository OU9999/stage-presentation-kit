<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title desc">
<title id="title">새 결정을 남기고 이전 결정도 보존한다</title>
<desc id="desc">고정 예제의 초기 D1은 모든 답을 현행에 모으는 선택이다. D2는 문장·근거 위치·범위를 대조한 뒤 현행 답을 갱신한다. 이전 결정의 맥락은 대체됨으로 보존하고 새 결정에는 검토 시간도 기록한다.</desc>
<rect width="1500" height="540" fill="#080808"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" letter-spacing="-.6">
<text x="40" y="63" font-size="30" fill="#a5a5a2" font-weight="400" text-anchor="start">D1 · 초기 선택</text>
<text x="838" y="63" font-size="30" fill="#69cf82" font-weight="400" text-anchor="start">D2 · 이 예제의 선택</text>
<path d="M47 111L1456 111" fill="none" stroke="#474745" stroke-width="2"/>
<circle cx="50" cy="111" r="6" fill="#a5a5a2"/>
<circle cx="850" cy="111" r="7" fill="#69cf82"/>
<polyline points="808,103 820,111 808,119" fill="none" stroke="#a5a5a2" stroke-width="2.5"/>
<text x="470" y="92" font-size="28" fill="#a5a5a2" font-weight="400" text-anchor="start">이유를 남겨 대체</text>
<text x="40" y="210" font-size="54" fill="#f6f6f4" font-weight="400" text-anchor="start">모든 답을</text>
<text x="40" y="283" font-size="54" fill="#f6f6f4" font-weight="400" text-anchor="start">현행에 모은다.</text>
<text x="40" y="355" font-size="32" fill="#a5a5a2" font-weight="400" text-anchor="start">채팅에서 찾기 어려워</text>
<text x="40" y="401" font-size="32" fill="#a5a5a2" font-weight="400" text-anchor="start">한곳에 모으려 했다.</text>
<text x="40" y="460" font-size="30" fill="#ff9d60" font-weight="400" text-anchor="start">대체됨 · 맥락 보존</text>
<text x="838" y="210" font-size="54" fill="#f6f6f4" font-weight="400" text-anchor="start">검토한 답을</text>
<text x="838" y="283" font-size="54" fill="#f6f6f4" font-weight="400" text-anchor="start">현행에 연결한다.</text>
<text x="838" y="355" font-size="32" fill="#a5a5a2" font-weight="400" text-anchor="start">문장 · 근거 위치 · 범위 대조</text>
<text x="838" y="401" font-size="32" fill="#ff9d60" font-weight="400" text-anchor="start">검토 시간이 든다는 부담도 기록</text>
<text x="838" y="486" font-size="28" fill="#a5a5a2" font-weight="400" text-anchor="start">이전 결정의 맥락과 결과는 지우지 않습니다.</text>
</g>
</svg>
