<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc" data-material-kind="explanatory-reconstruction">
<title id="title">이번 질문의 근거를 검색해 현재 답에 사용하기</title>
<desc id="desc">같은 세 자작 메모와 같은 질문. 목적과 맥락·검색과 비교·지식의 활용에서 필요한 세 부분을 찾아 이번 입력 문맥으로 읽고 스터디 계획 답을 정리하는 설명용 예. 실제 실행이나 성능 비교가 아니다.</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" letter-spacing="-.4">
<text x="25" y="45" font-size="44" fill="#C5C5C0" font-weight="400" text-anchor="start" data-copy-role="essential">공통 질문 · 다음 AI 스터디에서 LLM Wiki를 어떻게 시도할까?</text>
<text x="25" y="130" font-size="44" fill="#C5C5C0" font-weight="400" text-anchor="start" data-copy-role="essential">같은 원자료 세 메모</text>
<text x="25" y="220" font-size="48" fill="#F6F6F4" font-weight="550" text-anchor="start" data-copy-role="essential">목적과 맥락</text>
<text x="25" y="275" font-size="44" fill="#C5C5C0" font-weight="400" text-anchor="start" data-copy-role="essential">목적 · 이유 · 결과</text>
<text x="25" y="365" font-size="48" fill="#F6F6F4" font-weight="550" text-anchor="start" data-copy-role="essential">검색과 비교</text>
<text x="25" y="420" font-size="44" fill="#C5C5C0" font-weight="400" text-anchor="start" data-copy-role="essential">근거 검색 · 차이</text>
<text x="25" y="510" font-size="48" fill="#F6F6F4" font-weight="550" text-anchor="start" data-copy-role="essential">지식의 활용</text>
<text x="25" y="565" font-size="44" fill="#C5C5C0" font-weight="400" text-anchor="start" data-copy-role="essential">종합 · 공유 · 검토</text>
<path d="M370 345H435M420 334L435 345L420 356" fill="none" stroke="#999995" stroke-width="3"/>
<rect x="465" y="160" width="550" height="420" rx="8" fill="#151515" stroke="#999995" stroke-width="3"/>
<text x="495" y="225" font-size="48" fill="#24A8FF" font-weight="550" text-anchor="start" data-copy-role="essential">이번에 찾은 근거</text>
<text x="495" y="315" font-size="44" fill="#F6F6F4" font-weight="400" text-anchor="start" data-copy-role="essential">목적과 맥락에 관한 부분</text>
<text x="495" y="395" font-size="44" fill="#F6F6F4" font-weight="400" text-anchor="start" data-copy-role="essential">검색과 비교에 관한 부분</text>
<text x="495" y="475" font-size="44" fill="#F6F6F4" font-weight="400" text-anchor="start" data-copy-role="essential">지식 활용과 검토의 부분</text>
<text x="495" y="550" font-size="44" fill="#C5C5C0" font-weight="400" text-anchor="start" data-copy-role="essential">이번 답의 입력 문맥</text>
<path d="M1030 345H1085M1070 334L1085 345L1070 356" fill="none" stroke="#999995" stroke-width="3"/>
<text x="1110" y="225" font-size="44" fill="#F6F6F4" font-weight="550" text-anchor="start" data-copy-role="essential">현재 질문의 답</text>
<text x="1110" y="340" font-size="44" fill="#F6F6F4" font-weight="400" text-anchor="start" data-copy-role="essential">세 메모를 엮어</text>
<text x="1110" y="410" font-size="44" fill="#F6F6F4" font-weight="400" text-anchor="start" data-copy-role="essential">스터디 계획을</text>
<text x="1110" y="480" font-size="44" fill="#F6F6F4" font-weight="400" text-anchor="start" data-copy-role="essential">정리합니다.</text>
</g>
</svg>
