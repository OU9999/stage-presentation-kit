<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">15분 LLM Wiki 활동 진행안의 실제 발췌</title>
<desc id="desc">등록 자료 materials/session-plan.md의 제목·목표·두 선택 메모·네 시간 구간을 발췌했다. 목적과 맥락·지식의 활용을 선택하고 목적2분·읽기4분·관계근거5분·후속질문4분으로 배분한다. 자작 주제 메모 팩의 활동안이며 실제 운영·학습효과·설치나 모델 생성 시간 측정이 아니다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><rect x="35" y="20" width="1430" height="533" rx="8" fill="#F6F6F4" stroke="#CDCDC7" stroke-width="2"/><text x="75" y="86" font-size="44" fill="#1D1D1B" font-weight="600" text-anchor="start">입문자와 함께 읽는 15분 LLM Wiki 활동</text><text x="75" y="149" font-size="34" fill="#1D1D1B" font-weight="400" text-anchor="start">목표: 한 관계의 근거를 찾아 읽고, 다음 질문과 확인할 점을 남긴다.</text><text x="75" y="198" font-size="28" fill="#62625F" font-weight="400" text-anchor="start">자작 주제 메모 팩 · 목적과 맥락 + 지식의 활용</text><path d="M75 224L1423 224" fill="none" stroke="#CDCDC7" stroke-width="2"/><text x="75" y="282" font-size="36" fill="#1D1D1B" font-weight="550" text-anchor="start">0~2분</text><text x="345" y="282" font-size="35" fill="#1D1D1B" font-weight="400" text-anchor="start">왜 이 자료를 다시 쓰려는지 질문 정하기</text><text x="75" y="361" font-size="36" fill="#1D1D1B" font-weight="550" text-anchor="start">2~6분</text><text x="345" y="361" font-size="35" fill="#1D1D1B" font-weight="400" text-anchor="start">선택한 두 읽기 메모 확인하기</text><text x="75" y="440" font-size="36" fill="#1D1D1B" font-weight="550" text-anchor="start">6~11분</text><text x="345" y="440" font-size="35" fill="#1D1D1B" font-weight="400" text-anchor="start">원자료→개념→비교의 연결 한 개를 따라 읽기</text><text x="75" y="519" font-size="36" fill="#1D1D1B" font-weight="550" text-anchor="start">11~15분</text><text x="345" y="519" font-size="35" fill="#1D1D1B" font-weight="400" text-anchor="start">후속 질문에 근거를 연결하고 남은 확인 적기</text><text x="35" y="588" font-size="27" fill="#A4A4A1" font-weight="400" text-anchor="start">준비된 팩을 함께 읽는 활동 배분안 · 설치나 모델 생성 완료 시간의 실측이 아닙니다.</text></g>
</svg>
