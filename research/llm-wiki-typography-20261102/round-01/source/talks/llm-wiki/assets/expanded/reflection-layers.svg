<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">일별 기록을 다시 읽어 더 긴 기간의 질문으로</title>
<desc id="desc">일별 기록을 주간에 다시 읽어 반복과 다음 계획을 종합하고 월·분기·연간의 더 긴 맥락을 묻는 자작 설명 배치다. 관찰 사실과 해석을 구별하며 회고의 정확성이나 효과를 자동으로 보장하지 않는다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><rect x="35" y="290" width="330" height="235" rx="8" fill="#F6F6F4" stroke="#CDCDC7" stroke-width="2"/><text x="72" y="361" font-size="35" fill="#1D1D1B" font-weight="550" text-anchor="start">일별 기록</text><text x="72" y="446" font-size="38" fill="#1D1D1B" font-weight="400" text-anchor="start">무엇을 했나?</text><path d="M392 395L470 332" fill="none" stroke="#5A5A57" stroke-width="2"/><circle cx="470" cy="332" r="4" fill="#5A5A57"/><text x="520" y="214" font-size="37" fill="#69CF82" font-weight="550" text-anchor="start">주간의 종합</text><text x="520" y="318" font-size="39" fill="#F6F6F4" font-weight="400" text-anchor="start">무엇이 반복됐나?</text><text x="520" y="401" font-size="39" fill="#F6F6F4" font-weight="400" text-anchor="start">다음 주는 어떻게?</text><path d="M965 285L1042 219" fill="none" stroke="#5A5A57" stroke-width="2"/><circle cx="1042" cy="219" r="4" fill="#5A5A57"/><text x="1080" y="137" font-size="34" fill="#A4A4A1" font-weight="400" text-anchor="start">월 · 분기 · 연간</text><text x="1080" y="261" font-size="44" fill="#F6F6F4" font-weight="550" text-anchor="start">어떤 맥락이</text><text x="1080" y="341" font-size="44" fill="#F6F6F4" font-weight="550" text-anchor="start">바뀌었나?</text><text x="1080" y="463" font-size="30" fill="#A4A4A1" font-weight="400" text-anchor="start">더 긴 질문과 서사</text><text x="35" y="583" font-size="29" fill="#A4A4A1" font-weight="400" text-anchor="start">관찰한 사실과 나의 해석을 구별하며, 기록을 다시 읽어 종합합니다.</text></g>
</svg>
