<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">정리 기준과 문서 연결을 따라 읽는 보기</title>
<desc id="desc">왼쪽 rules.md는 원자료와 해석·관계의 이유·남은 질문을 구별하는 기준을 적는다. 오른쪽 그래프는 세 자작 주제 메모·개념·검색·비교·계획·질문의 문서 연결을 탐색하는 보기다. 그래프 자체가 정확성이나 완전한 지식 구조를 증명하지 않는다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="106" font-size="40" fill="#F6F6F4" font-weight="550" text-anchor="start">정리의 기준</text><text x="35" y="225" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">원문과 우리 해석을 구별한다.</text><text x="35" y="335" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">관계를 연결한 이유를 적는다.</text><text x="35" y="445" font-size="34" fill="#F6F6F4" font-weight="400" text-anchor="start">모르는 내용은 질문으로 남긴다.</text><text x="35" y="550" font-size="28" fill="#A4A4A1" font-weight="400" text-anchor="start">rules.md</text><text x="780" y="95" font-size="36" fill="#F6F6F4" font-weight="550" text-anchor="start">연결을 따라 읽는 보기</text><path d="M845 205L1050 325" fill="none" stroke="#5A5A57" stroke-width="1.7"/><path d="M1330 205L1050 325" fill="none" stroke="#5A5A57" stroke-width="1.7"/><path d="M1330 205L1350 395" fill="none" stroke="#5A5A57" stroke-width="1.7"/><path d="M1050 325L830 475" fill="none" stroke="#5A5A57" stroke-width="1.7"/><path d="M1050 325L1175 475" fill="none" stroke="#5A5A57" stroke-width="1.7"/><path d="M1350 395L830 475" fill="none" stroke="#5A5A57" stroke-width="1.7"/><path d="M830 475L1175 475" fill="none" stroke="#5A5A57" stroke-width="1.7"/><path d="M1175 475L1020 565" fill="none" stroke="#5A5A57" stroke-width="1.7"/><path d="M1080 205L1050 325" fill="none" stroke="#5A5A57" stroke-width="1.7"/><path d="M1080 205L1175 475" fill="none" stroke="#5A5A57" stroke-width="1.7"/><circle cx="845" cy="205" r="8" fill="#69CF82"/><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="845" y="183" font-size="31" fill="#F6F6F4" font-weight="500" text-anchor="middle">목적과 맥락</text><circle cx="1330" cy="205" r="8" fill="#69CF82"/><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="1330" y="183" font-size="31" fill="#F6F6F4" font-weight="500" text-anchor="middle">검색과 비교</text><circle cx="1050" cy="325" r="8" fill="#69CF82"/><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="1050" y="303" font-size="31" fill="#F6F6F4" font-weight="500" text-anchor="middle">LLM Wiki</text><circle cx="1350" cy="395" r="8" fill="#69CF82"/><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="1350" y="373" font-size="31" fill="#F6F6F4" font-weight="500" text-anchor="middle">검색</text><circle cx="830" cy="475" r="8" fill="#69CF82"/><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="830" y="453" font-size="31" fill="#F6F6F4" font-weight="500" text-anchor="middle">비교</text><circle cx="1175" cy="475" r="8" fill="#69CF82"/><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="1175" y="453" font-size="31" fill="#F6F6F4" font-weight="500" text-anchor="middle">계획</text><circle cx="1020" cy="565" r="8" fill="#69CF82"/><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="1020" y="543" font-size="31" fill="#F6F6F4" font-weight="500" text-anchor="middle">질문</text><circle cx="1080" cy="205" r="8" fill="#69CF82"/><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="1080" y="183" font-size="31" fill="#F6F6F4" font-weight="500" text-anchor="middle">지식의 활용</text></g>
</svg>
