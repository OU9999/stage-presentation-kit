<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" style="background:#080808" role="img" aria-labelledby="title desc">
<title id="title">질문에 따라 검색할 곳과 반복을 판단</title>
<desc id="desc">에이전트가 질문에 필요한 원자료·위키 페이지·웹 또는 다른 도구의 근거를 찾고 부족하면 다시 탐색한다. 위키 문서도 검색 대상이 될 수 있으며 선택과 반복은 색·이름·위치로 함께 구별한다.</desc>
<g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" letter-spacing="-.4"><text x="35" y="125" font-size="34" fill="#F6F6F4" font-weight="550" text-anchor="start">사용자의 질문</text><text x="35" y="215" font-size="42" fill="#F6F6F4" font-weight="400" text-anchor="start">필요한 근거는</text><text x="35" y="285" font-size="42" fill="#F6F6F4" font-weight="400" text-anchor="start">무엇일까?</text><path d="M382 300L557 300" fill="none" stroke="#5A5A57" stroke-width="2"/><path d="M544 292L557 300L544 308" fill="none" stroke="#5A5A57" stroke-width="2"/><circle cx="700" cy="300" r="108" fill="#151515" stroke="#5A5A57" stroke-width="2"/><text x="700" y="292" font-size="39" fill="#F6F6F4" font-weight="550" text-anchor="middle">에이전트</text><text x="700" y="349" font-size="29" fill="#A4A4A1" font-weight="400" text-anchor="middle">검색 판단</text><path d="M808 300C965 300 980 130 1100 130" fill="none" stroke="#5A5A57" stroke-width="2"/><circle cx="1110" cy="130" r="9" fill="#A4A4A1"/><text x="1148" y="142" font-size="38" fill="#F6F6F4" font-weight="400" text-anchor="start">원자료</text><path d="M808 300C965 300 980 300 1100 300" fill="none" stroke="#24A8FF" stroke-width="3"/><circle cx="1110" cy="300" r="9" fill="#24A8FF"/><text x="1148" y="312" font-size="38" fill="#F6F6F4" font-weight="550" text-anchor="start">위키 페이지</text><path d="M808 300C965 300 980 470 1100 470" fill="none" stroke="#5A5A57" stroke-width="2"/><circle cx="1110" cy="470" r="9" fill="#A4A4A1"/><text x="1148" y="482" font-size="38" fill="#F6F6F4" font-weight="400" text-anchor="start">웹 · 다른 도구</text><path d="M700 409C700 564 1060 571 1110 494" fill="none" stroke="#FF7A3D" stroke-width="2"/><text paint-order="stroke" stroke="#080808" stroke-width="8" stroke-linejoin="round" x="800" y="562" font-size="29" fill="#FF7A3D" font-weight="400" text-anchor="start">부족하면 다시 찾기</text></g>
</svg>
