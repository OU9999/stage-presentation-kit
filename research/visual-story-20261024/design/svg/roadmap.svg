<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="roadmap-title roadmap-desc" font-family="-apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif"><title id="roadmap-title">프로젝트 주차별 실행 계획</title><desc id="roadmap-desc">기준 관찰·인터뷰: W1부터 W4까지, 시작과 끝을 포함한 4주. 세 개선안 구현·점진 적용: W5부터 W8까지, 시작과 끝을 포함한 4주. 후반 코호트 관찰: W9부터 W12까지, 시작과 끝을 포함한 4주. W12 코호트의 7일 관찰 완료를 위해 집계 확정은 W13 종료에 수행합니다.</desc><rect width="1280" height="640" fill="#080808"/><text x="40" y="57" font-size="28" fill="#a4a4a1" text-anchor="start" font-weight="400">가상 실행 계획</text><text x="511.66666666666663" y="86" font-size="28" fill="#69cf82" text-anchor="middle" font-weight="400">기준</text><line x1="374" y1="102" x2="649.3333333333333" y2="102" stroke="#69cf82" stroke-width="3"/><text x="794.9999999999999" y="86" font-size="28" fill="#24a8ff" text-anchor="middle" font-weight="400">변경 적용</text><line x1="657.3333333333333" y1="102" x2="932.6666666666665" y2="102" stroke="#24a8ff" stroke-width="3"/><text x="1078.3333333333333" y="86" font-size="28" fill="#a080ff" text-anchor="middle" font-weight="400">후반 관찰</text><line x1="940.6666666666666" y1="102" x2="1216" y2="102" stroke="#a080ff" stroke-width="3"/><text x="405.4166666666667" y="141" font-size="26" fill="#a4a4a1" text-anchor="middle" font-weight="400">W1</text><line x1="370" y1="158" x2="370" y2="518" stroke="#353535" stroke-width="2"/><text x="476.25" y="141" font-size="26" fill="#a4a4a1" text-anchor="middle" font-weight="400">W2</text><line x1="440.8333333333333" y1="158" x2="440.8333333333333" y2="518" stroke="#353535" stroke-width="2"/><text x="547.0833333333333" y="141" font-size="26" fill="#a4a4a1" text-anchor="middle" font-weight="400">W3</text><line x1="511.66666666666663" y1="158" x2="511.66666666666663" y2="518" stroke="#353535" stroke-width="2"/><text x="617.9166666666666" y="141" font-size="26" fill="#a4a4a1" text-anchor="middle" fon