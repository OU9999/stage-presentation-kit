<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="journey-title journey-desc" font-family="-apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif"><title id="journey-title">여정 단계와 기능 제안의 대응</title><desc id="journey-desc">시작 템플릿은 프로젝트 시작 단계에 대응하며 참고 마찰은 빈 화면에서 시작하기 어려움이다. 다음 행동 안내은 초안 완성 단계에 대응하며 참고 마찰은 다음 행동이 불명확함이다. 공유 미리보기은 첫 프로젝트 공유 단계에 대응하며 참고 마찰은 공유 전 확신이 부족함이다. 실제 사용자 이동량이나 인과 효과를 뜻하지 않는다.</desc><rect width="1280" height="640" fill="#080808"/><text x="40" y="70" font-size="28" fill="#a4a4a1" text-anchor="start" font-weight="400">경험 단계</text><rect x="40" y="135" width="240" height="110" rx="8" fill="#171717" stroke="#353535" stroke-width="2"/><text x="160" y="201" font-size="30" fill="#f6f6f4" text-anchor="middle" font-weight="400">신규 가입</text><line x1="288" y1="190" x2="340" y2="190" stroke="#a4a4a1" stroke-width="2"/><path d="M331 182 L340 190 L331 198" fill="none" stroke="#a4a4a1" stroke-width="2"/><rect x="350" y="135" width="240" height="110" rx="8" fill="#171717" stroke="#353535" stroke-width="2"/><text x="470" y="201" font-size="30" fill="#f6f6f4" text-anchor="middle" font-weight="400">프로젝트 시작</text><line x1="598" y1="190" x2="650" y2="190" stroke="#a4a4a1" stroke-width="2"/><path d="M641 182 L650 190 L641 198" fill="none" stroke="#a4a4a1" stroke-width="2"/><rect x="660" y="135" width="240" height="110" rx="8" fill="#171717" stroke="#353535" stroke-width="2"/><text x="780" y="201" font-size="30" fill="#f6f6f4" text-anchor="middle" font-weight="400">초안 완성</text><line x1="908" y1="190" x2="960" y2="190" stroke="#a4a4a1" stroke-width="2"/><path d="M951 182 L960 190 L951 198" fill="none" stroke="#a4a4a1" stroke-width="2"/><rect x="970" y="135" width="240" height="110" rx="8" fill="#171717" stroke="#353535" stroke-width="2"/><text x="1090" y="181" font-size="30" fill="#f6f6f4" text-anchor="middle" font-weight="400">첫 프로젝트</text><text x="1090" y="218" font-size="30" fill="#f6f6f4" text-anchor="middle" font-weight="400">공유</text><text x="40" y="350" font-size="28" fill="#a4a4a1" text-anchor="start" font-weight="400">기능 제안</text><line x1="470" y1="245" x2="470" y2="310" stroke="#69cf82" stroke-width="2"/><circle cx="470" cy="310" r="5" fill="#69cf82"/><rect x="350" y="326" width="240" height="86" rx="8" fill="#080808" stroke="#69cf82" stroke-width="2"/><text x="470" y="378" font-size="30" fill="#69cf82" text-anchor="middle" font-weight="400">시작 템플릿</text><text x="470" y="462" font-size="26" fill="#a4a4a1" text-anchor="middle" font-weight="400">빈 화면에서</text><text x="470" y="496" font-size="26" fill="#a4a4a1" text-anchor="middle" font-weight="400">시작하기 어려움</text><line x1="780" y1="245" x2="780" y2="310" stroke="#24a8ff" stroke-width="2"/><circle cx="780" cy="310" r="5" fill="#24a8ff"/><rect x="660" y="326" width="240" height="86" rx="8" fill="#080808" stroke="#24a8ff" stroke-width="2"/><text x="780" y="378" font-size="30" fill="#24a8ff" text-anchor="middle" font-weight="400">다음 행동 안내</text><text x="780" y="462" font-size="26" fill="#a4a4a1" text-anchor="middle" font-weight="400">다음 행동이</text><text x="780" y="496" font-size="26" fill="#a4a4a1" text-anchor="middle" font-weight="400">불명확함</text><line x1="1090" y1="245" x2="1090" y2="310" stroke="#a080ff" stroke-width="2"/><circle cx="1090" cy="310" r="5" fill="#a080ff"/><rect x="970" y="326" width="240" height="86" rx="8" fill="#080808" stroke="#a080ff" stroke-width="2"/><text x="1090" y="378" font-size="30" fill="#a080ff" text-anchor="middle" font-weight="400">공유 미리보기</text><text x="1090" y="462" font-size="26" fill="#a4a4a1" text-anchor="middle" font-weight="400">공유 전 확신이</text><text x="1090" y="496" font-size="26" fill="#a4a4a1" text-anchor="middle" font-weight="400">부족함</text><text x="40" y="578" font-size="26" fill="#a4a4a1" text-anchor="start" font-weight="400">제안 기능과 여정 단계의 대응 관계. 실제 사용자 이동량이나 검증된 인과 관계가</text><text x="40" y="612" font-size="26" fill="#a4a4a1" text-anchor="start" font-weight="400">아닙니다.</text></svg>
