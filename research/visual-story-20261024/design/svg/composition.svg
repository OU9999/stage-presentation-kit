<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="visual-composition-title visual-composition-desc" font-family="-apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif"><title id="visual-composition-title">인터뷰 대표 마찰의 구성비</title><desc id="visual-composition-desc">W2–W4 가상 인터뷰 48명. 빈 화면에서 시작하기 어려움: 18명, 37.5%. 다음 행동이 불명확함: 12명, 25%. 공유 전 확신이 부족함: 10명, 20.8%. 기타: 8명, 16.7%. 응답자별 대표 마찰 하나를 분류한 비중이며 전체 사용자 발생률이 아니다.</desc><rect width="1280" height="640" fill="#080808"/><text x="40" y="55" font-size="32" fill="#f6f6f4" text-anchor="start" font-weight="400">응답 48명 안의 분포</text><text x="1240" y="55" font-size="26" fill="#a4a4a1" text-anchor="end" font-weight="400">W2–W4 · 대표 원인 하나</text><rect x="40" y="110" width="450" height="90" fill="#ff7a3d" /><text x="265" y="169" font-size="38" fill="#080808" text-anchor="middle" font-weight="500">37.5%</text><rect x="40" y="265" width="20" height="20" fill="#ff7a3d" /><text x="76" y="286" font-size="30" fill="#f6f6f4" text-anchor="start" font-weight="400">빈 화면에서 시작하기 어려움</text><text x="76" y="329" font-size="30" fill="#ff7a3d" text-anchor="start" font-weight="400">18명 · 37.5%</text><rect x="490" y="110" width="300" height="90" fill="#a080ff" /><text x="640" y="169" font-size="38" fill="#080808" text-anchor="middle" font-weight="500">25%</text><rect x="665" y="265" width="20" height="20" fill="#a080ff" /><text x="701" y="286" font-size="30" fill="#f6f6f4" text-anchor="start" font-weight="400">다음 행동이 불명확함</text><text x="701" y="329" font-size="30" fill="#a4a4a1" text-anchor="start" font-weight="400">12명 · 25%</text><rect x="790" y="110" width="250" height="90" fill="#24a8ff" /><text x="915" y="169" font-size="38" fill="#080808" text-anchor="middle" font-weight="500">20.8%</text><rect x="40" y="400" width="20" height="20" fill="#24a8ff" /><text x="76" y="421" font-size="30" fill="#f6f6f4" text-anchor="start" font-weight="400">공유 전 확신이 부족함</text><text x="76" y="464" font-size="30" fill="#a4a4a1" text-anchor="start" font-weight="400">10명 · 20.8%</text><rect x="1040" y="110" width="200" height="90" fill="#656563" /><text x="1140" y="169" font-size="38" fill="#f6f6f4" text-anchor="middle" font-weight="500">16.7%</text><rect x="665" y="400" width="20" height="20" fill="#656563" /><text x="701" y="421" font-size="30" fill="#f6f6f4" text-anchor="start" font-weight="400">기타</text><text x="701" y="464" font-size="30" fill="#a4a4a1" text-anchor="start" font-weight="400">8명 · 16.7%</text><text x="40" y="588" font-size="26" fill="#a4a4a1" text-anchor="start" font-weight="400">선정한 미활성 사용자 인터뷰 · 전체 신규 사용자 비율이 아닙니다.</text><text x="40" y="630" font-size="26" fill="#a4a4a1" text-anchor="start" font-weight="400">가상 정성 조사 분류</text></svg>
