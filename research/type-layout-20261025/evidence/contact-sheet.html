<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>실제 글 배치 화면</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080808;height:100%;overflow:hidden}main{display:grid;grid-template-columns:repeat(2,1fr);height:100%;gap:2px}img{width:100%;height:100%;object-fit:contain;display:block;min-width:0;min-height:0}</style></head><body><main aria-label="실제 발표 화면"></main><script>const all=new URLSearchParams(location.search).has('all'),main=document.querySelector('main'),numbers=all?Array.from({length:12},(_,i)=>i+1):[3,4,7,8];if(all)main.style.gridTemplateColumns='repeat(4,1fr)';numbers.forEach(n=>{const img=document.createElement('img');img.src='slides/'+String(n).padStart(2,'0')+'.png';img.alt=n+'번 실제 발표 화면';main.append(img);});</script></body></html>
