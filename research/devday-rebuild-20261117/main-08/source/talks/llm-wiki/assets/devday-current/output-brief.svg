<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" data-material-kind="editorial-adaptation" data-source="materials/session-plan.md#준비와-선택-이유" role="img" aria-labelledby="title desc">
  <title id="title">모임 준비 안내와 활동 기록 예</title>
  <desc id="desc">발표팀의 15분 활동안을 준비 안내와 기록 양식으로 편집했다. 왼쪽에는 시작하기 전 할 일, 오른쪽에는 찾을 근거와 남길 후속 질문을 적은 예가 있다.</desc>
  <rect width="1000" height="640" fill="#d7e8ed"/>
  <g font-family="-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#193b4d">
    <text x="63" y="100" font-size="55" font-weight="485" letter-spacing="-1.2" fill="#406776">모임 준비 안내</text>
    <text x="66" y="145" font-size="31" font-weight="475" fill="#506e7b">준비된 문서로 시작하는 15분 활동</text>
    <path d="M65 178H935" stroke="#94b1bd" stroke-width="2"/>
    <g data-observe-id="preparation-checklist">
      <g fill="none" stroke="#578597" stroke-width="3.5">
        <rect x="66" y="239" width="36" height="36" rx="4"/>
        <rect x="66" y="331" width="36" height="36" rx="4"/>
        <rect x="66" y="423" width="36" height="36" rx="4"/>
      </g>
      <g font-size="41" font-weight="590" letter-spacing="-.7">
        <text x="123" y="270">목적을 한 문장 적기</text>
        <text x="123" y="362">두 읽기 메모 펼치기</text>
        <text x="123" y="454">개념·비교의 위치 찾기</text>
      </g>
    </g>
    <g data-observe-id="activity-form">
      <path d="M530 221V502" stroke="#98b3bf" stroke-width="2"/>
      <text x="578" y="253" font-size="39" font-weight="600" letter-spacing="-.7">남길 기록</text>
      <text x="578" y="304" font-size="29" font-weight="530" fill="#537583">근거 위치</text>
      <text x="578" y="349" font-size="34" font-weight="580" letter-spacing="-.55">원자료 → 개념 → 비교</text>
      <path d="M578 370H935" stroke="#a5c0ca" stroke-width="2"/>
      <text x="578" y="411" font-size="29" font-weight="530" fill="#537583">다음 질문</text>
      <text x="578" y="456" font-size="34" font-weight="580" letter-spacing="-.55">30분이라면 무엇을</text>
      <text x="578" y="495" font-size="34" font-weight="580" letter-spacing="-.55">더 읽고 확인할까?</text>
      <path d="M578 515H935" stroke="#a5c0ca" stroke-width="2"/>
    </g>
    <text x="66" y="567" font-size="28" font-weight="480" fill="#4f747f">읽은 근거와 내 판단을 함께 적습니다.</text>
  </g>
</svg>
