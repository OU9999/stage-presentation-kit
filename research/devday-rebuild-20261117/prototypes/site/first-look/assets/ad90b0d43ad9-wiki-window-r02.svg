<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" data-material-kind="explanatory-reconstruction" role="img" aria-labelledby="title desc"><title id="title">여러 문서를 다시 읽는 같은 작업창</title><desc id="desc">왼쪽과 같은 외곽과 종횡비 안에 서로 연결된 문서 흔적을 더 조밀하게 놓았다. 원형 주제 표식·얇은 문서 경계·짧은 글줄은 왼쪽 답과 같은 그림 언어다. 내부 경계와 연결선의 대비를 높여 작은 발표폭에서도 바깥틀만 남지 않게 편집했다. 페이지 수·성과 측정·실제 제품 UI가 아닌 설명용 도식이다.</desc><rect x="13" y="13" width="694" height="378" rx="7" fill="#0d0d0f" stroke="#e5e2e8" stroke-width="1.7"/><path d="M14 57H706" stroke="#e5e2e8" stroke-width="1.5"/><g fill="#e8e4ed"><circle cx="33" cy="35" r="5"/><circle cx="51" cy="35" r="5"/><circle cx="69" cy="35" r="5"/></g>
