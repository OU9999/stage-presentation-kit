<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" data-material-kind="explanatory-reconstruction" role="img" aria-labelledby="title desc"><title id="title">서로 이어진 다시 읽을 문서</title><desc id="desc">첫 그림과 같은 크기·외곽의 설명용 작업창. 여섯 작은 문서면에 서로 다른 주제 표식과 짧은 글줄이 있고 열린 선으로 연결된다. 한 답의 연속된 글줄과 달리 다시 읽고 고칠 여러 문서의 형태를 먼저 보이게 한다. 문서 수와 색은 도식의 편집이며 실제 페이지 수·성과 측정·특정 UI 캡처가 아니다.</desc><rect x="13" y="13" width="694" height="378" rx="7" fill="#0d0d0f" stroke="#e5e2e8" stroke-width="1.7"/><path d="M14 57H706" stroke="#e5e2e8" stroke-width="1.5"/><g fill="#e8e4ed"><circle cx="33" cy="35" r="5"/><circle cx="51" cy="35" r="5"/><circle cx="69" cy="35" r="5"/></g>
