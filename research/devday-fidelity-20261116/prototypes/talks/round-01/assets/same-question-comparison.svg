<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" data-material-kind="explanatory-reconstruction" role="img" aria-labelledby="title desc">
  <title id="title">같은 질문에서 비교하는 두 교육용 작업 흐름</title>
  <desc id="desc">상단의 기본 검색-생성 예는 관련 원자료를 이번 입력에 모아 종합하여 이번 답을 만든다. 하단의 위키를 유지하는 예는 자료 반영 때 LLM Wiki, RAG와 위키, 다음 스터디의 첫 시도라는 연결 문서를 남기고 필요한 쪽을 읽어 이번 답을 만든다. 같은 원자료와 같은 질문의 비교이며 구현 UI나 실제 모델 출력이 아니다. RAG도 요약·답 저장·관계 정리를 붙일 수 있고 위키도 검색을 쓴다. 두 흐름은 함께 쓸 수 있으며 정확도·속도·비용의 우열을 측정하지 않는다. 화살표는 이 교육용 흐름의 작업 방향이며 실행 관측이나 시스템의 필수 순서가 아니다.</desc>
  <style>
    text{font-family:Arial,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;letter-spacing:-1.3px}
    .route{font-size:36px;fill:#b6b6b2;font-weight:400}
    .object{font-size:46px;fill:#f6f6f4;font-weight:500}
    .detail{font-size:34px;fill:#c3c9c8;font-weight:400}
    .document{font-size:37px;fill:#f6f6f4;font-weight:500}
    .paper{fill:#111b1f;stroke:#6e898f;stroke-width:1.5}
    .flow{fill:none;stroke:#b2b8b6;stroke-width:2.5;marker-end:url(#flow-arrow)}
  </style>
  <defs><marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1L6 4L1 7" fill="none" stroke="#b2b8b6" stroke-width="1.3"/></marker></defs>
  <text class="route" x="28" y="47">기본 검색-생성 예</text>
