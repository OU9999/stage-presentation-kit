    <path d="M48 102H272V226" fill="none" stroke="#626969" stroke-width="1.5"/>
    <text class="object" x="57" y="169">관련</text><text class="object" x="57" y="220">원자료</text>
  </g>
  <path class="flow" d="M292 176H425"/>
  <g data-object-id="current-input">
    <rect x="450" y="103" width="590" height="142" rx="2" fill="none" stroke="#8d9592" stroke-width="1.5"/>
    <text class="object" x="484" y="160">이번 입력</text>
    <text class="detail" x="484" y="212">현재 입력에서 종합</text>
  </g>
  <path class="flow" d="M1060 176H1171"/>
  <g data-object-id="current-answer-search">
    <path d="M1198 109H1390V243H1198Z" fill="#f2f0e8"/>
    <text x="1224" y="191" style="font-size:44px;fill:#202221;font-weight:500">이번 답</text>
  </g>
  <path d="M28 286H1412" fill="none" stroke="#353b39" stroke-width="1.3"/>
  <text class="route" x="28" y="337">위키를 유지하는 예</text>
  <g data-object-id="reflected-materials" data-source-role="related-raw-materials">
    <path d="M36 406H260V530H36Z" fill="#171919" stroke="#626969" stroke-width="1.5"/>
    <path d="M48 394H272V518" fill="none" stroke="#626969" stroke-width="1.5"/>
    <text class="object" x="57" y="461">관련</text><text class="object" x="57" y="512">원자료</text>
  </g>
  <path class="flow" d="M292 468H382"/>
