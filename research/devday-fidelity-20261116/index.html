<p class='reason' id='reason'></p>
<div class='scope'><p class='status'>사용자 반려 · 현재 미감 검수 실패</p><p>비교 화면은 네 대표 장면이며, 현재 본편20장 전체는 별도로 검수합니다. 과거 시안은 당시 반려와 교정 이력으로 보존했습니다. 내부 검수와 사용자 미감 승인은 구분합니다. 자료 내용은 발표팀의 설명용 구성 예입니다. <a href='../../presentations/llm-wiki/read.html'>읽기 화면</a> · <a href='main-04/present-1920/contact-01-08.jpg'>전체 흐름 1–8</a> · <a href='main-04/present-1920/contact-09-16.jpg'>9–16</a> · <a href='main-04/present-1920/contact-17-20.jpg'>17–20</a></p></div>
</main>
<script>
const data={"latest": "main-04", "roles": [{"name": "05 · 같은 질문의 비교", "target": 5, "ref": "evidence/official-XkKdbPhIvbY-90.png", "video": "https://www.youtube.com/watch?v=XkKdbPhIvbY&t=90s", "reference": "Codex · 01:30", "reason": "공통 절차를 묶고, 남아 다시 읽을 문서가 비교의 중심이 되게 편집했습니다.", "failure": "반려 원인: 원본은 같은 창 모형의 작업 형태 차이가 먼저 보입니다. 현재는 서로 다른 수준의 작업명과 긴 계획 발췌를 상자·분기·문장으로 풀어 비교를 해독하게 합니다. 구체 문서가 있다는 사실을 미감의 완성도로 오판했습니다."}, {"name": "07 · 문서의 관계", "target": 7, "ref": "evidence/official-XkKdbPhIvbY-210.png", "video": "https://www.youtube.com/watch?v=XkKdbPhIvbY&t=210s", "reference": "Codex · 03:30", "reason": "추상 범주보다 실제 문서 이름을 먼저 읽고, 세 무방향 관계를 따라가게 했습니다.", "failure": "반려 원인: 세 관계와 현재 문서명은 정확합니다. 그러나 큰 채움 판과 균일한 굵은 글자가 연결보다 무겁고, 두 문서와 긴 한 제목이 비슷한 글자 덩어리로 보입니다. 관계 보존을 좋은 관계면과 혼동했습니다."}, {"name": "13 · 한 문서와 한 행", "target": 13, "ref": "evidence/official-Fls_onRviPM-1500.png", "video": "https://www.youtube.com/watch?v=Fls_onRviPM&t=1500s", "reference": "Keynote · 25:00", "reason": "진행안의 정체성과 읽을 한 행을 묶었습니다. 첫 시안의 장점을 보존했습니다.", "failure": "반려 원인: 긴 제목·부제·필드·한 행을 확대한 워크시트입니다. 한 자료로 모이고 읽힌다는 것은 이 면의 타이포·행 묶음·비례가 정돈됐다는 증거가 아닙니다. 자료의 존재와 조형의 완성도를 혼동했습니다."}, {"name": "15 · 목적을 확인하는 근거", "target": 15, "ref": "evidence/official-Fls_onRviPM-1440.png", "video": "https://www.youtube.com/watch?v=Fls_onRviPM&t=1440s", "reference": "Keynote · 24:00", "reason": "원자료의 정체성과 선택 위치를 남기고, 질문과 정확 목적 구절에 무게를 줬습니다.", "failure": "반려 원인: 빈약한 문서 발췌와 긴 네 줄 인용의 병치입니다. 중복 시작구절·서로 다른 읽기 출발점·거친 비례가 남았습니다. 원자료와 인용이라는 두 역할의 존재를 원본과 같은 미감으로 오판했습니다."}], "rejected": true};let selected=0;
const byId=id=>document.getElementById(id);
data.roles.forEach((role,i)=>{const b=document.createElement('button');b.type='button';b.textContent=role.name;b.addEventListener('click',()=>{selected=i;render()});byId('tabs').append(b)});
function setImage(id,src){byId(id).src=src;byId(id+'Full').href=src}
function render(){const role=data.roles[selected],round=byId('round').value,width=byId('width').value,n=String(selected+1).padStart(2,'0');
[...byId('tabs').children].forEach((b,i)=>b.setAttribute('aria-pressed',i===selected?'true':'false'));
setImage('ref',role.ref);setImage('before','../llm-wiki-keynote-reset-20261113/main-05/present-1920/slide-'+String(role.target).padStart(2,'0')+'.png');setImage('after',round.startsWith('main-')?round+'/present-'+width+'/slide-'+String(role.target).padStart(2,'0')+'.png':'evidence/'+round+'/present-'+width+'/slide-'+n+'.png');
byId('refTitle').textContent='공식 원본 · '+role.reference;byId('newTitle').textContent=round.startsWith('main-')?'본편 검수 캡처 · '+round:round==='round-01'?'첫 시안 · 1·4 구조 반려':'두 번째 시안 · 구조 수정';
byId('video').href=role.video;byId('reason').textContent=data.rejected&&round.startsWith('main-')?role.failure:round==='round-01'?'첫 시안은 비교와 근거 화면의 반복 설명 때문에 구조 수정으로 반환됐습니다.':'당시 제작 의도(현재 미감 합격의 근거가 아닙니다): '+role.reason;
byId('deck').href=round.startsWith('main-')?'../../presentations/llm-wiki/#'+role.target:'prototypes/site/'+round+'/#'+(selected+1);
}byId('round').addEventListener('change',render);byId('width').addEventListener('change',render);render();
</script></html>
