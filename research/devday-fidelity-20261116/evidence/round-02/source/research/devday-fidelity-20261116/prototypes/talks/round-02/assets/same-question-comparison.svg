<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" data-material-kind="explanatory-reconstruction" role="img" aria-labelledby="title desc">
  <title id="title">같은 원자료와 이번 답 사이에서 비교하는 현재 입력과 남는 문서</title>
  <desc id="desc">공통 원자료와 이번 답을 각각 한 번만 놓고, 두 교육용 흐름의 다른 작업 대상을 비교한다. 기본 검색-생성 예는 현재 입력에서 종합한다. 위키를 유지하는 예는 남아 다시 읽는 문서가 있다. 세 좁은 문서 카드를 한 넓은 계획 문서 발췌로 대체했다. 팩의 wiki/syntheses/study-plan.md 처음 구간에서 다음 스터디의 첫 시도라는 제목과 참여자 배경과 활동 길이는 아직 미정이다라는 문장을 정확 발췌했다. 조건 추가 전 처음 계획이며 입문자15분 조건을 반영한 최종 계획이 아니다. 두 흐름 모두 이번 답을 만든다. RAG도 요약·답 저장·관계 정리를 붙일 수 있고 위키도 검색을 쓰며 함께 쓸 수 있다. 실제 실행 UI·모델 답·성능 비교가 아닌 발표팀의 설명용 재구성이다.</desc>
