    const slots = [[1,1,3,2],[4,1,3,2],[7,1,3,2],[10,1,3,4],[1,3,2,2],[3,3,2,2],[5,3,2,2],[7,3,3,2],[1,5,3,2],[4,5,3,2],[7,5,3,2],[10,5,3,2]];
    const descriptions = {
      a: ['A · 동일자산 배치비교 — 현재의 공통 경계 처리', '현재 #4와 같은 12개 자산·수치·문구·배치·fit으로 재구성했습니다. 모든 칸에 같은 중립선과 wash를 둡니다. 실제 제품의 정확한 복제 화면은 아닙니다.'],
      b: ['B · 동일자산 배치비교 — 미디어별 경계만 분리', 'A와 자산·텍스트·위치·크롭·가터가 같습니다. 어두운 문자·수치에만 약한 구조선을 남기고, 사진과 UI는 공통 wrapper의 선·wash를 걷었습니다. 자산 내부의 프레임과 contain 여백은 그대로라서, 경계만 바꿨을 때의 한계도 보입니다.'],
      c: ['C · 권장 편집 — 소재까지 바꾼 별도안', '같은 배치 뼈대에 ‘관찰 기록 → 주제 정리 → 다음 행동’이라는 한 이야기를 넣었습니다. 오른쪽 완성 보고서가 주역, 가운데 실행 UI가 보조입니다. 가상 수치는 서로 다른 작업 단위이며 전환율을 뜻하지 않습니다. A/B와 달리 콘텐츠·크롭·타이포도 달라진 편집안입니다.']
    };
    const slide = document.getElementById('slide');
    const tiles = document.getElementById('tiles');
    const viewport = document.getElementById('viewport');
    if (new URLSearchParams(location.search).get('view') === 'full') document.body.classList.add('full-view');
    function scale() { slide.style.transform = 'scale(' + (viewport.clientWidth / 1600) + ')'; }
    function show(requested) {
      const view = Object.hasOwn(descriptions, requested) ? requested : 'c';
      slide.dataset.variant = view;
      tiles.replaceChildren(document.getElementById(view === 'c' ? 'edited-template' : 'current-template').content.cloneNode(true));
      [...tiles.children].forEach((tile, i) => {
        const [column,row,columnSpan,rowSpan] = slots[i];
        tile.style.gridColumn = column + ' / span ' + columnSpan;
        tile.style.gridRow = row + ' / span ' + rowSpan;
      });
      document.querySelectorAll('[data-view]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
      document.getElementById('note-title').textContent = descriptions[view][0];
      document.getElementById('note-copy').textContent = descriptions[view][1];
      document.getElementById('source').textContent = view === 'c' ? 'Field Notes · 한 프로젝트의 결과물을 회수하는 가상 예제 · 자체 제작 UI·문서·도식 + Pexels 스톡 사진' : '구성용 가상 수치 · 자체 제작 UI와 시각물 · Pexels 스톡 사진';
      document.getElementById('expand').href = '?view=full#' + view;
      slide.setAttribute('aria-label', descriptions[view][0]);
      scale();
    }
    document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => {
      history.replaceState(null, '', location.pathname + location.search + '#' + button.dataset.view);
      show(button.dataset.view);
    }));
    window.addEventListener('hashchange', () => show(location.hash.slice(1)));
    new ResizeObserver(scale).observe(viewport);
    show(location.hash.slice(1));
  })();
</script>
</body>
</html>
