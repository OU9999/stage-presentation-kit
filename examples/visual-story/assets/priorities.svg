<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="priority-title priority-desc" font-family="-apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif"><title id="priority-title">예상 영향과 노력의 기획 점수</title><desc id="priority-desc">시작 템플릿: 예상 영향 5점, 노력 2점, 먼저 검증. 다음 행동 안내: 예상 영향 4점, 노력 2점, 먼저 검증. 공유 미리보기: 예상 영향 4점, 노력 3점, 함께 검증. 대시보드 확장: 예상 영향 2점, 노력 5점, 뒤로 배치. 주관적 기획 판단이며 실제 효과 측정값이 아니다.</desc><rect width="1280" height="640" fill="#080808"/><text x="90" y="62" font-size="28" fill="#a4a4a1" text-anchor="start" font-weight="400">예상 영향 ↑</text><text x="780" y="62" font-size="26" fill="#a4a4a1" text-anchor="start" font-weight="400">가상 기획 판단 · 측정 성과 아님</text><line x1="120" y1="125" x2="120" y2="505" stroke="#353535" stroke-width="2"/><line x1="120" y1="505" x2="640" y2="505" stroke="#353535" stroke-width="2"/><text x="120" y="548" font-size="28" fill="#a4a4a1" text-anchor="middle" font-weight="400">1</text><text x="92" y="515" font-size="28" fill="#a4a4a1" text-anchor="end" font-weight="400">1</text><line x1="250" y1="125" x2="250" y2="505" stroke="#353535" stroke-width="2"/><line x1="120" y1="410" x2="640" y2="410" stroke="#353535" stroke-width="2"/><text x="250" y="548" font-size="28" fill="#a4a4a1" text-anchor="middle" font-weight="400">2</text><text x="92" y="420" font-size="28" fill="#a4a4a1" text-anchor="end" font-weight="400">2</text><line x1="380" y1="125" x2="380" y2="505" stroke="#353535" stroke-width="2"/><line x1="120" y1="315" x2="640" y2="315" stroke="#353535" stroke-width="2"/><text x="380" y="548" font-size="28" fill="#a4a4a1" text-anchor="middle" font-weight="400">3</text><text x="92" y="325" font-size="28" fill="#a4a4a1" text-anchor="end" font-weight="400">3</text><line x1="510" y1="125" x2="510" y2="505" stroke="#353535" stroke-width="2"/><line x1="120" y1="220" x2="640" y2="220" stroke="#353535" stroke-width="2"/><text x="510" y="548" font-size="28" fill="#a4a4a1" text-anchor="middle" font-weight="400">4</text><text x="92" y="230" font-size="28" fill="#a4a4a1" text-anchor="end" font-weight="400">4</text><line x1="640" y1="125" x2="640" y2="505" stroke="#353535" stroke-width="2"/><line x1="120" y1="125" x2="640" y2="125" stroke="#353535" stroke-width="2"/><text x="640" y="548" font-size="28" fill="#a4a4a1" text-anchor="middle" font-weight="400">5</text><text x="92" y="135" font-size="28" fill="#a4a4a1" text-anchor="end" font-weight="400">5</text><text x="640" y="592" font-size="28" fill="#a4a4a1" text-anchor="end" font-weight="400">노력 · 1–5점 →</text><circle cx="250" cy="125" r="23" fill="#69cf82"/><text x="250" y="134" font-size="26" fill="#080808" text-anchor="middle" font-weight="600">01</text><circle cx="800" cy="140" r="22" fill="#69cf82"/><text x="800" y="149" font-size="26" fill="#080808" text-anchor="middle" font-weight="600">01</text><text x="840" y="149" font-size="30" fill="#69cf82" text-anchor="start" font-weight="400">시작 템플릿</text><text x="840" y="188" font-size="26" fill="#a4a4a1" text-anchor="start" font-weight="400">영향 5 · 노력 2 · 먼저 검증</text><circle cx="250" cy="220" r="23" fill="#24a8ff"/><text x="250" y="229" font-size="26" fill="#080808" text-anchor="middle" font-weight="600">02</text><circle cx="800" cy="250" r="22" fill="#24a8ff"/><text x="800" y="259" font-size="26" fill="#080808" text-anchor="middle" font-weight="600">02</text><text x="840" y="259" font-size="30" fill="#24a8ff" text-anchor="start" font-weight="400">다음 행동 안내</text><text x="840" y="298" font-size="26" fill="#a4a4a1" text-anchor="start" font-weight="400">영향 4 · 노력 2 · 먼저 검증</text><circle cx="380" cy="220" r="23" fill="#a080ff"/><text x="380" y="229" font-size="26" fill="#080808" text-anchor="middle" font-weight="600">03</text><circle cx="800" cy="360" r="22" fill="#a080ff"/><text x="800" y="369" font-size="26" fill="#080808" text-anchor="middle" font-weight="600">03</text><text x="840" y="369" font-size="30" fill="#a080ff" text-anchor="start" font-weight="400">공유 미리보기</text><text x="840" y="408" font-size="26" fill="#a4a4a1" text-anchor="start" font-weight="400">영향 4 · 노력 3 · 함께 검증</text><circle cx="640" cy="410" r="23" fill="#a4a4a1"/><text x="640" y="419" font-size="26" fill="#080808" text-anchor="middle" font-weight="600">04</text><circle cx="800" cy="470" r="22" fill="#a4a4a1"/><text x="800" y="479" font-size="26" fill="#080808" text-anchor="middle" font-weight="600">04</text><text x="840" y="479" font-size="30" fill="#a4a4a1" text-anchor="start" font-weight="400">대시보드 확장</text><text x="840" y="518" font-size="26" fill="#a4a4a1" text-anchor="start" font-weight="400">영향 2 · 노력 5 · 뒤로 배치</text></svg>