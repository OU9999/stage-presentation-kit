<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="effort-title effort-desc" font-family="-apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif"><title id="effort-title">역할과 기간별 투입 계획</title><desc id="effort-desc">한 사람의 1주 전일 투입에 해당하는 계획량. 프로젝트 경과 주수와 다릅니다. 역할별 합계는 조사 6인·주, 설계 6인·주, 개발·품질 점검 6인·주. 전체 18인·주이며 프로젝트 경과 주수와 다른 단위다.</desc><rect width="1280" height="640" fill="#080808"/><text x="40" y="57" font-size="28" fill="#a4a4a1" text-anchor="start" font-weight="400">가상 투입 계획 · 인·주</text><text x="1210" y="57" font-size="34" fill="#f6f6f4" text-anchor="end" font-weight="400">총 18인·주</text><text x="435" y="110" font-size="28" fill="#f6f6f4" text-anchor="middle" font-weight="400">기준</text><text x="645" y="110" font-size="28" fill="#f6f6f4" text-anchor="middle" font-weight="400">변경 적용</text><text x="855" y="110" font-size="28" fill="#f6f6f4" text-anchor="middle" font-weight="400">후반 관찰</text><text x="1110" y="110" font-size="28" fill="#a4a4a1" text-anchor="middle" font-weight="400">역할 합계</text><text x="40" y="218" font-size="30" fill="#f6f6f4" text-anchor="start" font-weight="400">조사</text><rect x="334" y="157" width="202" height="97" rx="4" fill="#24a8ff" stroke="none" stroke-width="2"/><text x="435" y="222" font-size="46" fill="#080808" text-anchor="middle" font-weight="500">3</text><rect x="544" y="157" width="202" height="97" rx="4" fill="#2181c1" stroke="none" stroke-width="2"/><text x="645" y="222" font-size="46" fill="#080808" text-anchor="middle" font-weight="500">2</text><rect x="754" y="157" width="202" height="97" rx="4" fill="#1d5b83" stroke="none" stroke-width="2"/><text x="855" y="222" font-size="46" fill="#f6f6f4" text-anchor="middle" font-weight="500">1</text><text x="1110" y="222" font-size="40" fill="#f6f6f4" text-anchor="middle" font-weight="400">6</text><text x="40" y="323" font-size="30" fill="#f6f6f4" text-anchor="start" font-weight="400">설계</text><rect x="334" y="262" width="202" height="97" rx="4" fill="#1d5b83" stroke="none" stroke-width="2"/><text x="435" y="327" font-size="46" fill="#f6f6f4" text-anchor="middle" font-weight="500">1</text><rect x="544" y="262" width="202" height="97" rx="4" fill="#24a8ff" stroke="none" stroke-width="2"/><text x="645" y="327" font-size="46" fill="#080808" text-anchor="middle" font-weight="500">3</text><rect x="754" y="262" width="202" height="97" rx="4" fill="#2181c1" stroke="none" stroke-width="2"/><text x="855" y="327" font-size="46" fill="#080808" text-anchor="middle" font-weight="500">2</text><text x="1110" y="327" font-size="40" fill="#f6f6f4" text-anchor="middle" font-weight="400">6</text><text x="40" y="428" font-size="30" fill="#f6f6f4" text-anchor="start" font-weight="400">개발·품질 점검</text><rect x="334" y="367" width="202" height="97" rx="4" fill="#1d5b83" stroke="none" stroke-width="2"/><text x="435" y="432" font-size="46" fill="#f6f6f4" text-anchor="middle" font-weight="500">1</text><rect x="544" y="367" width="202" height="97" rx="4" fill="#2181c1" stroke="none" stroke-width="2"/><text x="645" y="432" font-size="46" fill="#080808" text-anchor="middle" font-weight="500">2</text><rect x="754" y="367" width="202" height="97" rx="4" fill="#24a8ff" stroke="none" stroke-width="2"/><text x="855" y="432" font-size="46" fill="#080808" text-anchor="middle" font-weight="500">3</text><text x="1110" y="432" font-size="40" fill="#f6f6f4" text-anchor="middle" font-weight="400">6</text><line x1="40" y1="482" x2="1210" y2="482" stroke="#353535" stroke-width="2"/><text x="40" y="530" font-size="30" fill="#a4a4a1" text-anchor="start" font-weight="400">기간 합계</text><text x="435" y="530" font-size="40" fill="#f6f6f4" text-anchor="middle" font-weight="400">5</text><text x="645" y="530" font-size="40" fill="#f6f6f4" text-anchor="middle" font-weight="400">7</text><text x="855" y="530" font-size="40" fill="#f6f6f4" text-anchor="middle" font-weight="400">6</text><text x="11