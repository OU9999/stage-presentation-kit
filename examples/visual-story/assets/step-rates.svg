<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="visual-step-rates-title visual-step-rates-desc" font-family="-apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif"><title id="visual-step-rates-title">직전 단계 전환율 비교</title><desc id="visual-step-rates-desc">신규 가입에서 프로젝트 시작: 70%에서 80%, 차이 +10%p. 프로젝트 시작에서 초안 완성: 71.4%에서 81.3%, 차이 +9.8%p. 초안 완성에서 첫 프로젝트 공유: 70%에서 84.6%, 차이 +14.6%p. 원본 인원으로 각각 계산한 가상 전후 관찰이다.</desc><rect width="1280" height="640" fill="#080808"/><rect x="470" y="26" width="28" height="14" fill="#686866" /><text x="512" y="48" font-size="28" fill="#a4a4a1" text-anchor="start" font-weight="400">기준 · W1–W4</text><rect x="850" y="26" width="28" height="14" fill="#24a8ff" /><text x="892" y="48" font-size="28" fill="#f6f6f4" text-anchor="start" font-weight="400">후반 관찰 · W9–W12</text><line x1="470" y1="110" x2="470" y2="515" stroke="#353535" /><text x="470" y="557" font-size="26" fill="#a4a4a1" text-anchor="middle" font-weight="400">0%</text><line x1="775" y1="110" x2="775" y2="515" stroke="#353535" /><text x="775" y="557" font-size="26" fill="#a4a4a1" text-anchor="middle" font-weight="400">50%</text><line x1="1080" y1="110" x2="1080" y2="515" stroke="#353535" /><text x="1080" y="557" font-size="26" fill="#a4a4a1" text-anchor="middle" font-weight="400">100%</text><text x="30" y="153" font-size="30" fill="#f6f6f4" text-anchor="start" font-weight="400">신규 가입 → 프로젝트</text><text x="30" y="188" font-size="30" fill="#f6f6f4" text-anchor="start" font-weight="400">시작</text><rect x="470" y="143" width="610" height="24" fill="#171717" /><rect x="470" y="143" width="427" height="24" fill="#686866" /><text x="1230" y="167" font-size="32" fill="#a4a4a1" text-anchor="end" font-weight="400">70%</text><rect x="470" y="183" width="610" height="24" fill="#171717" /><rect x="470" y="183" width="488" height="24" fill="#24a8ff" opacity=".62"/><text x="1230" y="207" font-size="32" fill="#f6f6f4" text-anchor="end" font-weight="400">80%</text><text x="30" y="288" font-size="30" fill="#f6f6f4" text-anchor="start" font-weight="400">프로젝트 시작 → 초안</text><text x="30" y="323" font-size="30" fill="#f6f6f4" text-anchor="start" font-weight="400">완성</text><rect x="470" y="278" width="610" height="24" fill="#171717" /><rect x="470" y="278" width="435.7142857142857" height="24" fill="#686866" /><text x="1230" y="302" font-size="32" fill="#a4a4a1" text-anchor="end" font-weight="400">71.4%</text><rect x="470" y="318" width="610" height="24" fill="#171717" /><rect x="470" y="318" width="495.625" height="24" fill="#24a8ff" opacity=".62"/><text x="1230" y="342" font-size="32" fill="#f6f6f4" text-anchor="end" font-weight="400">81.3%</text><text x="30" y="423" font-size="30" fill="#f6f6f4" text-anchor="start" font-weight="400">초안 완성 → 첫</text><text x="30" y="458" font-size="30" fill="#f6f6f4" text-anchor="start" font-weight="400">프로젝트 공유</text><rect x="470" y="413" width="610" height="24" fill="#171717" /><rect x="470" y="413" width="427" height="24" fill="#686866" /><text x="1230" y="437" font-size="32" fill="#a4a4a1" text-anchor="end" font-weight="400">70%</text><rect x="470" y="453" width="610" height="24" fill="#171717" /><rect x="470" y="453" width="516.1538461538462" height="24" fill="#24a8ff" /><text x="1230" y="477" font-size="32" fill="#f6f6f4" text-anchor="end" font-weight="400">84.6%</text><text x="30" y="623" font-size="32" fill="#24a8ff" text-anchor="start" font-weight="400">가장 큰 관찰 차이 +14.6%p</text><text x="1240" y="623" font-size="26" fill="#a4a4a1" text-anchor="end" font-weight="400">분모: 각 구간의 직전 단계 인원</text></svg>